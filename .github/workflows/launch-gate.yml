name: Launch Gate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ALLOW_DB_TESTS: ${{ secrets.TEST_DATABASE_URL != '' && 'true' || 'false' }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run launch gate
        run: npm test

      - name: Syntax spot checks
        run: |
          node --check server.js
          node --check routes/subscriptions.js
          node --check services/subscriptionEngine.js
          node --check scripts/integrity-audit.js
