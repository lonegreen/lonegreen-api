<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Worker App</title>
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/app-shell.css">
  
</head>
<body class="phase2-internal fx-layout-public">
<div class="page fx-min-w-0">
  <div class="hero">
    <h1>Worker App</h1>
    <p>Today's assigned jobs only. Open the route, add a quick note, and tap once to start or complete work.</p>
  </div>

  <div class="worker-badge" id="workerBadge">Worker: --</div>

  <div class="worker-bar" id="workerPicker">
    <select id="workerSelect"></select>
    <button type="button" class="btn primary fx-btn" id="workerBtnOpenJobs">Open Today's Jobs</button>
  </div>

  <div id="workerHint" class="page-hint" style="display:none;">
    <strong>Choose a worker to begin.</strong>
    <p>Select an active worker above to open today's assigned route.</p>
  </div>

  <div class="panel fx-card">
    <div class="route-summary" id="routeSummary">
      <div class="summary-box"><div class="summary-label">Assigned</div><div class="summary-value" id="assignedCount">0</div></div>
      <div class="summary-box"><div class="summary-label">In Progress</div><div class="summary-value" id="progressCount">0</div></div>
      <div class="summary-box"><div class="summary-label">Completed</div><div class="summary-value" id="completedCount">0</div></div>
    </div>
  </div>

  <div class="panel fx-card">
    <div class="job-list" id="list">Loading...</div>
  </div>
</div>

<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/format.js"></script>
<script>
const API = window.location.origin;
let jobs = [];
let workers = [];

const getToken = AppAuth.getToken;

function getCurrentUser(){
  return AppAuth.getUser() || {};
}

function isWorkerUser(){
  return getCurrentUser().role === "worker";
}

function tokenWorkerId(){
  const user = getCurrentUser();
  return user.worker_id || user.workerId || "";
}

function workerStorageKey(){
  const user = getCurrentUser();
  return "workerId:" + (user.id || "guest");
}

async function apiFetch(url, options = {}){
  return AppAPI.fetch(url, options);
}

function currentWorkerId(){
  if(isWorkerUser()){
    return String(tokenWorkerId() || "");
  }

  return localStorage.getItem(workerStorageKey()) || "";
}

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>\"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}

function rawText(value, fallback = ""){
  const text = value === undefined || value === null ? "" : String(value);
  return text || fallback;
}

function safeText(value, fallback = ""){
  return escapeHtml(rawText(value, fallback));
}

function textareaText(value){
  return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function safeStatusClass(status){
  return String(status || "scheduled").replace(/[^a-z_]/g, "") || "scheduled";
}

async function safeJson(res){
  try {
    return await res.json();
  } catch {
    try {
      const text = await res.text();
      return { error: text || "Request failed." };
    } catch {
      return { error: "Request failed." };
    }
  }
}

function getErrorMessage(data, fallback){
  if(data && typeof data.error === "string" && data.error.trim()) return data.error;
  if(data && typeof data.message === "string" && data.message.trim()) return data.message;
  return fallback;
}

function renderInlineError(title, message, actionsHtml = ""){
  return `
    <div class="empty fx-empty">
      <strong>${safeText(title)}</strong>
      <div>${safeText(message)}</div>
      ${actionsHtml ? `<div style="margin-top:12px;">${actionsHtml}</div>` : ""}
    </div>
  `;
}

function workerEmptyState(title, message, actions){
  const actionHtml = (actions || []).map(a => {
    const key = a.dataWorkerEmpty;
    if(!key) return "";
    return `<button type="button" class="${escapeHtml(a.className || "btn primary fx-btn")}" data-worker-empty="${escapeHtml(key)}">${escapeHtml(a.label || "Action")}</button>`;
  }).join("");
  return `
    <div class="empty fx-empty">
      <strong>${safeText(title)}</strong>
      <div>${safeText(message)}</div>
      ${actionHtml ? `<div style="margin-top:12px;">${actionHtml}</div>` : ""}
    </div>
  `;
}

function saveWorkerChoice(){
  if(isWorkerUser()) return;

  localStorage.setItem(workerStorageKey(), document.getElementById("workerSelect").value);
  AppUI.showToast("Worker selected.", "success");
  loadJobs();
}

function formatTime(value){
  return AppFormat.formatTime(value) || "";
}

function formatTimeRange(start, end){
  return AppFormat.formatTimeRange(start, end) || "Time not set";
}

function statusLabel(status){
  return String(status || "scheduled").replace(/_/g, " ");
}

function callHref(phone){
  return "tel:" + String(phone || "").replace(/[^+\d]/g, "");
}

function mapHref(address){
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(address || "");
}

function renderWorkers(){
  const select = document.getElementById("workerSelect");
  const picker = document.getElementById("workerPicker");
  const active = workers.find(worker => String(worker.id) === String(currentWorkerId()));

  if(isWorkerUser()){
    picker.style.display = "none";
  } else {
    picker.style.display = "grid";

    select.innerHTML = '<option value="">Select worker</option>' + workers
      .filter(worker => worker.active !== false)
      .map(worker => `
        <option value="${escapeHtml(worker.id)}" ${String(worker.id) === String(currentWorkerId()) ? "selected" : ""}>
          ${safeText(worker.name, "Worker #" + worker.id)}
        </option>
      `)
      .join("");
  }

  document.getElementById("workerBadge").textContent = active
    ? "Worker: " + rawText(active.name, "Worker #" + active.id)
    : (isWorkerUser() ? "Worker route" : "Worker: --");

  document.getElementById("workerHint").style.display = active || isWorkerUser() ? "none" : "block";
}

function renderSummary(){
  document.getElementById("assignedCount").textContent = jobs.length;
  document.getElementById("progressCount").textContent = jobs.filter(job => job.status === "in_progress").length;
  document.getElementById("completedCount").textContent = jobs.filter(job => job.status === "completed").length;
}

function toggleDetails(id){
  const detail = document.getElementById("details_" + id);
  if(detail) detail.classList.toggle("open");
}

function renderJobs(){
  renderSummary();

  const list = document.getElementById("list");

  if(!jobs.length){
    list.innerHTML = workerEmptyState(
      currentWorkerId() ? "No assigned jobs for today." : "Choose a worker to view today's jobs.",
      currentWorkerId() ? "This route is clear right now." : "Select an active worker above to load today's assigned jobs.",
      currentWorkerId()
        ? [{ label: "Refresh", dataWorkerEmpty: "refresh", className: "btn primary fx-btn" }]
        : [{ label: "Select Worker", dataWorkerEmpty: "focus-worker", className: "btn primary fx-btn" }]
    );
    return;
  }

  list.innerHTML = jobs.map(job => {
    const phone = job.client_phone || "";
    const address = job.client_address || job.address || "";
    const isComplete = job.status === "completed";
    const jobId = Number(job.id);

    return `
      <div class="job ${isComplete ? "completed-card" : ""}">
        <div class="job-top">
          <div>
            <h3 class="job-title">${safeText(job.client_name, "Client")}</h3>
            <div class="job-service">${safeText(job.service, "Service")}</div>
            ${phone ? `<div class="job-phone">${safeText(phone)}</div>` : ""}
            ${address ? `<div class="job-address">${safeText(address)}</div>` : ""}
            <div class="job-time">${safeText(formatTimeRange(job.start_time, job.end_time))}</div>
          </div>
          <div class="status ${safeStatusClass(job.status)}">${safeText(statusLabel(job.status))}</div>
        </div>

        <div class="quick-links">
          ${phone ? `<a class="quick-link" href="${escapeHtml(callHref(phone))}">Call Client</a>` : `<span class="quick-link">No Phone</span>`}
          ${address ? `<a class="quick-link" href="${escapeHtml(mapHref(address))}" target="_blank" rel="noopener">Open Map</a>` : `<span class="quick-link">No Address</span>`}
        </div>

        <button type="button" class="btn secondary fx-btn" data-worker-job-action="toggle-details" data-job-id="${jobId}">Job Details</button>

        <div class="details" id="details_${jobId}">
          <div class="detail-grid">
            <div class="detail"><span>Client</span>${safeText(job.client_name, "Client")}</div>
            <div class="detail"><span>Phone</span>${safeText(phone, "No phone")}</div>
            <div class="detail"><span>Service</span>${safeText(job.service, "Service")}</div>
            <div class="detail"><span>Time</span>${safeText(formatTimeRange(job.start_time, job.end_time))}</div>
            <div class="detail"><span>Address</span>${safeText(address, "No address")}</div>
            <div class="detail"><span>Status</span>${safeText(statusLabel(job.status))}</div>
          </div>
        </div>

        <textarea id="notes_${jobId}" class="notes-box" placeholder="Add a quick note...">${textareaText(job.internal_notes)}</textarea>

        <div class="actions">
          <button type="button" class="btn save-btn fx-btn" data-worker-job-action="save-notes" data-job-id="${jobId}">Save Notes</button>
          <button type="button" class="btn start-btn fx-btn" data-worker-job-action="update-job" data-job-id="${jobId}" data-status="in_progress" ${isComplete ? "disabled" : ""}>Start Job</button>
          <button type="button" class="btn done-btn fx-btn" data-worker-job-action="update-job" data-job-id="${jobId}" data-status="completed" ${isComplete ? "disabled" : ""}>${isComplete ? "Completed" : "Complete Job"}</button>
        </div>
      </div>
    `;
  }).join("");
}

async function saveNotes(id, button){
  const notes = (document.getElementById("notes_" + id)?.value || "").trim();

  await AppUI.withButton(button, async () => {
    const res = await apiFetch(API + "/ops/worker-jobs/" + id, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        internal_notes: notes,
        worker_id: currentWorkerId() ? Number(currentWorkerId()) : null
      })
    });

    const data = await safeJson(res);

    if(!res.ok){
      AppUI.showToast(getErrorMessage(data, "Unable to save notes."), "error");
      return;
    }

    AppUI.showToast("Notes saved.", "success");
    await loadJobs();
  }, { loading: "Saving..." });
}

async function updateJob(id, status, button){
  const notes = (document.getElementById("notes_" + id)?.value || "").trim();

  await AppUI.withButton(button, async () => {
    const res = await apiFetch(API + "/ops/worker-jobs/" + id, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        status,
        internal_notes: notes,
        worker_id: currentWorkerId() ? Number(currentWorkerId()) : null
      })
    });

    const data = await safeJson(res);

    if(!res.ok){
      AppUI.showToast(getErrorMessage(data, "Unable to update job."), "error");
      return;
    }

    AppUI.showToast(status === "completed" ? "Job completed." : "Job started.", "success");
    await loadJobs();
  }, { loading: status === "completed" ? "Completing..." : "Starting..." });
}

async function loadJobs(){
  if(!currentWorkerId()){
    jobs = [];
    renderSummary();

    document.getElementById("list").innerHTML = workerEmptyState(
      "Choose a worker to view today's jobs.",
      "Select an active worker above to open today's assigned route.",
      [{ label: "Select Worker", dataWorkerEmpty: "focus-worker", className: "btn primary fx-btn" }]
    );

    renderWorkers();
    return;
  }

  AppUI.setLoading(true, "Loading today's jobs...");

  try {
    const res = await apiFetch(API + "/ops/worker-jobs/" + encodeURIComponent(currentWorkerId()));
    const data = await safeJson(res);

    if(!res.ok){
      jobs = [];
      renderSummary();
      renderWorkers();

      document.getElementById("list").innerHTML = renderInlineError(
        "Unable to load today's jobs",
        getErrorMessage(data, "Please refresh and try again."),
        `<button type="button" class="btn primary fx-btn" data-worker-empty="reload">Refresh</button>`
      );

      AppUI.showToast(getErrorMessage(data, "Unable to load today's jobs."), "error");
      return;
    }

    jobs = Array.isArray(data) ? data : [];
    renderWorkers();
    renderJobs();
  } catch(err){
    jobs = [];
    renderSummary();
    renderWorkers();

    document.getElementById("list").innerHTML = renderInlineError(
      "Unable to load today's jobs",
      "Please refresh and try again.",
      `<button type="button" class="btn primary fx-btn" data-worker-empty="load-jobs">Refresh</button>`
    );

    AppUI.showToast("Unable to load today's jobs.", "error");
  } finally {
    AppUI.setLoading(false);
  }
}

async function load(){
  AppUI.setLoading(true, "Loading workers...");

  try {
    if(isWorkerUser()){
      const workerId = tokenWorkerId();
      const user = getCurrentUser();

      workers = workerId
        ? [{
            id: workerId,
            name: user.worker_name || user.name || user.username || ("Worker #" + workerId),
            active: true
          }]
        : [];

      renderWorkers();
      await loadJobs();
      return;
    }

    const res = await apiFetch(API + "/ops/workers");
    const data = await safeJson(res);

    if(!res.ok){
      workers = [];
      jobs = [];
      renderWorkers();
      renderSummary();

      document.getElementById("list").innerHTML = renderInlineError(
        "Unable to load workers",
        getErrorMessage(data, "Please refresh and try again."),
        `<button type="button" class="btn primary fx-btn" data-worker-empty="load-app">Refresh</button>`
      );

      AppUI.showToast(getErrorMessage(data, "Unable to load workers."), "error");
      return;
    }

    workers = Array.isArray(data) ? data : [];
    renderWorkers();
    await loadJobs();
  } catch(err){
    workers = [];
    jobs = [];
    renderWorkers();
    renderSummary();

    document.getElementById("list").innerHTML = renderInlineError(
      "Unable to load workers",
      "Please refresh and try again.",
      `<button type="button" class="btn primary fx-btn" data-worker-empty="load-app">Refresh</button>`
    );

    AppUI.showToast("Unable to load workers.", "error");
  } finally {
    AppUI.setLoading(false);
  }
}

function handleWorkerDelegatedClick(ev){
  const jobBtn = ev.target.closest("[data-worker-job-action]");
  if(jobBtn){
    const act = jobBtn.getAttribute("data-worker-job-action");
    const jid = Number(jobBtn.getAttribute("data-job-id"));
    if(act === "toggle-details") toggleDetails(jid);
    else if(act === "save-notes") saveNotes(jid, jobBtn);
    else if(act === "update-job") updateJob(jid, jobBtn.getAttribute("data-status"), jobBtn);
    return;
  }
  const emptyBtn = ev.target.closest("[data-worker-empty]");
  if(!emptyBtn) return;
  const k = emptyBtn.getAttribute("data-worker-empty");
  if(k === "refresh" || k === "reload") loadJobs();
  else if(k === "load-jobs") loadJobs();
  else if(k === "load-app") load();
  else if(k === "focus-worker") document.getElementById("workerSelect").focus();
}

function bindWorkerUiHandlers(){
  document.getElementById("workerBtnOpenJobs").addEventListener("click", () => saveWorkerChoice());
  document.getElementById("list").addEventListener("click", handleWorkerDelegatedClick);
}

bindWorkerUiHandlers();
load();
</script>
</body>
</html>
