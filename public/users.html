<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users</title>
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/app-shell.css">
  <style>
    * { box-sizing: border-box; }

    :root {
      --fl-orange: #FF5A00;
      --fl-orange-hover: #E64A00;
      --fl-orange-light: #FF8A33;
      --fl-black: #111111;
      --fl-dark: #2B2B2B;
      --fl-border: #D9D9D9;
      --fl-bg: #F5F5F5;
      --fl-white: #FFFFFF;
      --fl-success: #16A34A;
      --fl-warning: #F59E0B;
      --fl-error: #DC2626;
      --shadow: 0 18px 50px rgba(17, 17, 17, 0.08);
      --shadow-soft: 0 10px 28px rgba(17, 17, 17, 0.06);
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255, 90, 0, 0.13), transparent 30%),
        radial-gradient(circle at top right, rgba(255, 138, 51, 0.10), transparent 28%),
        linear-gradient(180deg, #ffffff 0%, #f5f5f5 42%, #fbfbfb 100%);
      padding: 24px;
      color: var(--fl-black);
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
    }

    .hero {
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-end;
      padding: 26px;
      margin-bottom: 18px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(255, 250, 247, 0.92)),
        radial-gradient(circle at 90% 20%, rgba(255, 90, 0, 0.14), transparent 32%);
      border: 1px solid rgba(217, 217, 217, 0.9);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 5px;
      background: linear-gradient(90deg, #FF5A00, #FF7A1A);
    }

    .hero > * {
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(34px, 4vw, 52px);
      color: var(--fl-black);
      letter-spacing: -0.06em;
      line-height: 0.98;
      font-weight: 950;
    }

    h2 {
      margin: 0 0 16px;
      color: var(--fl-black);
      font-size: 20px;
      letter-spacing: -0.035em;
      line-height: 1.2;
    }

    p {
      margin: 0;
      color: #5f6368;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      padding: 20px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(217, 217, 217, 0.92);
      border-radius: 24px;
      box-shadow: var(--shadow-soft);
      min-width: 0;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 7px;
      font-weight: 900;
      color: var(--fl-dark);
      font-size: 13px;
    }

    input,
    select {
      width: 100%;
      padding: 12px 13px;
      border-radius: 14px;
      border: 1px solid rgba(217, 217, 217, 0.95);
      background: white;
      color: var(--fl-black);
      font: inherit;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease, opacity .15s ease;
    }

    input:focus,
    select:focus {
      border-color: var(--fl-orange);
      box-shadow: 0 0 0 4px rgba(255, 90, 0, 0.14);
    }

    select:disabled,
    input:disabled {
      opacity: .55;
      cursor: not-allowed;
      background: #f6f6f6;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid rgba(217, 217, 217, 0.9);
      border-radius: 18px;
      background: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
    }

    th,
    td {
      padding: 13px 12px;
      border-bottom: 1px solid rgba(217, 217, 217, 0.85);
      text-align: left;
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: rgba(255, 90, 0, 0.035);
    }

    th {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #6b7280;
      background: #fafafa;
      font-weight: 950;
    }

    td {
      color: var(--fl-black);
      line-height: 1.45;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .muted {
      color: #6b7280;
      font-size: 13px;
    }

    .status {
      margin-top: 12px;
      min-height: 20px;
      font-weight: 850;
      line-height: 1.45;
      color: #6b7280;
    }

    .status.error { color: var(--fl-error); }
    .status.ok { color: var(--fl-success); }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 950;
      font-family: inherit;
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease, background .15s ease;
      box-shadow: 0 10px 20px rgba(17, 17, 17, 0.06);
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 14px 26px rgba(17, 17, 17, 0.10);
    }

    .btn:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(255, 90, 0, 0.35);
      outline-offset: 3px;
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .primary {
      background: linear-gradient(135deg, #FF5A00, #FF7A1A);
      color: white;
      box-shadow: 0 14px 28px rgba(255, 90, 0, 0.22);
    }

    .gray {
      background: #fff;
      color: var(--fl-orange-hover);
      border: 1px solid rgba(255, 90, 0, 0.32);
      box-shadow: none;
    }

    .gray:hover:not(:disabled) {
      background: rgba(255, 90, 0, 0.08);
      box-shadow: none;
    }

    .danger {
      background: var(--fl-error);
      color: white;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.58);
      justify-content: center;
      align-items: center;
      padding: 18px;
      z-index: 999;
      backdrop-filter: blur(8px);
    }

    .modal-box {
      width: 520px;
      max-width: 100%;
      background: white;
      border-radius: 24px;
      padding: 24px;
      border: 1px solid rgba(217, 217, 217, 0.9);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.28);
    }

    .modal-box h3 {
      margin: 0 0 12px;
      color: var(--fl-black);
      font-size: 24px;
      letter-spacing: -0.04em;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 950;
      text-transform: uppercase;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    .badge.active {
      background: rgba(22, 163, 74, 0.10);
      color: #166534;
      border: 1px solid rgba(22, 163, 74, 0.18);
    }

    .badge.inactive {
      background: #fef2f2;
      color: #b42318;
      border: 1px solid #ffd2cc;
    }

    .page-empty,
    .page-error,
    .page-forbidden {
      padding: 28px;
      border-radius: 20px;
      border: 1px dashed rgba(255, 90, 0, 0.28);
      background: rgba(255, 90, 0, 0.045);
      color: #5f6368;
      line-height: 1.5;
    }

    .page-empty h3,
    .page-error h3 {
      margin: 0 0 6px;
      color: var(--fl-black);
      font-size: 18px;
    }

    .page-forbidden {
      background: white;
      border-style: solid;
      box-shadow: var(--shadow-soft);
      color: #b42318;
      font-weight: 850;
    }

    @media (max-width: 900px) {
      body {
        padding: 14px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .hero {
        align-items: stretch;
        flex-direction: column;
        border-radius: 22px;
        padding: 20px;
      }

      .hero .btn,
      .form-grid .btn {
        width: 100%;
      }

      .panel {
        border-radius: 20px;
        padding: 16px;
      }
    }

    @media (max-width: 560px) {
      .modal-actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .modal-actions .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <script>
(function(){
  const token = localStorage.getItem("token");
  let user = null;

  try {
    user = JSON.parse(localStorage.getItem("user") || "null");
  } catch {
    user = null;
  }

  if (!token || !user) {
    window.top.location.href = "/login.html";
    return;
  }

  const role = String(user.role || "").toLowerCase();

  if (role === "worker") {
    window.top.location.href = "/control.html";
    return;
  }
})();
</script>
  
<div class="page">
  <div class="hero" aria-labelledby="usersTitle">
    <div>
      <h1 id="usersTitle">Users</h1>
      <p>Manage team access for this company workspace.</p>
    </div>
    <button type="button" class="btn gray" id="usersBtnRefresh">Refresh</button>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>Create User</h2>
      <form id="userForm" class="form-grid">
        <label>Username <input id="username" autocomplete="off" required></label>
        <label>Password <input id="password" type="password" required minlength="4"></label>
        <label>Role
          <select id="role">
            <option value="admin">Admin</option>
            <option value="manager">Manager</option>
            <option value="worker">Worker</option>
            <option value="owner">Owner</option>
          </select>
        </label>
        <label id="workerWrap" style="display:none;">Linked Worker
          <select id="worker_id"><option value="">No linked worker</option></select>
        </label>
        <button class="btn primary" type="submit">Create User</button>
      </form>
      <div class="status" id="formStatus" role="status" aria-live="polite"></div>
    </div>

    <div class="panel">
      <h2>Team Users</h2>
      <div id="usersBox" class="muted">Loading users...</div>
    </div>
  </div>
</div>

<div id="deleteUserModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="deleteUserTitle">
  <div class="modal-box">
    <h3 id="deleteUserTitle">Delete User</h3>
    <p>This will safely archive, cancel, deactivate, or delete only when safe.</p>
    <div class="modal-actions">
      <button type="button" class="btn danger" id="usersBtnConfirmDelete">Delete</button>
      <button type="button" class="btn gray" id="usersBtnCancelDelete">Cancel</button>
    </div>
  </div>
</div>

<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script>
let users = [];
let workers = [];
let deletingUserId = null;

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[ch]));
}

async function safeJson(res){
  try {
    return await res.json();
  } catch {
    try {
      const text = await res.text();
      return { error: text || "Request failed." };
    } catch {
      return { error: "Request failed." };
    }
  }
}

function getErrorMessage(data, fallback){
  if(data && typeof data.error === "string" && data.error.trim()) return data.error;
  if(data && typeof data.message === "string" && data.message.trim()) return data.message;
  return fallback;
}

function currentUser(){
  return AppAuth.getUser() || {};
}

function allowed(){
  return ["owner","admin"].includes(currentUser().role);
}

function canDeleteUsers(){
  return ["owner","admin"].includes(currentUser().role);
}

function setStatus(text, type){
  const el = document.getElementById("formStatus");
  el.textContent = text || "";
  el.className = "status " + (type || "");
}

function formatRole(role){
  return role ? role.charAt(0).toUpperCase() + role.slice(1) : "-";
}

function setButtonLoading(button, text){
  if(!button) return function(){};
  const oldText = button.textContent;
  button.disabled = true;
  button.textContent = text;
  return function(){
    button.disabled = false;
    button.textContent = oldText;
  };
}

function toggleWorkerField(){
  document.getElementById("workerWrap").style.display =
    document.getElementById("role").value === "worker" ? "grid" : "none";
}

function renderWorkerOptions(){
  document.getElementById("worker_id").innerHTML =
    '<option value="">No linked worker</option>' +
    workers.map(worker =>
      '<option value="' + esc(worker.id) + '">' +
      esc(worker.name || ("Worker #" + worker.id)) +
      '</option>'
    ).join("");
}

function renderUsers(){
  if(!Array.isArray(users) || !users.length){
    document.getElementById("usersBox").innerHTML =
      '<div class="page-empty"><h3>No users yet</h3><p>Create your first team user from the form.</p></div>';
    return;
  }

  document.getElementById("usersBox").innerHTML =
    '<div class="table-wrap"><table><thead><tr><th>User</th><th>Role</th><th>Worker</th><th>Status</th><th>Actions</th></tr></thead><tbody>' +
    users.map(user => {
      const userId = Number(user.id);
      const roleOptions = ["owner","admin","manager","worker"].map(role =>
        '<option value="' + role + '" ' + (user.role === role ? "selected" : "") + '>' + formatRole(role) + '</option>'
      ).join("");

      const workerOptions =
        '<option value="">No linked worker</option>' +
        workers.map(worker =>
          '<option value="' + esc(worker.id) + '" ' +
          (String(user.worker_id || "") === String(worker.id) ? "selected" : "") + '>' +
          esc(worker.name || ("Worker #" + worker.id)) +
          '</option>'
        ).join("");

      const deleteButton = canDeleteUsers() && userId !== Number(currentUser().id)
        ? '<button type="button" class="btn danger" data-user-delete="' + userId + '">Delete</button>'
        : '';

      return '<tr>' +
        '<td><strong>' + esc(user.username) + '</strong><div class="muted">#' + esc(user.id) + '</div></td>' +
        '<td><select class="user-role-select" data-user-id="' + userId + '">' + roleOptions + '</select></td>' +
        '<td><select class="user-worker-select" data-user-id="' + userId + '" ' + (user.role === "worker" ? "" : "disabled") + '>' + workerOptions + '</select></td>' +
        '<td><span class="badge ' + (user.active ? "active" : "inactive") + '">' + (user.active ? "Active" : "Inactive") + '</span></td>' +
        '<td><div class="actions"><button type="button" class="btn gray" data-user-toggle="' + userId + '" data-user-active="' + (user.active ? "1" : "0") + '">' + (user.active ? "Deactivate" : "Activate") + '</button>' + deleteButton + '</div></td>' +
      '</tr>';
    }).join("") +
    '</tbody></table></div>';
}

function openDeleteUser(id){
  deletingUserId = id;
  document.getElementById("deleteUserModal").style.display = "flex";
}

function closeDeleteUser(){
  deletingUserId = null;
  document.getElementById("deleteUserModal").style.display = "none";
}

async function load(){
  if(!AppAuth.requireAuth()) return;

  if(!allowed()){
    document.querySelector(".page").innerHTML = '<div class="page-forbidden">You do not have permission to manage users.</div>';
    return;
  }

  AppUI.setLoading(true, "Loading users...");

  try {
    const [userList, options] = await Promise.all([
      AppAPI.safeFetch("/users"),
      AppAPI.safeFetch("/users/options")
    ]);

    users = Array.isArray(userList) ? userList : [];
    workers = options && Array.isArray(options.workers) ? options.workers : [];

    renderWorkerOptions();
    renderUsers();
  } catch(err) {
    users = [];
    workers = [];
    renderWorkerOptions();
    document.getElementById("usersBox").innerHTML =
      '<div class="page-error"><h3>Unable to load users</h3><p>' + esc(err.message || "Please refresh and try again.") + '</p></div>';
    AppUI.showToast(err.message || "Unable to load users.", "error");
  } finally {
    AppUI.setLoading(false);
  }
}

async function updateUser(id, changes, button){
  const restoreButton = setButtonLoading(button, "Updating...");

  try {
    const res = await AppAPI.fetch("/users/" + id, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(changes)
    });

    const data = await safeJson(res);

    if(!res.ok){
      throw new Error(getErrorMessage(data, "Unable to update user"));
    }

    AppUI.showToast("User updated.", "success");
    await load();
  } catch(err) {
    AppUI.showToast(err.message || "Unable to update user.", "error");
    await load();
  } finally {
    restoreButton();
  }
}

async function confirmDeleteUser(button){
  if(!deletingUserId) return;

  await AppUI.withButton(button, async () => {
    const res = await AppAPI.fetch("/users/" + deletingUserId, {
      method: "DELETE"
    });

    const data = await safeJson(res);

    if(!res.ok){
      AppUI.showToast(getErrorMessage(data, "Unable to delete user."), "error");
      return;
    }

    closeDeleteUser();
    AppUI.showToast(data.message || "User updated safely.", "success");
    await load();
  }, { loading: "Deleting..." });
}

window.addEventListener("click", event => {
  if(event.target === document.getElementById("deleteUserModal")){
    closeDeleteUser();
  }
});

document.getElementById("role").addEventListener("change", toggleWorkerField);

document.getElementById("usersBox").addEventListener("change", function(ev){
  const el = ev.target;
  if(el.classList.contains("user-role-select")){
    updateUser(Number(el.getAttribute("data-user-id")), { role: el.value }, el);
  } else if(el.classList.contains("user-worker-select")){
    updateUser(Number(el.getAttribute("data-user-id")), { worker_id: el.value ? Number(el.value) : null }, el);
  }
});

document.getElementById("usersBox").addEventListener("click", function(ev){
  const delBtn = ev.target.closest("[data-user-delete]");
  if(delBtn){
    openDeleteUser(Number(delBtn.getAttribute("data-user-delete")));
    return;
  }
  const toggleBtn = ev.target.closest("[data-user-toggle]");
  if(toggleBtn){
    const id = Number(toggleBtn.getAttribute("data-user-toggle"));
    const wasActive = toggleBtn.getAttribute("data-user-active") === "1";
    updateUser(id, { active: !wasActive }, toggleBtn);
  }
});

document.getElementById("usersBtnRefresh").addEventListener("click", () => load());
document.getElementById("usersBtnConfirmDelete").addEventListener("click", e => confirmDeleteUser(e.currentTarget));
document.getElementById("usersBtnCancelDelete").addEventListener("click", () => closeDeleteUser());

document.getElementById("userForm").addEventListener("submit", async event => {
  event.preventDefault();

  const button = event.target.querySelector('button[type="submit"]');
  const restoreButton = setButtonLoading(button, "Creating...");

  setStatus("Creating user...", "");

  const role = document.getElementById("role").value;

  const payload = {
    username: document.getElementById("username").value.trim(),
    password: document.getElementById("password").value,
    role,
    worker_id: role === "worker" && document.getElementById("worker_id").value
      ? Number(document.getElementById("worker_id").value)
      : null
  };

  try {
    const res = await AppAPI.fetch("/users", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await safeJson(res);

    if(!res.ok){
      throw new Error(getErrorMessage(data, "Unable to create user"));
    }

    event.target.reset();
    toggleWorkerField();
    setStatus("User created.", "ok");
    await load();
  } catch(err) {
    setStatus(err.message || "Unable to create user.", "error");
  } finally {
    restoreButton();
  }
});

load();
</script>
</body>
</html>
