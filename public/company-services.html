<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Service Areas</title>
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/app-shell.css">
  <style>
    :root {
      --fl-orange: #FF5A00;
      --fl-orange-hover: #E64A00;
      --fl-orange-soft: #FF8A33;
      --fl-black: #111111;
      --fl-gray: #2B2B2B;
      --fl-border: #D9D9D9;
      --fl-bg: #F5F5F5;
      --fl-white: #FFFFFF;
      --fl-success: #16A34A;
      --fl-warning: #F59E0B;
      --fl-error: #DC2626;
      --fl-shadow: 0 18px 50px rgba(17, 17, 17, 0.10);
      --fl-shadow-soft: 0 10px 30px rgba(17, 17, 17, 0.07);
      --fl-radius-xl: 24px;
      --fl-radius-lg: 18px;
      --fl-radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      font-family: Inter, Arial, sans-serif;
    }

    html {
      min-height: 100%;
      background: var(--fl-bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--fl-black);
      padding: 26px;
      background:
        radial-gradient(circle at 14% 0%, rgba(255, 90, 0, 0.12), transparent 34%),
        radial-gradient(circle at 88% 10%, rgba(255, 122, 26, 0.10), transparent 30%),
        linear-gradient(180deg, #ffffff 0%, #f8f8f8 42%, #f2f2f2 100%);
    }

    .page {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 18px;
      animation: pageIn 0.28s ease-out;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 18px;
      flex-wrap: wrap;
      padding: 30px;
      border: 1px solid rgba(217, 217, 217, 0.9);
      border-radius: var(--fl-radius-xl);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,255,255,0.80)),
        radial-gradient(circle at 100% 0%, rgba(255, 90, 0, 0.15), transparent 34%);
      box-shadow: var(--fl-shadow-soft);
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 7px;
      background: linear-gradient(180deg, var(--fl-orange), var(--fl-orange-soft));
    }

    .hero::after {
      content: "FL";
      position: absolute;
      right: 28px;
      top: -18px;
      font-size: 92px;
      font-weight: 950;
      letter-spacing: -0.08em;
      color: rgba(255, 90, 0, 0.055);
      pointer-events: none;
    }

    .hero > div {
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--fl-orange);
      font-size: clamp(32px, 4.5vw, 52px);
      line-height: 0.98;
      letter-spacing: -0.055em;
      font-weight: 950;
    }

    .muted {
      margin: 0;
      color: #555;
      line-height: 1.55;
      font-size: 16px;
      max-width: 620px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 13px 18px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, border-color 0.18s ease;
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--fl-orange), var(--fl-orange-hover));
      color: #fff;
      box-shadow: 0 14px 28px rgba(255, 90, 0, 0.26);
    }

    .btn.primary::before {
      content: "✓";
      font-size: 15px;
      font-weight: 950;
    }

    .btn.secondary {
      background: #fff;
      color: var(--fl-orange);
      border: 1px solid rgba(255, 90, 0, 0.45);
      box-shadow: 0 10px 24px rgba(17, 17, 17, 0.06);
    }

    .btn.secondary::before {
      content: "+";
      font-size: 20px;
      line-height: 1;
      font-weight: 800;
    }

    .btn.danger {
      background: #fff;
      color: var(--fl-error);
      border: 1px solid rgba(220, 38, 38, 0.35);
    }

    .btn.danger::before {
      content: "×";
      font-size: 18px;
      line-height: 1;
      font-weight: 950;
    }

    .btn.small {
      padding: 8px 12px;
      border-radius: 11px;
      font-size: 12px;
      min-height: 36px;
      box-shadow: none;
    }

    .btn:disabled {
      opacity: 0.62;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .btn.primary:hover:not(:disabled) {
      box-shadow: 0 18px 32px rgba(255, 90, 0, 0.32);
    }

    .btn.secondary:hover:not(:disabled) {
      background: rgba(255, 90, 0, 0.055);
      border-color: var(--fl-orange);
    }

    .btn.danger:hover:not(:disabled) {
      background: rgba(220, 38, 38, 0.06);
      border-color: var(--fl-error);
    }

    .btn:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(255, 90, 0, 0.22);
      outline-offset: 2px;
    }

    .status {
      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #555;
      font-size: 14px;
      border: 1px solid transparent;
      border-radius: 16px;
      padding: 0 16px;
      background: rgba(255,255,255,0.68);
      box-shadow: 0 8px 24px rgba(17, 17, 17, 0.04);
    }

    .status:empty {
      min-height: 0;
      padding: 0;
      border: none;
      background: transparent;
      box-shadow: none;
    }

    .status:not(:empty)::before {
      content: "i";
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #fff;
      font-weight: 900;
      flex: 0 0 auto;
    }

    .status.error {
      color: #7f1d1d;
      font-weight: 800;
      background: #fff7f7;
      border-color: rgba(220, 38, 38, 0.22);
    }

    .status.error::before {
      content: "!";
      background: var(--fl-error);
    }

    .status.success {
      color: #14532d;
      font-weight: 800;
      background: #f2fff6;
      border-color: rgba(22, 163, 74, 0.24);
    }

    .status.success::before {
      content: "✓";
      background: var(--fl-success);
    }

    .panel {
      background: rgba(255,255,255,0.94);
      border: 1px solid rgba(217, 217, 217, 0.95);
      border-radius: var(--fl-radius-xl);
      box-shadow: var(--fl-shadow);
      padding: 24px;
      display: grid;
      gap: 18px;
      overflow: hidden;
    }

    .panel h2 {
      margin: 0;
      color: var(--fl-orange);
      font-size: 24px;
      letter-spacing: -0.03em;
      line-height: 1.15;
      font-weight: 950;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .panel h2::before {
      content: "";
      width: 10px;
      height: 30px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--fl-orange), var(--fl-orange-soft));
      box-shadow: 0 8px 18px rgba(255, 90, 0, 0.22);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--fl-border);
      border-radius: var(--fl-radius-lg);
      background: #fff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 760px;
    }

    th, td {
      text-align: left;
      vertical-align: middle;
      padding: 16px 18px;
      border-bottom: 1px solid #eeeeee;
    }

    th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.075em;
      color: #3a3a3a;
      background: linear-gradient(180deg, #fbfbfb, #f6f6f6);
      font-weight: 950;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tbody tr {
      transition: background 0.16s ease;
    }

    tbody tr:hover {
      background: rgba(255, 90, 0, 0.035);
    }

    input {
      width: 100%;
      border: 1px solid #dddddd;
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 14px;
      color: var(--fl-black);
      outline: none;
      background: #fff;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
      min-height: 42px;
    }

    input::placeholder {
      color: #9a9a9a;
    }

    input:focus {
      border-color: var(--fl-orange);
      box-shadow: 0 0 0 4px rgba(255, 90, 0, 0.12);
      background: #fffdfb;
    }

    input[type="number"] {
      appearance: textfield;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .empty {
      border: 1px dashed rgba(255, 90, 0, 0.35);
      border-radius: var(--fl-radius-lg);
      background:
        radial-gradient(circle at center top, rgba(255, 90, 0, 0.08), transparent 42%),
        #fff;
      padding: 34px 22px;
      text-align: center;
      color: #555;
      line-height: 1.55;
      font-size: 15px;
      font-weight: 700;
    }

    .empty::before {
      content: "+";
      width: 48px;
      height: 48px;
      margin: 0 auto 12px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--fl-orange), var(--fl-orange-hover));
      color: #fff;
      font-size: 30px;
      line-height: 1;
      box-shadow: 0 16px 30px rgba(255, 90, 0, 0.24);
    }

    @media (max-width: 860px) {
      body {
        padding: 14px;
      }

      .page {
        gap: 14px;
      }

      .hero {
        padding: 24px 18px;
        border-radius: 20px;
      }

      .hero::after {
        font-size: 70px;
        right: 16px;
        top: -10px;
      }

      .actions {
        width: 100%;
      }

      .btn {
        width: 100%;
      }

      .btn.small {
        width: auto;
      }

      .panel {
        padding: 16px;
        border-radius: 20px;
      }

      .panel h2 {
        font-size: 21px;
      }

      .status {
        min-height: 50px;
        align-items: flex-start;
        padding: 13px 14px;
      }
    }

    @media (max-width: 560px) {
      body {
        padding: 10px;
      }

      .hero {
        padding: 22px 16px;
      }

      h1 {
        font-size: 34px;
      }

      .muted {
        font-size: 14px;
      }

      th, td {
        padding: 13px 12px;
      }

      .table-wrap {
        border-radius: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div>
        <h1>Service Coverage Areas</h1>
        <p class="muted">Manage ZIP and radius-based coverage areas for your company.</p>
      </div>
      <div class="actions">
        <button id="addAreaBtn" class="btn secondary" type="button">Add Area</button>
        <button id="saveAreasBtn" class="btn primary" type="button">Save Areas</button>
      </div>
    </section>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <section class="panel">
      <h2>Company Service Areas</h2>
      <div id="emptyState" class="empty" style="display:none;">No service areas yet. Add your first area.</div>
      <div class="table-wrap" id="tableWrap">
        <table>
          <thead>
            <tr>
              <th>ZIP Code</th>
              <th>City</th>
              <th>State</th>
              <th>Radius (Miles)</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="areasBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const API_BASE = (window.AppAPI && window.AppAPI.base) || window.location.origin;
    const token = localStorage.getItem("token");
    let currentUser = null;
    try { currentUser = JSON.parse(localStorage.getItem("user") || "null"); } catch (_) { currentUser = null; }

    const state = {
      rows: []
    };

    const els = {
      status: document.getElementById("status"),
      body: document.getElementById("areasBody"),
      empty: document.getElementById("emptyState"),
      tableWrap: document.getElementById("tableWrap"),
      addBtn: document.getElementById("addAreaBtn"),
      saveBtn: document.getElementById("saveAreasBtn")
    };

    function companyId() {
      const id = currentUser && Number(currentUser.company_id);
      return Number.isInteger(id) && id > 0 ? id : 0;
    }

    function setStatus(message, type) {
      els.status.textContent = message || "";
      els.status.className = "status" + (type ? " " + type : "");
    }

    function authHeaders(extra) {
      const headers = Object.assign({}, extra || {});
      if (token) headers.Authorization = "Bearer " + token;
      return headers;
    }

    function createEmptyRow() {
      return {
        zip_code: "",
        city: "",
        state: "",
        radius_miles: 0
      };
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function render() {
      if (!state.rows.length) {
        els.empty.style.display = "block";
        els.tableWrap.style.display = "none";
        els.body.innerHTML = "";
        return;
      }

      els.empty.style.display = "none";
      els.tableWrap.style.display = "block";
      els.body.innerHTML = state.rows.map((row, index) => {
        return (
          '<tr>' +
            '<td><input type="text" data-field="zip_code" data-index="' + index + '" value="' + escapeHtml(row.zip_code || "") + '" placeholder="12345" maxlength="10" inputmode="numeric" autocomplete="postal-code"></td>' +
            '<td><input type="text" data-field="city" data-index="' + index + '" value="' + escapeHtml(row.city || "") + '" placeholder="City" autocomplete="address-level2"></td>' +
            '<td><input type="text" data-field="state" data-index="' + index + '" value="' + escapeHtml(row.state || "") + '" placeholder="ST" maxlength="2" autocomplete="address-level1"></td>' +
            '<td><input type="number" data-field="radius_miles" data-index="' + index + '" value="' + Number(row.radius_miles || 0) + '" min="0" step="1" inputmode="numeric"></td>' +
            '<td><button class="btn danger small" type="button" data-action="remove-row" data-index="' + index + '">Remove</button></td>' +
          '</tr>'
        );
      }).join("");
    }

    function normalizeZip(zip) {
      return String(zip || "").replace(/\D/g, "").slice(0, 5);
    }

    function validateRows(rows) {
      for (let i = 0; i < rows.length; i += 1) {
        const row = rows[i];
        if (!row.zip_code) {
          return "ZIP code is required for every area.";
        }
        const radius = Number(row.radius_miles);
        if (!Number.isFinite(radius) || radius < 0) {
          return "Radius must be 0 or greater.";
        }
      }
      return "";
    }

    function buildPayload() {
      const cleaned = state.rows.map((row) => ({
        zip_code: normalizeZip(row.zip_code),
        city: String(row.city || "").trim(),
        state: String(row.state || "").trim().toUpperCase(),
        radius_miles: Math.max(0, Math.round(Number(row.radius_miles || 0))),
        active: true
      }));

      return {
        service_areas: cleaned
      };
    }

    async function loadAreas() {
      if (!token || !companyId()) {
        setStatus("Missing account session. Sign in first.", "error");
        return;
      }

      setStatus("Loading service areas...", "");
      try {
        const res = await fetch(API_BASE + "/companies/" + encodeURIComponent(companyId()) + "/service-areas", {
          headers: authHeaders()
        });
        const data = await res.json().catch(() => []);
        if (!res.ok) {
          throw new Error((data && data.error) || "Unable to load service areas.");
        }
        state.rows = (Array.isArray(data) ? data : []).map((item) => ({
          zip_code: item.zip_code || "",
          city: item.city || "",
          state: item.state || "",
          radius_miles: Number(item.radius_miles || 0)
        }));
        render();
        setStatus("Service areas loaded.", "");
      } catch (err) {
        state.rows = [];
        render();
        setStatus(err.message || "Unable to load service areas.", "error");
      }
    }

    async function saveAreas() {
      if (!token || !companyId()) {
        setStatus("Missing account session. Sign in first.", "error");
        return;
      }

      const payload = buildPayload();
      const validationError = validateRows(payload.service_areas);
      if (validationError) {
        setStatus(validationError, "error");
        return;
      }

      els.saveBtn.disabled = true;
      setStatus("Saving service areas...", "");
      try {
        const res = await fetch(API_BASE + "/companies/service-areas", {
          method: "PUT",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "Unable to save service areas.");
        setStatus("Service areas saved successfully.", "success");
        await loadAreas();
      } catch (err) {
        setStatus(err.message || "Unable to save service areas.", "error");
      } finally {
        els.saveBtn.disabled = false;
      }
    }

    els.addBtn.addEventListener("click", function() {
      state.rows.push(createEmptyRow());
      render();
    });

    els.saveBtn.addEventListener("click", saveAreas);

    els.body.addEventListener("input", function(event) {
      const target = event.target;
      if (!target) return;
      const index = Number(target.getAttribute("data-index"));
      const field = target.getAttribute("data-field");
      if (!Number.isInteger(index) || !field || !state.rows[index]) return;
      state.rows[index][field] = target.value;
    });

    els.body.addEventListener("click", function(event) {
      const btn = event.target.closest("[data-action='remove-row']");
      if (!btn) return;
      const index = Number(btn.getAttribute("data-index"));
      if (!Number.isInteger(index) || !state.rows[index]) return;
      state.rows.splice(index, 1);
      render();
    });

    loadAreas();
  </script>
</body>
</html>
