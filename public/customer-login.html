<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Portal Login</title>
  <link rel="stylesheet" href="/app-shell.css">
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:linear-gradient(135deg,#0f2e1c,#1f5c3a); font-family:Arial,sans-serif; color:#173327; padding:18px; }
    .login-box { width:min(420px,100%); background:white; border-radius:18px; padding:28px; box-shadow:0 18px 42px rgba(0,0,0,0.18); }
    h1 { margin:0 0 8px; color:#1f5c3a; font-size:28px; }
    p { margin:0 0 18px; color:#648076; line-height:1.45; }
    label { display:block; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; color:#648076; margin:12px 0 6px; }
    input { width:100%; padding:13px; border-radius:12px; border:1px solid #cfe0d5; font:inherit; }
    button { width:100%; margin-top:16px; padding:13px; border:0; border-radius:12px; background:#1f5c3a; color:white; font-weight:800; cursor:pointer; font:inherit; }
    .error { min-height:20px; color:#b42318; margin-top:12px; font-size:14px; }
  </style>
</head>

<body>
  <div class="login-box">
    <h1>Customer Portal</h1>
    <p>Use your client ID and phone number to view estimates, invoices, jobs, and subscriptions.</p>
    <label for="clientId">Client ID</label>
    <input id="clientId" inputmode="numeric" placeholder="Example: 104">
    <label for="phone">Phone</label>
    <input id="phone" inputmode="tel" placeholder="Phone on file">
    <button type="button" id="customerLoginBtn">Open Portal</button>
    <div id="error" class="error"></div>
  </div>
  <script>
    const API = window.location.origin;
    document.getElementById("customerLoginBtn").addEventListener("click", login);

    async function login(){
      const error = document.getElementById("error");
      error.textContent = "";
      const client_id = document.getElementById("clientId").value.trim();
      const phone = document.getElementById("phone").value.trim();
      if(!client_id || !phone){ error.textContent = "Client ID and phone are required."; return; }
      try {
        const res = await fetch(API + "/customer/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ client_id, phone })
        });
        const data = await res.json();
        if(!res.ok){ error.textContent = data.error || "Unable to open portal."; return; }
        localStorage.setItem("customerToken", data.token);
        localStorage.setItem("customer", JSON.stringify(data.customer || {}));
        window.location.href = "/customer-dashboard.html";
      } catch(err) {
        error.textContent = "Server error.";
      }
    }
  </script>
</body>
</html>
