<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Health</title>
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/app-shell.css">
  <style>
    :root {
      --fl-bg: #050505;
      --fl-surface: #111111;
      --fl-surface-2: #171717;
      --fl-card: rgba(255, 255, 255, 0.055);
      --fl-card-2: rgba(255, 255, 255, 0.035);
      --fl-text: #ffffff;
      --fl-muted: #b9b9b9;
      --fl-muted-2: #8b8b8b;
      --fl-line: rgba(255, 255, 255, 0.12);
      --fl-orange: #ff5a00;
      --fl-orange-dark: #e64a00;
      --fl-orange-soft: rgba(255, 90, 0, 0.14);
      --fl-green: #16a34a;
      --fl-amber: #f59e0b;
      --fl-red: #dc2626;
      --fl-radius: 24px;
      --fl-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      color: var(--fl-text);
      background:
        radial-gradient(circle at 8% 0%, rgba(255, 90, 0, 0.16), transparent 30%),
        radial-gradient(circle at 92% 8%, rgba(255, 90, 0, 0.13), transparent 28%),
        linear-gradient(180deg, #050505 0%, #0a0a0a 44%, #050505 100%);
      padding: 24px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.34;
      background-image: radial-gradient(rgba(255, 90, 0, 0.34) 1px, transparent 1px);
      background-size: 22px 22px;
      mask-image: radial-gradient(circle at 88% 8%, #000 0 18%, transparent 42%);
    }

    .page {
      width: min(1180px, 100%);
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      padding: 28px;
      margin-bottom: 20px;
      border-radius: 28px;
      border: 1px solid rgba(255, 90, 0, 0.28);
      background:
        linear-gradient(135deg, rgba(255, 90, 0, 0.16), rgba(255, 255, 255, 0.035) 44%, rgba(255, 255, 255, 0.02)),
        rgba(17, 17, 17, 0.86);
      box-shadow: var(--fl-shadow);
      overflow: hidden;
      position: relative;
    }

    .hero::after {
      content: "FL";
      position: absolute;
      right: 26px;
      bottom: -44px;
      font-size: 138px;
      line-height: 1;
      font-weight: 1000;
      font-style: italic;
      color: rgba(255, 90, 0, 0.10);
      letter-spacing: -14px;
      pointer-events: none;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.05;
      letter-spacing: -1.2px;
      text-transform: uppercase;
    }

    .hero p {
      max-width: 760px;
      margin: 0;
      color: var(--fl-muted);
      font-size: 15px;
    }

    .hero-actions {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    .btn,
    button.btn {
      min-height: 46px;
      border-radius: 999px;
      border: 1px solid transparent;
      padding: 10px 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, opacity 0.18s ease;
    }

    .btn.gray,
    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--fl-orange), var(--fl-orange-dark));
      border-color: rgba(255, 90, 0, 0.62);
      box-shadow: 0 18px 42px rgba(255, 90, 0, 0.26);
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.72;
      transform: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .panel {
      padding: 22px;
      min-height: 210px;
      border-radius: var(--fl-radius);
      border: 1px solid var(--fl-line);
      background:
        linear-gradient(180deg, var(--fl-card), var(--fl-card-2)),
        var(--fl-surface);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.30);
      position: relative;
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg, var(--fl-orange), transparent);
      opacity: 0.9;
    }

    .panel h2 {
      margin: 0 0 16px;
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: -0.3px;
      color: #fff;
    }

    .status-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 11px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      color: rgba(255, 255, 255, 0.88);
      font-size: 14px;
    }

    .status-line:last-child {
      border-bottom: none;
    }

    .status-line strong {
      color: #fff;
      font-size: 15px;
    }

    .muted {
      color: var(--fl-muted-2);
    }

    ul {
      margin: 12px 0 0;
      padding-left: 20px;
      color: var(--fl-muted);
    }

    li {
      margin: 6px 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 26px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      white-space: nowrap;
    }

    .badge.active {
      border-color: rgba(22, 163, 74, 0.45);
      background: rgba(22, 163, 74, 0.16);
      color: #86efac;
    }

    .badge.status-orange {
      border-color: rgba(245, 158, 11, 0.45);
      background: rgba(245, 158, 11, 0.16);
      color: #fcd34d;
    }

    .badge.status-red {
      border-color: rgba(220, 38, 38, 0.45);
      background: rgba(220, 38, 38, 0.16);
      color: #fca5a5;
    }

    .page-forbidden,
    .empty-state {
      padding: 28px;
      border-radius: 24px;
      border: 1px solid rgba(220, 38, 38, 0.30);
      background: rgba(220, 38, 38, 0.09);
      color: #fecaca;
      font-weight: 800;
      box-shadow: var(--fl-shadow);
    }

    .empty-state {
      border-color: rgba(245, 158, 11, 0.30);
      background: rgba(245, 158, 11, 0.09);
      color: #fde68a;
    }

    @media (max-width: 900px) {
      body {
        padding: 16px;
      }

      .hero {
        align-items: flex-start;
        flex-direction: column;
        padding: 22px;
      }

      .hero-actions,
      .hero-actions .btn {
        width: 100%;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 12px;
      }

      .hero,
      .panel {
        border-radius: 20px;
      }

      .status-line {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
      }
    }
  </style>
  <script src="/js/role-guard.js"></script>
</head>
<body>
  <script>
(function(){
  const token = localStorage.getItem("token");
  let user = null;

  try {
    user = JSON.parse(localStorage.getItem("user") || "null");
  } catch {
    user = null;
  }

  if (!token || !user) {
    window.top.location.href = "/login.html";
    return;
  }

  const role = String(user.role || "").toLowerCase();

  if (role === "worker") {
    window.top.location.href = "/control.html";
    return;
  }
})();
</script>

<div class="page">
  <div class="hero">
    <div>
      <h1>System Health</h1>
      <p>Launch readiness checks for database, migrations, billing, Stripe, email, uploads, scheduler, queue, and environment blockers.</p>
    </div>
    <div class="hero-actions">
      <button type="button" class="btn gray" id="healthRefreshBtn">Refresh</button>
    </div>
  </div>

  <div id="healthBox" class="grid" aria-live="polite"></div>
</div>

<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script>
function esc(value){ return String(value || "").replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch])); }
function currentUser(){ return AppAuth.getUser() || {}; }
function allowed(){ return ["owner","admin"].includes(String(currentUser().role || "").toLowerCase()); }
function badge(status){
  const normalized = String(status || "").toLowerCase();
  const good = ["ok", "complete", "configured", "running"].includes(normalized);
  const bad = ["blocked", "missing", "stopped", "error", "failed"].includes(normalized);
  return '<span class="badge ' + (good ? "active" : bad ? "status-red" : "status-orange") + '">' + esc(status || "-") + '</span>';
}
function listBlockers(items){
  const list = Array.isArray(items) ? items.filter(Boolean) : [];
  return list.length ? '<ul>' + list.map(item => '<li>' + esc(item) + '</li>').join("") + '</ul>' : '<p class="muted">None reported.</p>';
}
function card(title, html){
  return '<div class="panel"><h2>' + esc(title) + '</h2>' + html + '</div>';
}

function render(data){
  const runtime = data.runtime || data || {};
  const system = data.system || {};
  const pending = runtime.migrations && runtime.migrations.pending ? runtime.migrations.pending : [];
  const env = runtime.environment || {};
  const envBlockers = []
    .concat(env.missing_critical || [])
    .concat(env.missing_launch_required || []);
  const queue = runtime.queue || {};
  const scheduler = runtime.scheduler || {};
  const operational = runtime.operational || {};

  document.getElementById("healthBox").innerHTML =
    card("Readiness", '<div class="status-line"><span>Status</span>' + badge(runtime.ok ? "ok" : "blocked") + '</div><div class="status-line"><span>Environment</span><span class="muted">' + esc(runtime.env || "-") + '</span></div><div class="status-line"><span>Checked</span><span class="muted">' + esc(runtime.time || "-") + '</span></div>') +
    card("Environment", '<div class="status-line"><span>Status</span>' + badge(env.status || "-") + '</div><div class="status-line"><span>Blockers</span><strong>' + esc(envBlockers.length) + '</strong></div>' + listBlockers(envBlockers.concat(env.warnings || []))) +
    card("Database", '<div class="status-line"><span>Status</span>' + badge(runtime.database && runtime.database.status) + '</div>') +
    card("Migrations", '<div class="status-line"><span>Status</span>' + badge(runtime.migrations && runtime.migrations.status) + '</div><div class="status-line"><span>Pending</span><strong>' + esc(pending.length) + '</strong></div>' + (pending.length ? listBlockers(pending) : '<p class="muted">All migrations applied.</p>')) +
    card("Billing", '<div class="status-line"><span>Status</span>' + badge(runtime.billing && runtime.billing.status) + '</div><div class="status-line"><span>Past Due</span><strong>' + esc(runtime.billing && runtime.billing.past_due_companies) + '</strong></div><div class="status-line"><span>Suspended</span><strong>' + esc(runtime.billing && runtime.billing.suspended_companies) + '</strong></div><div class="status-line"><span>Lifecycle Automation</span>' + badge(operational.billing_lifecycle_automation_enabled ? "running" : "stopped") + '</div>') +
    card("Stripe", '<div class="status-line"><span>Status</span>' + badge(runtime.stripe && runtime.stripe.status) + '</div><div class="status-line"><span>Checkout</span>' + badge(runtime.stripe && runtime.stripe.checkout_configured ? "configured" : "missing") + '</div><div class="status-line"><span>Webhook Secret</span>' + badge(runtime.stripe && runtime.stripe.webhook_secret_configured ? "configured" : "missing") + '</div><div class="status-line"><span>Portal</span>' + badge(runtime.stripe && runtime.stripe.portal_configured ? "configured" : "missing") + '</div>') +
    card("Email", '<div class="status-line"><span>Status</span>' + badge(runtime.email && runtime.email.status) + '</div><div class="status-line"><span>Missing</span><strong>' + esc((runtime.email && runtime.email.missing || []).length) + '</strong></div>') +
    card("Uploads", '<div class="status-line"><span>Status</span>' + badge(runtime.uploads && runtime.uploads.status) + '</div><div class="status-line"><span>Storage</span><span class="muted">' + esc(runtime.uploads && runtime.uploads.storage) + '</span></div><div class="status-line"><span>Ephemeral Warning</span>' + badge(runtime.uploads && runtime.uploads.ephemeral_storage_warning ? "warning" : "ok") + '</div>') +
    card("Queue", '<div class="status-line"><span>Status</span>' + badge(queue.started ? "running" : "stopped") + '</div><div class="status-line"><span>Pending</span><strong>' + esc(queue.pending || 0) + '</strong></div><div class="status-line"><span>Failed</span><strong>' + esc(queue.failed || 0) + '</strong></div>') +
    card("Scheduler", '<div class="status-line"><span>Status</span>' + badge(scheduler.started ? "running" : "stopped") + '</div><div class="status-line"><span>Tasks</span><strong>' + esc((scheduler.tasks || []).length || 0) + '</strong></div>') +
    card("Company Setup", '<div class="status-line"><span>Status</span>' + badge(system.company && system.company.status) + '</div><div class="status-line"><span>Missing Fields</span><strong>' + esc((system.company && system.company.missing_fields || []).length) + '</strong></div>');
}

async function load(){
  const refreshBtn = document.getElementById("healthRefreshBtn");

  if(!AppAuth.requireAuth()) return;
  if(!allowed()){
    document.querySelector(".page").innerHTML = '<div class="page-forbidden">You do not have permission to view system health.</div>';
    return;
  }

  if(refreshBtn){
    refreshBtn.disabled = true;
    refreshBtn.textContent = "Refreshing...";
  }

  AppUI.setLoading(true, "Loading system health...");
  try {
    const systemHealth = {};
    try {
      systemHealth.system = await AppAPI.safeFetch("/system/health");
    } catch(systemErr) {
      systemHealth.system = {};
    }
    const runtimeRes = await AppAPI.fetch("/health");
    systemHealth.runtime = await runtimeRes.json();
    render(systemHealth);
  } catch(err) {
    AppUI.showToast(err.message || "Unable to load system health.", "error");
    document.getElementById("healthBox").innerHTML = '<div class="empty-state">Unable to load system health. Please refresh or check your connection.</div>';
  } finally {
    AppUI.setLoading(false);
    if(refreshBtn){
      refreshBtn.disabled = false;
      refreshBtn.textContent = "Refresh";
    }
  }
}

document.getElementById("healthRefreshBtn").addEventListener("click", () => load());
load();
</script>
</body>
</html>
