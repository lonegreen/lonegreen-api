<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workers</title>
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/app-shell.css">
  <style>
    * { box-sizing: border-box; }

    :root {
      --fx-card: rgba(255,255,255,0.96);
      --fx-text: var(--brand-black);
      --fx-muted: #648076;
      --fx-line: var(--brand-border);
      --fx-soft: var(--brand-bg);
      --fx-orange: var(--brand-primary);
      --fx-orange-dark: var(--brand-primary-hover);
      --fx-green: #027a48;
      --fx-red: #b42318;
      --fx-warn: #b45309;
      --fx-shadow: 0 18px 42px rgba(16,24,40,0.08);
      --fx-shadow-soft: 0 10px 24px rgba(16,24,40,0.06);
      --fx-radius: 22px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255, 90, 0, 0.13), transparent 28%),
        radial-gradient(circle at top right, rgba(22, 101, 52, 0.08), transparent 24%),
        linear-gradient(180deg, #fbfcfb 0%, #f6f8f7 44%, #f4f6f8 100%);
      color: var(--fx-text);
      padding: 28px;
    }

    .page {
      width: min(1280px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 2px;
    }

    .hero h1 {
      margin: 0 0 8px;
      color: var(--fx-orange);
      font-size: clamp(32px, 4vw, 46px);
      line-height: 1;
      letter-spacing: -0.045em;
      font-weight: 950;
    }

    .hero p {
      margin: 0;
      color: var(--fx-muted);
      line-height: 1.55;
      font-weight: 650;
    }

    .panel {
      background: var(--fx-card);
      border: 1px solid var(--fx-line);
      border-radius: var(--fx-radius);
      box-shadow: var(--fx-shadow);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 0;
    }

    .summary-card {
      position: relative;
      overflow: hidden;
      padding: 20px 20px 20px 86px;
      min-height: 112px;
      display: grid;
      align-content: center;
      gap: 7px;
    }

    .summary-card::before {
      content: "●";
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 17px;
      background: #fff3ec;
      color: var(--fx-orange);
      font-size: 20px;
      box-shadow: inset 0 0 0 1px rgba(255,90,0,0.08);
    }

    .summary-card:nth-child(2)::before {
      content: "✓";
      background: #ecfdf3;
      color: var(--fx-green);
    }

    .summary-card:nth-child(3)::before {
      content: "▤";
    }

    .summary-card:nth-child(4)::before {
      content: "★";
      background: #ecfdf3;
      color: var(--fx-green);
    }

    .label {
      font-size: 11px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.055em;
      color: #688076;
      margin-bottom: 0;
    }

    .value {
      font-size: 34px;
      line-height: 1;
      font-weight: 950;
      color: var(--fx-text);
      letter-spacing: -0.045em;
      font-variant-numeric: tabular-nums;
    }

    .toolbar {
      padding: 18px;
      margin-bottom: 0;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 12px;
      align-items: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      padding: 20px;
      min-width: 0;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }

    .card:hover {
      transform: translateY(-1px);
      border-color: rgba(255,90,0,0.28);
      box-shadow: 0 20px 46px rgba(16,24,40,0.10);
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .title {
      margin: 0 0 7px;
      color: var(--fx-text);
      font-size: 21px;
      line-height: 1.15;
      letter-spacing: -0.03em;
      font-weight: 950;
      word-break: break-word;
    }

    .sub {
      color: var(--fx-muted);
      font-size: 13px;
      margin-bottom: 4px;
      word-break: break-word;
      font-weight: 650;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 950;
      text-transform: uppercase;
      white-space: nowrap;
      letter-spacing: 0.035em;
    }

    .active {
      background: #ecfdf3;
      color: var(--fx-green);
    }

    .inactive {
      background: #fef2f2;
      color: var(--fx-red);
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .meta-box {
      padding: 13px;
      border-radius: 15px;
      background: linear-gradient(180deg, #ffffff, #f7faf8);
      border: 1px solid #deebe3;
      min-width: 0;
      word-break: break-word;
      font-weight: 900;
      color: var(--fx-text);
    }

    .btn {
      border: none;
      border-radius: 14px;
      min-height: 44px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 900;
      font-family: inherit;
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease, border-color .15s ease;
      box-shadow: var(--fx-shadow-soft);
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 14px 26px rgba(16,24,40,0.10);
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .primary,
    .blue {
      background: linear-gradient(135deg, var(--fx-orange), var(--fx-orange-dark));
      color: white;
    }

    .orange {
      background: #f59e0b;
      color: white;
    }

    .red {
      background: #dc2626;
      color: white;
    }

    .gray {
      background: rgba(255,255,255,0.9);
      color: var(--fx-orange);
      border: 1px solid var(--fx-line);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border-radius: 14px;
      border: 1px solid var(--fx-line);
      background: white;
      color: var(--fx-text);
      font: inherit;
      outline: none;
      transition: border .15s ease, box-shadow .15s ease;
    }

    input:focus {
      border-color: var(--fx-orange);
      box-shadow: 0 0 0 4px rgba(255,90,0,0.13);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 18px;
      backdrop-filter: blur(5px);
    }

    .modal-box {
      width: 560px;
      max-width: 100%;
      background: white;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 28px 70px rgba(16,24,40,0.26);
      border: 1px solid rgba(255,255,255,0.7);
    }

    .modal-box h3 {
      margin: 0 0 18px;
      color: var(--fx-orange);
      font-size: 25px;
      line-height: 1.1;
      letter-spacing: -0.035em;
      font-weight: 950;
    }

    .modal-box p {
      margin: 0;
      color: var(--fx-muted);
      line-height: 1.55;
      font-weight: 700;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 13px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px;
      border: 1px solid var(--fx-line);
      border-radius: 15px;
      background: var(--fx-soft);
      color: #315548;
      font-weight: 900;
    }

    .check-row input {
      width: auto;
      min-height: auto;
      box-shadow: none;
      accent-color: var(--fx-orange);
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .empty {
      min-height: 180px;
      padding: 34px 24px;
      border: 1px dashed var(--fx-line);
      border-radius: 18px;
      background:
        radial-gradient(circle at center top, rgba(22,101,52,0.07), transparent 34%),
        linear-gradient(180deg, #ffffff, #fbfdfc);
      color: var(--fx-muted);
      grid-column: 1 / -1;
      line-height: 1.5;
      display: grid;
      place-items: center;
      align-content: center;
      text-align: center;
    }

    .empty strong {
      display: block;
      color: var(--fx-text);
      font-size: 20px;
      margin-bottom: 6px;
      letter-spacing: -0.03em;
      font-weight: 950;
    }

    @media (max-width: 900px) {
      body {
        padding: 14px;
      }

      .page {
        gap: 16px;
      }

      .summary,
      .grid,
      .toolbar,
      .meta {
        grid-template-columns: 1fr;
      }

      .hero {
        align-items: stretch;
      }

      .hero .btn,
      .toolbar .btn,
      .actions .btn,
      .modal-actions .btn {
        width: 100%;
      }

      .top {
        flex-direction: column;
      }

      .summary-card {
        min-height: 104px;
      }
    }
  </style>
  <link rel="stylesheet" href="/ui-cleanup.css">
  <script src="/js/role-guard.js"></script>
</head>
<body class="phase2-internal">
  <script>
(function(){
  const token = localStorage.getItem("token");

  let user = null;

  try {
    user = JSON.parse(localStorage.getItem("user") || "null");
  } catch (e) {
    user = null;
  }

  if (!token || !user) {
    window.location.href = "/login.html";
    return;
  }

  const role = String(user.role || "").toLowerCase();

  if (role === "worker") {
    window.location.href = "/control.html";
    return;
  }
})();
</script>

<div class="page">
  <div class="hero fx-section-head">
    <div>
      <h1>Workers</h1>
      <p>Manage your active field team, daily load, and completion performance.</p>
    </div>
    <button type="button" class="btn primary fx-btn fx-btn--primary" id="workersBtnAdd">Add Worker</button>
  </div>

  <div class="summary">
    <div class="panel summary-card fx-stat"><div class="label fx-stat__label">Total Workers</div><div class="value fx-stat__value" id="totalCount">0</div></div>
    <div class="panel summary-card fx-stat"><div class="label fx-stat__label">Active</div><div class="value fx-stat__value" id="activeCount">0</div></div>
    <div class="panel summary-card fx-stat"><div class="label fx-stat__label">Assigned Jobs</div><div class="value fx-stat__value" id="assignedCount">0</div></div>
    <div class="panel summary-card fx-stat"><div class="label fx-stat__label">Completed Jobs</div><div class="value fx-stat__value" id="completedCount">0</div></div>
  </div>

  <div class="panel toolbar fx-toolbar">
    <input id="search" class="fx-input" placeholder="Search workers by name or phone">
    <button type="button" class="btn blue fx-btn fx-btn--secondary" id="workersBtnRefresh">Refresh</button>
  </div>

  <div id="list" class="grid"></div>
</div>

<div id="workerModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box fx-card">
    <h3 id="modalTitle">Add Worker</h3>
    <div class="form-grid">
      <input id="worker_name" class="fx-input" placeholder="Worker name">
      <input id="worker_phone" class="fx-input" placeholder="Phone">
      <label class="check-row"><input id="worker_active" type="checkbox" checked> Active worker</label>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn primary fx-btn fx-btn--primary" id="workersBtnSave">Save</button>
      <button type="button" class="btn gray fx-btn fx-btn--secondary" id="workersBtnCancelModal">Cancel</button>
    </div>
  </div>
</div>

<div id="deleteWorkerModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="deleteWorkerTitle">
  <div class="modal-box fx-card">
    <h3 id="deleteWorkerTitle">Delete Worker</h3>
    <p>This will safely archive, cancel, deactivate, or delete only when safe.</p>
    <div class="modal-actions">
      <button type="button" class="btn gray fx-btn fx-btn--secondary" id="workersBtnCancelDelete">Cancel</button>
      <button type="button" class="btn red fx-btn fx-btn--danger" id="workersBtnConfirmDelete">Delete</button>
    </div>
  </div>
</div>

<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/format.js"></script>
<script>
const API = window.location.origin;
let workers = [];
let editingId = null;
let deletingWorkerId = null;

const getToken = AppAuth.getToken;

if(!getToken()){
  window.top.location.href = "/login.html";
}

const apiFetch = AppAPI.fetch;

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>\"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}

async function safeJson(res){
  try {
    return await res.json();
  } catch {
    try {
      const text = await res.text();
      return { error: text || "Request failed." };
    } catch {
      return { error: "Request failed." };
    }
  }
}

function getErrorMessage(data, fallback){
  if(data && typeof data.error === "string" && data.error.trim()) return data.error;
  if(data && typeof data.message === "string" && data.message.trim()) return data.message;
  return fallback;
}

function setButtonLoading(button, text){
  if(!button) return function(){};
  const oldText = button.textContent;
  button.disabled = true;
  button.textContent = text;
  return function(){
    button.disabled = false;
    button.textContent = oldText;
  };
}

function currentRole(){
  try {
    return String((JSON.parse(localStorage.getItem("user") || "{}").role) || "").toLowerCase();
  } catch {
    return "";
  }
}

function canDeleteWorkers(){
  return ["owner", "admin", "manager"].includes(currentRole());
}

function filteredWorkers(){
  const q = (document.getElementById("search").value || "").trim().toLowerCase();

  if(!q) return workers;

  return workers.filter(worker =>
    [worker.name, worker.phone].join(" ").toLowerCase().includes(q)
  );
}

function renderSummary(){
  document.getElementById("totalCount").textContent = workers.length;
  document.getElementById("activeCount").textContent = workers.filter(worker => worker.active !== false).length;
  document.getElementById("assignedCount").textContent = workers.reduce((sum, worker) => sum + Number(worker.jobs_assigned || 0), 0);
  document.getElementById("completedCount").textContent = workers.reduce((sum, worker) => sum + Number(worker.jobs_completed || 0), 0);
}

function render(){
  renderSummary();

  const list = document.getElementById("list");
  const items = filteredWorkers();

  if(!items.length){
    list.innerHTML = `<div class="empty fx-empty"><strong class="fx-empty__title">No workers found</strong><span class="fx-empty__text">Add a worker or adjust your search.</span></div>`;
    return;
  }

  list.innerHTML = items.map(worker => {
    const active = worker.active !== false;

    return `
      <div class="panel card fx-card">
        <div class="top">
          <div>
            <h3 class="title">${escapeHtml(worker.name || "Worker")}</h3>
            <div class="sub">${escapeHtml(worker.phone || "No phone on file")}</div>
          </div>
          <span class="badge fx-badge ${active ? "active fx-badge--success" : "inactive fx-badge--danger"}">${active ? "active" : "inactive"}</span>
        </div>

        <div class="meta">
          <div class="meta-box"><div class="label">Jobs Assigned</div>${escapeHtml(worker.jobs_assigned || 0)}</div>
          <div class="meta-box"><div class="label">Jobs Completed</div>${escapeHtml(worker.jobs_completed || 0)}</div>
        </div>

        <div class="actions">
          <button type="button" class="btn blue fx-btn fx-btn--secondary" data-workers-action="edit" data-worker-id="${Number(worker.id)}">Edit</button>
          <button type="button" class="btn orange fx-btn fx-btn--ghost" data-workers-action="toggle" data-worker-id="${Number(worker.id)}">${active ? "Deactivate" : "Activate"}</button>
          ${canDeleteWorkers() ? `<button type="button" class="btn red fx-btn fx-btn--danger" data-workers-action="delete" data-worker-id="${Number(worker.id)}">Delete</button>` : ""}
        </div>
      </div>
    `;
  }).join("");
}

function openModal(id = null){
  editingId = id;

  const worker = workers.find(item => String(item.id) === String(id));

  document.getElementById("modalTitle").textContent = worker ? "Edit Worker" : "Add Worker";
  document.getElementById("worker_name").value = worker ? (worker.name || "") : "";
  document.getElementById("worker_phone").value = worker ? (worker.phone || "") : "";
  document.getElementById("worker_active").checked = worker ? worker.active !== false : true;
  document.getElementById("workerModal").style.display = "flex";
}

function closeModal(){
  document.getElementById("workerModal").style.display = "none";
}

function openDeleteWorker(id){
  deletingWorkerId = id;
  document.getElementById("deleteWorkerModal").style.display = "flex";
}

function closeDeleteWorker(){
  deletingWorkerId = null;
  document.getElementById("deleteWorkerModal").style.display = "none";
}

async function saveWorker(button){
  const restoreButton = setButtonLoading(button, "Saving...");

  try {
    const payload = {
      name: document.getElementById("worker_name").value.trim(),
      phone: document.getElementById("worker_phone").value.trim(),
      active: document.getElementById("worker_active").checked
    };

    if(!payload.name){
      alert("Worker name is required.");
      return;
    }

    const url = editingId ? API + "/ops/workers/" + editingId : API + "/ops/workers";
    const method = editingId ? "PUT" : "POST";

    const res = await apiFetch(url, {
      method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await safeJson(res);

    if(!res.ok){
      alert(getErrorMessage(data, "Unable to save worker."));
      return;
    }

    closeModal();
    await load();
  } finally {
    restoreButton();
  }
}

async function toggleStatus(id, button){
  const restoreButton = setButtonLoading(button, "Updating...");

  try {
    const worker = workers.find(item => String(item.id) === String(id));
    if(!worker) return;

    const res = await apiFetch(API + "/ops/workers/" + id, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: worker.name,
        phone: worker.phone || "",
        active: worker.active === false
      })
    });

    const data = await safeJson(res);

    if(!res.ok){
      alert(getErrorMessage(data, "Unable to update worker."));
      return;
    }

    await load();
  } finally {
    restoreButton();
  }
}

async function confirmDeleteWorker(button){
  if(!deletingWorkerId) return;

  await AppUI.withButton(button, async () => {
    const res = await apiFetch(API + "/ops/workers/" + encodeURIComponent(deletingWorkerId) + "/permanent", {
      method: "DELETE"
    });

    const data = await safeJson(res);

    if(!res.ok){
      AppUI.showToast(getErrorMessage(data, "Unable to delete worker."), "error");
      return;
    }

    closeDeleteWorker();
    AppUI.showToast(data.message || "Worker updated safely.", "success");
    await load();
  }, { loading: "Deleting..." });
}

async function load(button){
  const restoreButton = setButtonLoading(button, "Refreshing...");
  const list = document.getElementById("list");
  list.innerHTML = `<div class="empty fx-empty"><strong class="fx-empty__title">Loading workers...</strong><span class="fx-empty__text">Please wait while the field team is loaded.</span></div>`;

  try {
    const res = await apiFetch(API + "/ops/workers");
    const data = await safeJson(res);

    if(!res.ok){
      throw new Error(getErrorMessage(data, "Unable to load workers."));
    }

    workers = Array.isArray(data) ? data : [];
    render();
  } catch(err){
    workers = [];
    renderSummary();
    list.innerHTML = `<div class="empty fx-empty"><strong class="fx-empty__title">Unable to load workers</strong><span class="fx-empty__text">${escapeHtml(err && err.message ? err.message : "Please refresh and try again.")}</span></div>`;
  } finally {
    restoreButton();
  }
}

document.getElementById("search").addEventListener("input", render);

window.addEventListener("click", function(e){
  if(e.target === document.getElementById("workerModal")){
    closeModal();
  }
  if(e.target === document.getElementById("deleteWorkerModal")){
    closeDeleteWorker();
  }
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    closeModal();
    closeDeleteWorker();
  }
});

function handleWorkersListClick(ev){
  const btn = ev.target.closest("[data-workers-action]");
  if(!btn) return;
  const act = btn.getAttribute("data-workers-action");
  const wid = Number(btn.getAttribute("data-worker-id"));
  if(act === "edit") openModal(wid);
  else if(act === "toggle") toggleStatus(wid, btn);
  else if(act === "delete") openDeleteWorker(wid);
}

function bindWorkersUiHandlers(){
  document.getElementById("workersBtnAdd").addEventListener("click", () => openModal());
  document.getElementById("workersBtnRefresh").addEventListener("click", event => load(event.currentTarget));
  document.getElementById("workersBtnSave").addEventListener("click", event => saveWorker(event.currentTarget));
  document.getElementById("workersBtnCancelModal").addEventListener("click", () => closeModal());
  document.getElementById("workersBtnCancelDelete").addEventListener("click", () => closeDeleteWorker());
  document.getElementById("workersBtnConfirmDelete").addEventListener("click", e => confirmDeleteWorker(e.currentTarget));
  document.getElementById("list").addEventListener("click", handleWorkersListClick);
}

bindWorkersUiHandlers();
load();
</script>
</body>
</html>
