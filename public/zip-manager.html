<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ZIP Groups</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/app-shell.css">
  <script src="/js/role-guard.js"></script>
  
</head>

<body class="fx-layout-public">
  <script>
(function(){
  const token = localStorage.getItem("token");
  let user = null;

  try {
    user = JSON.parse(localStorage.getItem("user") || "null");
  } catch {
    user = null;
  }

  if (!token || !user) {
    window.top.location.href = "/login.html";
    return;
  }

  const role = String(user.role || "").toLowerCase();

  if (role === "worker") {
    window.top.location.href = "/control.html";
    return;
  }
})();
</script>
  
<div class="page fx-min-w-0">
  <div class="hero">
    <div>
      <h1>ZIP Groups</h1>
      <p>Route territory by ZIP and link workers directly to each service zone.</p>
    </div>
    <div class="hero-badge">Operations Routing</div>
  </div>

  <div class="top">
    <input id="name" placeholder="Group Name (Katy)">
    <select id="day">
      <option value="1">Monday</option>
      <option value="2">Tuesday</option>
      <option value="3">Wednesday</option>
      <option value="4">Thursday</option>
      <option value="5">Friday</option>
      <option value="6">Saturday</option>
      <option value="0">Sunday</option>
    </select>
    <button type="button" class="add" id="zipBtnAddGroup">Add Group</button>
  </div>

  <div id="list"></div>
</div>

<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/format.js"></script>

<script>
const API = (window.AppAPI && window.AppAPI.base) || window.location.origin;
let workers = [];
const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function apiUrl(path){
  if(/^https?:\/\//i.test(path)){
    return path;
  }
  return new URL(path, API).toString();
}

function getToken(){
  return window.AppAuth ? window.AppAuth.getToken() : localStorage.getItem("token");
}

async function apiFetch(path, options = {}){
  const token = getToken();
  if(!token){
    window.top.location.href = "/login.html";
    throw new Error("Missing token");
  }

  const url = apiUrl(path);
  const headers = {
    ...(options.headers || {}),
    Authorization: "Bearer " + token
  };

  try {
    const res = await fetch(url, {
      ...options,
      headers
    });

    if(res.status === 403 && window.AppAPI){
      window.AppAPI.handleForbidden();
    }

    if(res.status === 401){
      if(window.AppAPI){
        window.AppAPI.handleUnauthorized();
      } else {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.top.location.href = "/login.html";
      }
      throw new Error("Unauthorized");
    }

    if(!res.ok){
      const text = await res.clone().text().catch(() => "");
      console.warn("ZIP MANAGER ENDPOINT FAILED:", url, res.status, text);
    }

    return res;
  } catch(err){
    console.warn("ZIP MANAGER FETCH FAILED:", url, err);
    throw err;
  }
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function selectedWorkerIds(selectedWorkers){
  return (selectedWorkers || []).map(worker => String(worker.worker_id || worker.id));
}

function workerOptions(selectedWorkers, groupId){
  const selected = selectedWorkerIds(selectedWorkers);

  if(!workers.length){
    return `<div class="muted">No workers available yet.</div>`;
  }

  return workers.map(worker => `
    <label class="worker-option">
      <input
        type="checkbox"
        value="${escapeHtml(worker.id)}"
        data-group-id="${escapeHtml(groupId)}"
        ${selected.includes(String(worker.id)) ? "checked" : ""}
      >
      <span>${escapeHtml(worker.name || "Worker #" + worker.id)}</span>
    </label>
  `).join("");
}

function renderGroup(group){
  const groupId = Number(group.id);
  const groupDay = Number(group.day);
  const zips = Array.isArray(group.zips) ? group.zips : [];
  const groupWorkers = Array.isArray(group.workers) ? group.workers : [];

  return `
    <div class="panel fx-card">
      <div class="panel-header">
        <div>
          <div class="day">${escapeHtml(group.name || "Unnamed Group")} - ${escapeHtml(days[groupDay] || "Unknown Day")}</div>
          <div class="muted">ZIP routing day and linked workers for auto-assignment.</div>
        </div>
      </div>

      <div class="row">
        ${
          zips.length
            ? zips.map(zip => `
              <span class="zip">
                ${escapeHtml(zip.zip)}
                <button type="button" class="delete" data-zip-action="del-zip" data-zip-id="${Number(zip.id)}">x</button>
              </span>
            `).join("")
            : '<span class="muted">No ZIPs yet.</span>'
        }
      </div>

      <div class="zip-form">
        <input id="zip-${groupId}" placeholder="Add ZIP">
        <button type="button" class="add" data-zip-action="add-zip" data-group-id="${groupId}">Add ZIP</button>
      </div>

      <div class="row">
        ${
          groupWorkers.length
            ? groupWorkers.map(worker => `
              <span class="worker-pill ${worker.active === false ? 'inactive' : ''}">
                ${escapeHtml(worker.worker_name || worker.name || "Worker")}
                ${worker.active === false ? ' (inactive)' : ''}
              </span>
            `).join("")
            : '<span class="muted">No workers linked.</span>'
        }
      </div>

      <details>
        <summary>Assign Workers</summary>
        <div class="worker-list">
          ${workerOptions(groupWorkers, groupId)}
        </div>
        <div class="details-actions">
          <button type="button" class="edit" data-zip-action="save-workers" data-group-id="${groupId}">Save Workers</button>
        </div>
      </details>

      <div class="danger-row">
        <button type="button" class="delete" data-zip-action="del-group" data-group-id="${groupId}">Delete Group</button>
      </div>
    </div>
  `;
}

function renderState(title, message, loading){
  document.getElementById("list").innerHTML = `
    <div class="panel state fx-card">
      <strong>${loading ? '<span class="spinner"></span>' : ''}${escapeHtml(title)}</strong>
      <div class="muted">${escapeHtml(message || "")}</div>
    </div>
  `;
}

async function load(){
  renderState("Loading ZIP groups", "Please wait while routing data is loaded.", true);

  try {
    const [groupsRes, workersRes] = await Promise.all([
      apiFetch("/ops/zip-groups-full"),
      apiFetch("/ops/workers")
    ]);

    const data = groupsRes.ok ? await groupsRes.json() : { groups: [] };
    const workerData = workersRes.ok ? await workersRes.json() : [];

    workers = Array.isArray(workerData) ? workerData : [];

    const groups = Array.isArray(data && data.groups) ? data.groups : [];

    document.getElementById("list").innerHTML = groups.length
      ? groups.map(renderGroup).join("")
      : `
        <div class="panel state fx-card">
          <strong>No groups yet.</strong>
          <div class="muted">Create your first ZIP group to start routing jobs by territory.</div>
        </div>
      `;
  } catch(err){
    console.log("ZIP GROUP LOAD ERROR:", err);
    document.getElementById("list").innerHTML = `
      <div class="panel state fx-card">
        <strong>Unable to load ZIP groups right now.</strong>
        <div class="muted">Check the server connection, then refresh this page.</div>
      </div>
    `;
  }
}

async function addGroup(){
  const nameInput = document.getElementById("name");
  const dayInput = document.getElementById("day");

  const name = nameInput.value.trim();
  const day = dayInput.value;

  if(!name){
    alert("Enter group name");
    return;
  }

  const res = await apiFetch("/ops/zip-groups", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ name, day })
  });

  if(!res.ok){
    alert("Unable to add group");
    return;
  }

  nameInput.value = "";
  load();
}

async function addZip(groupId){
  const input = document.getElementById("zip-" + groupId);
  const zip = input ? input.value.trim() : "";

  if(!zip){
    alert("Enter ZIP");
    return;
  }

  const res = await apiFetch("/ops/zip-codes", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ zip, group_id: groupId })
  });

  if(!res.ok){
    alert("Unable to add ZIP");
    return;
  }

  load();
}

async function saveWorkers(groupId){
  const selected = Array.from(document.querySelectorAll(`input[data-group-id="${groupId}"][type="checkbox"]`))
    .filter(box => box.checked)
    .map(box => Number(box.value));

  const res = await apiFetch("/ops/zip-groups/" + groupId + "/workers", {
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ worker_ids: selected })
  });

  if(!res.ok){
    alert("Unable to save workers");
    return;
  }

  load();
}

async function delZip(id){
  if(!confirm("Delete this ZIP code from the group?")) return;

  const res = await apiFetch("/ops/zip-codes/" + id, { method:"DELETE" });

  if(!res.ok){
    alert("Unable to delete ZIP");
    return;
  }

  load();
}

async function delGroup(id){
  if(!confirm("Delete this ZIP group?")) return;

  const res = await apiFetch("/ops/zip-groups/" + id, { method:"DELETE" });

  if(!res.ok){
    alert("Unable to delete group");
    return;
  }

  load();
}

function handleZipListClick(ev){
  const btn = ev.target.closest("[data-zip-action]");
  if(!btn) return;
  const act = btn.getAttribute("data-zip-action");
  if(act === "del-zip") delZip(Number(btn.getAttribute("data-zip-id")));
  else if(act === "add-zip") addZip(Number(btn.getAttribute("data-group-id")));
  else if(act === "save-workers") saveWorkers(Number(btn.getAttribute("data-group-id")));
  else if(act === "del-group") delGroup(Number(btn.getAttribute("data-group-id")));
}

document.getElementById("zipBtnAddGroup").addEventListener("click", () => addGroup());
document.getElementById("list").addEventListener("click", handleZipListClick);

load();
</script>
</body>
</html>
