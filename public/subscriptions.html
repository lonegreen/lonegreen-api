<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subscriptions</title>
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/app-shell.css">
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --fx-page: #f6f8f7;
      --fx-card: rgba(255,255,255,0.96);
      --fx-text: var(--brand-black);
      --fx-muted: #587165;
      --fx-line: var(--brand-border);
      --fx-soft: var(--brand-bg);
      --fx-orange: var(--brand-primary);
      --fx-orange-dark: var(--brand-primary-hover);
      --fx-green: #166534;
      --fx-red: #b42318;
      --fx-warn: #b45309;
      --fx-shadow: 0 18px 42px rgba(16,24,40,0.08);
      --fx-shadow-soft: 0 10px 24px rgba(16,24,40,0.06);
      --fx-radius: 22px;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255,90,0,0.13), transparent 28%),
        radial-gradient(circle at top right, rgba(22,101,52,0.08), transparent 24%),
        linear-gradient(180deg, #fbfcfb 0%, var(--fx-page) 44%, #f4f6f8 100%);
      color: var(--fx-text);
    }

    .container {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: 30px 24px 48px;
      display: grid;
      gap: 18px;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--fx-orange);
      font-size: clamp(32px, 4vw, 46px);
      line-height: 1;
      letter-spacing: -0.045em;
      font-weight: 950;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .panel {
      background: var(--fx-card);
      padding: 20px;
      border-radius: var(--fx-radius);
      border: 1px solid var(--fx-line);
      box-shadow: var(--fx-shadow);
      margin-bottom: 16px;
    }

    .earn {
      position: relative;
      overflow: hidden;
      font-size: 18px;
      font-weight: 950;
      color: var(--fx-text);
      line-height: 1.5;
      padding: 22px 22px 22px 92px;
      min-height: 94px;
      display: flex;
      align-items: center;
    }

    .earn::before {
      content: "↻";
      position: absolute;
      left: 22px;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #fff3ec;
      color: var(--fx-orange);
      font-size: 26px;
      box-shadow: inset 0 0 0 1px rgba(255,90,0,0.08);
    }

    .btn {
      min-height: 44px;
      padding: 11px 15px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font-weight: 900;
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease, border-color .15s ease;
      box-shadow: var(--fx-shadow-soft);
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 14px 26px rgba(16,24,40,0.10);
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .add,
    .edit,
    .activate {
      background: linear-gradient(135deg, var(--fx-orange), var(--fx-orange-dark));
      color: white;
    }

    .pause {
      background: #f59e0b;
      color: white;
    }

    .danger {
      background: #dc2626;
      color: white;
    }

    .soft {
      background: rgba(255,255,255,0.9);
      color: var(--fx-orange);
      border: 1px solid var(--fx-line);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .subscription-title {
      font-size: 19px;
      color: var(--fx-text);
      line-height: 1.35;
      word-break: break-word;
      letter-spacing: -0.02em;
    }

    .subscription-service {
      margin-top: 4px;
      color: #3c5f50;
      line-height: 1.45;
      word-break: break-word;
      font-weight: 800;
    }

    .status {
      padding: 7px 12px;
      border-radius: 999px;
      color: white;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 950;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .green { background: #16a34a; }
    .red { background: #ef4444; }
    .orange { background: #f59e0b; }
    .gray { background: #6b7280; }

    .muted {
      color: var(--fx-muted);
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
      font-weight: 650;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .detail-box {
      padding: 13px;
      border-radius: 15px;
      border: 1px solid var(--fx-line);
      background: linear-gradient(180deg, #ffffff, var(--fx-soft));
      min-width: 0;
      word-break: break-word;
    }

    .detail-label {
      font-size: 10px;
      color: #6b7f75;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .055em;
      margin-bottom: 6px;
    }

    .detail-value {
      font-size: 15px;
      color: var(--fx-text);
      font-weight: 900;
      line-height: 1.35;
    }

    .history {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #e5ece8;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 7px 11px;
      border-radius: 999px;
      background: #ecf5ef;
      color: var(--fx-orange);
      font-size: 12px;
      font-weight: 950;
    }

    .empty {
      min-height: 180px;
      padding: 34px 24px;
      text-align: center;
      color: var(--fx-muted);
      line-height: 1.5;
      display: grid;
      place-items: center;
      align-content: center;
      border: 1px dashed #cfded6;
      background:
        radial-gradient(circle at center top, rgba(22,101,52,0.07), transparent 34%),
        linear-gradient(180deg, #ffffff, #fbfdfc);
    }

    .empty strong {
      display: block;
      color: var(--fx-text);
      font-size: 20px;
      margin-bottom: 6px;
      letter-spacing: -0.03em;
      font-weight: 950;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      justify-content: center;
      align-items: center;
      padding: 18px;
      z-index: 999;
      backdrop-filter: blur(5px);
    }

    .modal-box {
      width: 760px;
      max-width: 100%;
      max-height: 92vh;
      overflow: auto;
      background: white;
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 28px 70px rgba(16,24,40,0.26);
    }

    .modal-box h3 {
      margin: 0 0 18px;
      color: var(--fx-orange);
      font-size: 25px;
      letter-spacing: -0.035em;
      font-weight: 950;
    }

    .modal-box p {
      color: var(--fx-muted);
      line-height: 1.55;
      margin: 0;
      font-weight: 700;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.wide {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 11px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.055em;
      color: var(--fx-muted);
    }

    input,
    select {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border-radius: 14px;
      border: 1px solid var(--fx-line);
      background: white;
      color: var(--fx-text);
      font: inherit;
      outline: none;
      transition: border .15s ease, box-shadow .15s ease;
    }

    input:focus,
    select:focus {
      border-color: var(--fx-orange);
      box-shadow: 0 0 0 4px rgba(255,90,0,0.14);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    #list .panel {
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }

    #list .panel:hover {
      transform: translateY(-1px);
      border-color: rgba(255,90,0,0.28);
      box-shadow: 0 20px 46px rgba(16,24,40,0.10);
    }

    @media (max-width: 1120px) {
      .details-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 860px) {
      .container {
        padding: 22px 14px 34px;
      }

      .form-grid,
      .details-grid {
        grid-template-columns: 1fr;
      }

      .top-bar {
        align-items: stretch;
      }

      .top-bar .btn {
        width: 100%;
      }

      .row {
        align-items: flex-start;
      }

      .row .btn {
        flex: 1 1 150px;
      }

      .earn {
        padding: 86px 18px 18px;
        align-items: flex-start;
      }

      .earn::before {
        left: 18px;
        top: 18px;
        transform: none;
      }

      .modal-actions .btn {
        width: 100%;
      }
    }
  </style>
  <link rel="stylesheet" href="/ui-cleanup.css">
  <script src="/js/role-guard.js"></script>
</head>
<body class="phase2-internal">
  <script>
(function(){
  const token = localStorage.getItem("token");

  let user = null;

  try {
    user = JSON.parse(localStorage.getItem("user") || "null");
  } catch (e) {
    user = null;
  }

  if (!token || !user) {
    window.location.href = "/login.html";
    return;
  }

  const role = String(user.role || "").toLowerCase();

  if (role === "worker") {
    window.location.href = "/control.html";
    return;
  }
})();
</script>

<div class="container">
  <div class="top-bar fx-section-head">
    <div>
      <h1>Subscriptions</h1>
      <div class="muted">Pause/resume subscriptions, track billing history, and review upcoming visits at a glance.</div>
    </div>
    <button type="button" class="btn add fx-btn fx-btn--primary" id="subsBtnRefresh">Refresh</button>
  </div>

  <div id="subsRetentionInsights" class="panel fx-card" style="display:none;" role="region" aria-label="Renewal insights"></div>
  <div id="subsUpgradeCandidates" class="panel fx-card" style="display:none;" role="region" aria-label="Subscription upgrade candidates"></div>

  <div id="earn" class="panel earn fx-stat">Loading...</div>
  <div id="list"></div>
</div>

<div id="subscriptionEditModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="subscriptionEditTitle">
  <div class="modal-box fx-card">
    <h3 id="subscriptionEditTitle">Edit Subscription</h3>
    <div class="form-grid">
      <div class="field fx-field">
        <label for="edit_service">Service</label>
        <input id="edit_service" class="fx-input" placeholder="Service">
      </div>
      <div class="field fx-field">
        <label for="edit_frequency">Frequency</label>
        <select id="edit_frequency" class="fx-select">
          <option value="weekly">Weekly</option>
          <option value="biweekly">Biweekly</option>
          <option value="monthly">Monthly</option>
        </select>
      </div>
      <div class="field fx-field">
        <label for="edit_start_date">Start Date</label>
        <input id="edit_start_date" class="fx-input" type="date">
      </div>
      <div class="field fx-field">
        <label for="edit_next_date">Next Visit</label>
        <input id="edit_next_date" class="fx-input" type="date">
      </div>
      <div class="field fx-field">
        <label for="edit_price">Price</label>
        <input id="edit_price" class="fx-input" type="number" min="0" step="0.01" placeholder="Price">
      </div>
      <div class="field fx-field">
        <label for="edit_worker_id">Worker</label>
        <select id="edit_worker_id" class="fx-select">
          <option value="">Auto / unassigned</option>
        </select>
      </div>
      <div class="field wide fx-field">
        <label for="edit_status">Status</label>
        <select id="edit_status" class="fx-select">
          <option value="draft">Draft</option>
          <option value="active">Active</option>
          <option value="paused">Paused</option>
          <option value="cancelled">Cancelled</option>
          <option value="completed">Completed</option>
          <option value="expired">Expired</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn add fx-btn fx-btn--primary" id="subsBtnSaveEdit">Save</button>
      <button type="button" class="btn soft fx-btn fx-btn--secondary" id="subsBtnCancelEdit">Cancel</button>
    </div>
  </div>
</div>

<div id="deleteSubscriptionModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="deleteSubscriptionTitle">
  <div class="modal-box fx-card">
    <h3 id="deleteSubscriptionTitle">Delete Subscription</h3>
    <p>This will safely archive, cancel, deactivate, or delete only when safe.</p>
    <div class="modal-actions">
      <button type="button" class="btn soft fx-btn fx-btn--secondary" id="subsBtnCancelDelete">Cancel</button>
      <button type="button" class="btn danger fx-btn fx-btn--danger" id="subsBtnConfirmDelete">Delete</button>
    </div>
  </div>
</div>

<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/format.js"></script>
<script>
const API = window.location.origin;
let subscriptions = [];
let workers = [];
let editingSubscription = null;
let deletingSubscriptionId = null;
let isLoading = false;

const getToken = AppAuth.getToken;
const apiFetch = AppAPI.fetch;

function statusColor(status){
  if(status === "active") return "green";
  if(status === "paused") return "orange";
  if(status === "completed") return "green";
  if(status === "cancelled" || status === "expired") return "red";
  return "gray";
}

function formatDate(value){
  if(!value) return "";
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? "" : d.toLocaleDateString();
}

const formatMoney = AppFormat.formatMoney;

function formatDateInput(value){
  return value ? String(value).split("T")[0] : "";
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

async function safeJson(res){
  try {
    return await res.json();
  } catch {
    try {
      const text = await res.text();
      return { error: text || "Request failed." };
    } catch {
      return { error: "Request failed." };
    }
  }
}

function getErrorMessage(data, fallback){
  if(data && typeof data.error === "string" && data.error.trim()) return data.error;
  if(data && typeof data.message === "string" && data.message.trim()) return data.message;
  return fallback;
}

function setButtonLoading(button, text){
  if(!button) return function(){};
  const oldText = button.textContent;
  button.disabled = true;
  button.textContent = text;
  return function(){
    button.disabled = false;
    button.textContent = oldText;
  };
}

function currentRole(){
  try {
    return String((JSON.parse(localStorage.getItem("user") || "{}").role) || "").toLowerCase();
  } catch {
    return "";
  }
}

function canDeleteSubscriptions(){
  return ["owner", "admin", "manager"].includes(currentRole());
}

function canBillSubscriptions(){
  return ["owner", "admin"].includes(currentRole());
}

function fillWorkerOptions(selectedWorkerId = ""){
  const select = document.getElementById("edit_worker_id");

  select.innerHTML =
    `<option value="">Auto / unassigned</option>` +
    workers.map(worker => `
      <option value="${escapeHtml(worker.id)}" ${String(selectedWorkerId || "") === String(worker.id) ? "selected" : ""}>
        ${escapeHtml(worker.name || ("Worker #" + worker.id))}
      </option>
    `).join("");
}

function detail(label, value){
  return `
    <div class="detail-box fx-stat">
      <div class="detail-label fx-stat__label">${escapeHtml(label)}</div>
      <div class="detail-value fx-stat__value">${escapeHtml(value || "-")}</div>
    </div>
  `;
}

function renderSubscription(sub){
  const status = sub.status || "draft";
  const normalizedStatus = String(status || "").toLowerCase();
  const workerDisplay = sub.worker_name || (sub.worker_id ? "#" + sub.worker_id : "Auto / unassigned");

  return `<div class="panel fx-card">
    <div class="row">
      <div>
        <div class="subscription-title"><b>${escapeHtml(sub.client_name || ("Client #" + (sub.client_id || "")))}</b></div>
        <div class="subscription-service">${escapeHtml(sub.service || "")}</div>
        <div class="muted">Worker: ${escapeHtml(workerDisplay)}</div>
      </div>
      <div class="status fx-badge ${statusColor(status)} ${normalizedStatus === "active" || normalizedStatus === "completed" ? "fx-badge--success" : (normalizedStatus === "paused" ? "fx-badge--warning" : (normalizedStatus === "cancelled" || normalizedStatus === "expired" ? "fx-badge--danger" : "fx-badge--neutral"))}">${escapeHtml(status)}</div>
    </div>

    <div class="details-grid">
      ${detail("Frequency", sub.frequency || "-")}
      ${detail("Next Visit", formatDate(sub.next_date) || "-")}
      ${detail("Upcoming Visits", sub.upcoming_visit_count || 0)}
      ${detail("Nearest Scheduled", formatDate(sub.next_upcoming_visit) || "-")}
      ${detail("Client ZIP", sub.client_zip || "-")}
      ${detail("Monthly Price", formatMoney(sub.price || 0))}
      ${detail("Next Billing", formatDate(sub.next_billing_date) || "-")}
      ${detail("Last Billed", formatDate(sub.last_billed_date || sub.last_billing_date || sub.last_billed_at) || "-")}
      ${detail("Billing Count", sub.billing_history_count || 0)}
      ${detail("Latest Invoice", sub.latest_invoice_number || "-")}
    </div>

    ${sub.pause_reason ? `<div class="muted" style="margin-top:10px;">Pause reason: ${escapeHtml(sub.pause_reason)}</div>` : ""}
    ${sub.cancel_reason ? `<div class="muted" style="margin-top:6px;">Cancel reason: ${escapeHtml(sub.cancel_reason)}</div>` : ""}

    <div class="history"><span class="badge fx-badge fx-badge--info">MRR ${escapeHtml(formatMoney(sub.price || 0))}</span></div>

    <div class="row" style="margin-top:14px;">
      <button type="button" class="btn edit fx-btn fx-btn--secondary" data-sub-action="edit" data-sub-id="${Number(sub.id)}">Edit</button>
      ${normalizedStatus === "active" ? `<button type="button" class="btn pause fx-btn fx-btn--ghost" data-sub-action="set-status" data-sub-id="${Number(sub.id)}" data-status="paused">Pause</button>` : ""}
      ${normalizedStatus === "paused" ? `<button type="button" class="btn activate fx-btn fx-btn--primary" data-sub-action="set-status" data-sub-id="${Number(sub.id)}" data-status="active">Resume</button>` : ""}
      ${normalizedStatus === "cancelled" ? "" : `<button type="button" class="btn danger fx-btn fx-btn--danger" data-sub-action="set-status" data-sub-id="${Number(sub.id)}" data-status="cancelled">Cancel</button>`}
      ${canBillSubscriptions() ? `<button type="button" class="btn edit fx-btn fx-btn--secondary" data-sub-action="mark-paid" data-sub-id="${Number(sub.id)}">Bill & Mark Paid</button>` : ""}
      ${canDeleteSubscriptions() ? `<button type="button" class="btn danger fx-btn fx-btn--danger" data-sub-action="delete" data-sub-id="${Number(sub.id)}">Delete</button>` : ""}
    </div>
  </div>`;
}

function openSubscriptionEdit(id){
  const subscription = subscriptions.find(item => String(item.id) === String(id));
  if(!subscription) return;

  editingSubscription = subscription;

  document.getElementById("edit_service").value = subscription.service || "";
  document.getElementById("edit_frequency").value = subscription.frequency || "weekly";
  document.getElementById("edit_start_date").value = formatDateInput(subscription.start_date || subscription.next_date);
  document.getElementById("edit_next_date").value = formatDateInput(subscription.next_date);
  document.getElementById("edit_price").value = Number(subscription.price || 0);
  document.getElementById("edit_status").value = subscription.status || "active";

  fillWorkerOptions(subscription.worker_id || "");

  document.getElementById("subscriptionEditModal").style.display = "flex";
}

function closeSubscriptionEdit(){
  editingSubscription = null;
  document.getElementById("subscriptionEditModal").style.display = "none";
}

function openDeleteSubscription(id){
  deletingSubscriptionId = id;
  document.getElementById("deleteSubscriptionModal").style.display = "flex";
}

function closeDeleteSubscription(){
  deletingSubscriptionId = null;
  document.getElementById("deleteSubscriptionModal").style.display = "none";
}

async function saveSubscriptionEdit(button){
  if(!editingSubscription) return;

  const restoreButton = setButtonLoading(button, "Saving...");

  try {
    const payload = {
      client_id: editingSubscription.client_id,
      service: document.getElementById("edit_service").value.trim(),
      frequency: document.getElementById("edit_frequency").value,
      start_date: document.getElementById("edit_start_date").value,
      next_date: document.getElementById("edit_next_date").value,
      price: Number(document.getElementById("edit_price").value || 0),
      worker_id: document.getElementById("edit_worker_id").value ? Number(document.getElementById("edit_worker_id").value) : null,
      status: document.getElementById("edit_status").value,
      rebuild_future_jobs: false
    };

    if(!payload.client_id || !payload.service || !payload.frequency || !payload.start_date || !payload.next_date){
      alert("Please fill the required subscription fields.");
      return;
    }

    const res = await apiFetch(API + "/ops/subscriptions/" + editingSubscription.id, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await safeJson(res);

    if(!res.ok){
      alert(getErrorMessage(data, "Unable to update subscription."));
      return;
    }

    closeSubscriptionEdit();
    load();
  } finally {
    restoreButton();
  }
}

async function setStatus(id, status, button){
  const restoreButton = setButtonLoading(button, status === "cancelled" ? "Cancelling..." : "Updating...");

  try {
    const pause_reason = status === "paused" ? (prompt("Pause reason (optional):") || "") : "";
    const cancel_reason = status === "cancelled" ? (prompt("Cancel reason (optional):") || "") : "";

    const res = await apiFetch(API + "/ops/subscriptions/" + id + "/status", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status, pause_reason, cancel_reason })
    });

    const data = await safeJson(res);

    if(!res.ok){
      alert(getErrorMessage(data, "Unable to update subscription."));
      return;
    }

    load();
  } finally {
    restoreButton();
  }
}

async function markPaid(id, button){
  const restoreButton = setButtonLoading(button, "Billing...");

  try {
    const method = (prompt("Payment method: cash, zelle, or card", "cash") || "cash").trim().toLowerCase();
    const notes = prompt("Billing note (optional):") || "";

    const res = await apiFetch(API + "/ops/subscriptions/" + id + "/mark-paid", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ method, notes })
    });

    const data = await safeJson(res);

    if(!res.ok){
      alert(getErrorMessage(data, "Unable to bill subscription."));
      return;
    }

    alert(`Subscription billed. Invoice ${data.invoice_id || ""} recorded as paid.`);
    load();
  } finally {
    restoreButton();
  }
}

async function confirmDeleteSubscription(button){
  if(!deletingSubscriptionId) return;

  await AppUI.withButton(button, async () => {
    const res = await apiFetch(API + "/ops/subscriptions/" + encodeURIComponent(deletingSubscriptionId) + "/permanent", {
      method: "DELETE"
    });

    const data = await safeJson(res);

    if(!res.ok){
      AppUI.showToast(getErrorMessage(data, "Unable to delete subscription."), "error");
      return;
    }

    closeDeleteSubscription();
    AppUI.showToast(data.message || "Subscription updated safely.", "success");
    await load();
  }, { loading: "Deleting..." });
}

async function loadRetentionInsights(){
  const insightEl = document.getElementById("subsRetentionInsights");
  if(!insightEl) return;
  if(!["owner","admin","manager"].includes(currentRole())){
    insightEl.style.display = "none";
    return;
  }
  try {
    const res = await apiFetch(API + "/analytics/customer-retention/subscription-renewals");
    const data = await safeJson(res);
    if(!res.ok){
      insightEl.style.display = "none";
      return;
    }
    const cands = data && data.candidates ? data.candidates : [];
    const n = Array.isArray(cands) ? cands.length : 0;
    insightEl.style.display = "block";
    insightEl.innerHTML =
      "<strong>Renewal &amp; billing signals</strong>" +
      '<div class="muted" style="margin-top:8px;line-height:1.5;">' +
      (n
        ? escapeHtml(String(n)) + " subscription(s) flagged in renewal / pause / cancel follow-up lists. Next billing dates still appear on each card below."
        : "No subscriptions in the current renewal candidate window.") +
      ' Open <a href="/analytics.html">Analytics</a> → Growth OS for detail.</div>';
  } catch (_) {
    insightEl.style.display = "none";
  }
}

async function loadSubscriptionUpgradeCandidates(){
  const insightEl = document.getElementById("subsUpgradeCandidates");
  if(!insightEl) return;
  if(!["owner","admin","manager"].includes(currentRole())){
    insightEl.style.display = "none";
    return;
  }
  try {
    const res = await apiFetch(API + "/analytics/growth-loops/subscription-upgrades");
    const data = await safeJson(res);
    if(!res.ok){
      insightEl.style.display = "none";
      return;
    }
    const cands = Array.isArray(data && data.opportunities) ? data.opportunities : [];
    insightEl.style.display = "block";
    const rows = cands.slice(0, 5).map(function(item){
      const metrics = item.metrics || {};
      return '<div class="muted" style="margin-top:8px;"><strong>' + escapeHtml(item.client_name || ("Client #" + item.client_id)) + '</strong> - ' +
        escapeHtml(String(metrics.completed_jobs_90d || 0)) + ' completed jobs in 90 days.</div>';
    }).join("");
    insightEl.innerHTML =
      "<strong>Subscription upgrade candidates</strong>" +
      '<div class="muted" style="margin-top:8px;line-height:1.5;">Repeat clients without active subscriptions. Review manually before creating any subscription.</div>' +
      (rows || '<div class="muted" style="margin-top:8px;">No upgrade candidates detected right now.</div>');
  } catch (_) {
    insightEl.style.display = "none";
  }
}

function renderLoading(){
  document.getElementById("earn").textContent = "Loading subscription summary...";
  document.getElementById("list").innerHTML = `<div class="panel empty fx-empty"><strong class="fx-empty__title">Loading subscriptions...</strong><span class="fx-empty__text">Please wait while the latest subscription data is loaded.</span></div>`;
}

function renderData(){
  const safeSubs = Array.isArray(subscriptions) ? subscriptions : [];

  const activeCount = safeSubs.filter(sub => sub.status === "active").length;
  const pausedCount = safeSubs.filter(sub => sub.status === "paused").length;
  const monthlyValue = safeSubs
    .filter(sub => sub.status === "active")
    .reduce((sum, sub) => sum + Number(sub.price || 0), 0);
  const lastBilledCount = safeSubs.filter(sub => sub.last_billed_date || sub.last_billed_at).length;

  document.getElementById("earn").textContent =
    `Active: ${activeCount} | Paused: ${pausedCount} | MRR: ${formatMoney(monthlyValue)} | Billed subscriptions: ${lastBilledCount}`;

  document.getElementById("list").innerHTML = safeSubs.length
    ? safeSubs.map(renderSubscription).join("")
    : `<div class="panel empty fx-empty"><strong class="fx-empty__title">No subscriptions found</strong><span class="fx-empty__text">Create subscriptions from the client workflow when recurring work is approved.</span></div>`;
}

async function load(button){
  isLoading = true;
  const restoreButton = setButtonLoading(button, "Refreshing...");
  renderLoading();

  try {
    const [res, workersRes] = await Promise.all([
      apiFetch(API + "/ops/subscriptions"),
      apiFetch(API + "/ops/workers")
    ]);

    const subs = await safeJson(res);
    const workerData = await safeJson(workersRes);

    if(!res.ok){
      throw new Error(getErrorMessage(subs, "Unable to load subscriptions."));
    }

    if(!workersRes.ok){
      workers = [];
    } else {
      workers = Array.isArray(workerData) ? workerData : [];
    }

    subscriptions = Array.isArray(subs) ? subs : [];

    renderData();
    await loadRetentionInsights();
    await loadSubscriptionUpgradeCandidates();
  } catch(err){
    console.log("SUBSCRIPTIONS LOAD ERROR:", err);
    subscriptions = [];
    document.getElementById("earn").textContent = "Unable to load subscription summary.";
    document.getElementById("list").innerHTML =
      `<div class="panel empty fx-empty"><strong class="fx-empty__title">Unable to load subscriptions</strong><span class="fx-empty__text">${escapeHtml(err && err.message ? err.message : "Please refresh and try again.")}</span></div>`;
  } finally {
    isLoading = false;
    restoreButton();
  }
}

window.addEventListener("click", event => {
  if(event.target === document.getElementById("subscriptionEditModal")){
    closeSubscriptionEdit();
  }
  if(event.target === document.getElementById("deleteSubscriptionModal")){
    closeDeleteSubscription();
  }
});

document.addEventListener("keydown", event => {
  if(event.key === "Escape"){
    closeSubscriptionEdit();
    closeDeleteSubscription();
  }
});

function handleSubsListClick(ev){
  const btn = ev.target.closest("[data-sub-action]");
  if(!btn) return;
  const act = btn.getAttribute("data-sub-action");
  const sid = Number(btn.getAttribute("data-sub-id"));
  if(act === "edit") openSubscriptionEdit(sid);
  else if(act === "set-status") setStatus(sid, btn.getAttribute("data-status"), btn);
  else if(act === "mark-paid") markPaid(sid, btn);
  else if(act === "delete") openDeleteSubscription(sid);
}

function bindSubscriptionsUiHandlers(){
  document.getElementById("subsBtnRefresh").addEventListener("click", event => load(event.currentTarget));
  document.getElementById("subsBtnSaveEdit").addEventListener("click", event => saveSubscriptionEdit(event.currentTarget));
  document.getElementById("subsBtnCancelEdit").addEventListener("click", () => closeSubscriptionEdit());
  document.getElementById("subsBtnCancelDelete").addEventListener("click", () => closeDeleteSubscription());
  document.getElementById("subsBtnConfirmDelete").addEventListener("click", e => confirmDeleteSubscription(e.currentTarget));
  document.getElementById("list").addEventListener("click", handleSubsListClick);
}

bindSubscriptionsUiHandlers();
load();
</script>
</body>
