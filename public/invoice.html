<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Invoice</title>
  <link rel="stylesheet" href="/app-shell.css">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #eef4f0 0%, #f7faf8 180px, #eef4f0 100%);
      color: #163328;
    }

    .page {
      max-width: 1080px;
      margin: 24px auto;
      background: rgba(255,255,255,0.98);
      border-radius: 20px;
      box-shadow: 0 18px 42px rgba(16,24,40,0.08);
      overflow: hidden;
      border: 1px solid #dbe8df;
    }

    .header {
      padding: 28px;
      background: linear-gradient(135deg, #0f2e1c, #1f5c3a);
      color: white;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: 32px;
      letter-spacing: -0.03em;
    }

    #invoiceNumber {
      opacity: .92;
      font-weight: 700;
    }

    #companyBlock {
      line-height: 1.55;
      opacity: .96;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .paid-badge {
      background: #d7f7e3;
      color: #166534;
      margin-bottom: 10px;
    }

    .body {
      padding: 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 22px;
    }

    .box {
      border: 1px solid #dce8e1;
      border-radius: 16px;
      padding: 16px;
      background: #f8fbf9;
      line-height: 1.55;
      word-break: break-word;
    }

    .label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6a8278;
      margin-bottom: 6px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      margin-bottom: 22px;
      border: 1px solid #e4ece7;
      border-radius: 16px;
      background: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 680px;
    }

    th,
    td {
      padding: 14px 12px;
      border-bottom: 1px solid #e4ece7;
      text-align: left;
      vertical-align: top;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    th {
      color: #4f665c;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: #f8fbf9;
    }

    td {
      color: #173327;
      line-height: 1.45;
      word-break: break-word;
    }

    .summary {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 18px;
      margin-bottom: 22px;
    }

    .payment-box {
      border: 1px solid #dce8e1;
      border-radius: 16px;
      padding: 18px;
      background: #f8fbf9;
    }

    .totals-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .money-card {
      border: 1px solid #dce8e1;
      border-radius: 16px;
      padding: 18px;
      background: #f8fbf9;
      min-width: 0;
    }

    .money-card strong {
      display: block;
      margin-top: 6px;
      font-size: 28px;
      color: #1f5c3a;
      letter-spacing: -0.03em;
      word-break: break-word;
    }

    .money-card.remaining strong {
      color: #b42318;
    }

    .money-card.paid strong {
      color: #027a48;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 0 28px 28px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
      box-shadow: 0 8px 16px rgba(16,24,40,0.06);
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 12px 22px rgba(16,24,40,0.10);
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .primary {
      background: #1f5c3a;
      color: white;
    }

    .gray {
      background: #eef2f0;
      color: #1f5c3a;
      border: 1px solid #dbe7df;
    }

    .blue {
      background: #2563eb;
      color: white;
    }

    .red {
      background: #dc2626;
      color: white;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.52);
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 18px;
    }

    .modal-box {
      background: white;
      width: 760px;
      max-width: 100%;
      max-height: 92vh;
      overflow: auto;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 24px 54px rgba(0,0,0,0.22);
    }

    .modal-box h3 {
      margin: 0 0 16px;
      color: #1f5c3a;
      font-size: 22px;
      letter-spacing: -0.02em;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field.wide {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6a8278;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px 13px;
      border-radius: 12px;
      border: 1px solid #cfe0d5;
      background: white;
      color: #163328;
      font: inherit;
      outline: none;
      transition: border .15s ease, box-shadow .15s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #1f5c3a;
      box-shadow: 0 0 0 4px rgba(31,92,58,0.10);
    }

    textarea {
      resize: vertical;
    }

    .line-items-editor {
      display: grid;
      gap: 10px;
    }

    .line-item-row {
      display: grid;
      grid-template-columns: minmax(0, 2fr) 110px 130px;
      gap: 10px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .notes {
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty {
      color: #6a8278;
      font-size: 14px;
      line-height: 1.55;
    }

    .empty-card {
      padding: 28px;
      text-align: center;
      color: #6a8278;
      line-height: 1.55;
    }

    .empty-card strong {
      display: block;
      color: #173327;
      font-size: 18px;
      margin-bottom: 6px;
    }

    @media print {
      body {
        background: white;
      }

      .page {
        box-shadow: none;
        margin: 0;
        max-width: none;
        border-radius: 0;
        border: none;
      }

      .actions,
      .modal {
        display: none !important;
      }

      .table-wrap {
        overflow: visible;
      }

      table {
        min-width: 0;
      }
    }

    @media (max-width: 820px) {
      .page {
        margin: 0;
        border-radius: 0;
      }

      .header,
      .body,
      .actions {
        padding-left: 18px;
        padding-right: 18px;
      }

      .grid,
      .summary,
      .totals-grid,
      .form-grid,
      .line-item-row {
        grid-template-columns: 1fr;
      }

      .actions .btn {
        flex: 1 1 150px;
      }

      .header > div:last-child {
        text-align: left !important;
      }
    }
  </style>
  <script src="/js/role-guard.js"></script>
</head>
<body>
  <script>
(function(){
  const token = localStorage.getItem("token");

  let user = null;

  try {
    user = JSON.parse(localStorage.getItem("user") || "null");
  } catch (e) {
    user = null;
  }

  if (!token || !user) {
    window.location.href = "/login.html";
    return;
  }

  const role = String(user.role || "").toLowerCase();

  if (role === "worker") {
    window.location.href = "/control.html";
    return;
  }
})();
</script>
<div class="page">
  <div class="header">
    <div>
      <h1>Invoice</h1>
      <div id="invoiceNumber">Loading...</div>
    </div>
    <div style="text-align:right;">
      <div id="paidBadge"></div>
      <div id="companyBlock"></div>
    </div>
  </div>

  <div class="body">
    <div class="grid">
      <div class="box"><div class="label">Bill To</div><div id="clientBlock"></div></div>
      <div class="box"><div class="label">Invoice Details</div><div id="invoiceBlock"></div></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Description</th><th>Qty</th><th>Price</th><th>Line Total</th></tr>
        </thead>
        <tbody id="lineItems"></tbody>
      </table>
    </div>

    <div class="summary">
      <div class="payment-box">
        <div class="label">Payment History</div>
        <div id="paymentsList" class="empty">No payments recorded.</div>
      </div>

      <div class="totals-grid">
        <div class="money-card">
          <div class="label">Total</div>
          <strong id="invoiceTotal">$0.00</strong>
        </div>
        <div class="money-card paid">
          <div class="label">Paid</div>
          <strong id="paidAmount">$0.00</strong>
        </div>
        <div class="money-card remaining">
          <div class="label">Remaining</div>
          <strong id="remainingBalance">$0.00</strong>
        </div>
      </div>
    </div>

    <div class="box" id="notesBox" style="display:none;"></div>
    <div id="invoiceEmpty" style="display:none;"></div>
  </div>

  <div class="actions">
    <button class="btn gray" onclick="openEditInvoice()">Edit Invoice</button>
    <button class="btn primary" id="markPaidButton" onclick="markAsPaid(this)">Mark as Paid</button>
    <button class="btn blue" id="recordPaymentButton" onclick="recordPayment(this)">Record Payment</button>
    <button class="btn red" onclick="cancelInvoice(this)">Void / Cancel</button>
    <button class="btn red" id="deleteInvoiceButton" onclick="openDeleteInvoice()">Delete</button>
    <button class="btn gray" onclick="window.close()">Close</button>
    <button class="btn primary" onclick="window.print()">Print Invoice</button>
  </div>
</div>

<div id="invoiceEditModal" class="modal">
  <div class="modal-box">
    <h3>Edit Invoice</h3>

    <div class="form-grid">
      <div class="field">
        <label for="edit_invoice_status">Status</label>
        <select id="edit_invoice_status">
          <option value="draft">Draft</option>
          <option value="unpaid">Unpaid</option>
          <option value="paid">Paid</option>
          <option value="overdue">Overdue</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>

      <div class="field">
        <label for="edit_invoice_due_date">Due Date</label>
        <input id="edit_invoice_due_date" type="date">
      </div>

      <div class="field wide">
        <label>Line Items</label>
        <div id="invoiceLineItems" class="line-items-editor"></div>
      </div>

      <div class="field wide">
        <label for="edit_invoice_notes">Notes</label>
        <textarea id="edit_invoice_notes" rows="4" placeholder="Invoice notes"></textarea>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn primary" onclick="saveInvoiceEdit(this)">Save</button>
      <button class="btn gray" onclick="closeEditInvoice()">Cancel</button>
    </div>
  </div>
</div>

<div id="deleteInvoiceModal" class="modal">
  <div class="modal-box">
    <h3>Delete Invoice</h3>
    <p>This will safely archive, cancel, deactivate, or delete only when safe.</p>
    <div class="modal-actions">
      <button class="btn red" onclick="confirmDeleteInvoice(this)">Delete</button>
      <button class="btn gray" onclick="closeDeleteInvoice()">Cancel</button>
    </div>
  </div>
</div>

<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/format.js"></script>
<script>
const API = window.location.origin;
let invoiceId = null;
let currentInvoice = null;

const getToken = AppAuth.getToken;

async function apiFetch(url, options = {}){
  const res = await fetch(url, {
    ...options,
    headers: {
      ...(options.headers || {}),
      Authorization: "Bearer " + getToken()
    }
  });

  if(res.status === 403 && window.AppAPI){
    window.AppAPI.handleForbidden();
  }

  if(res.status === 401){
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    window.location.href = "/login.html";
    throw new Error("Unauthorized");
  }

  return res;
}

const formatMoney = AppFormat.formatMoney;

function formatDate(value){
  if(!value) return "-";
  return String(value).split("T")[0];
}

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>\"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));
}

async function safeJson(res){
  try {
    return await res.json();
  } catch {
    try {
      const text = await res.text();
      return { error: text || "Request failed." };
    } catch {
      return { error: "Request failed." };
    }
  }
}

function getErrorMessage(data, fallback){
  if(data && typeof data.error === "string" && data.error.trim()) return data.error;
  if(data && typeof data.message === "string" && data.message.trim()) return data.message;
  return fallback;
}

function currentRole(){
  try {
    return String((JSON.parse(localStorage.getItem("user") || "{}").role) || "").toLowerCase();
  } catch {
    return "";
  }
}

function canDeleteInvoices(){
  return ["owner", "admin", "manager"].includes(currentRole());
}

function canRecordPayments(){
  return ["owner", "admin"].includes(currentRole());
}

function getLineAmount(item){
  const quantity = Number(item.quantity || 0);
  const price = Number(item.price || 0);
  const amount = Number(item.amount);

  if(Number.isFinite(amount) && amount > 0) return amount;
  return quantity * price;
}

function renderInvoiceEditorRows(lineItems){
  const safeItems = Array.isArray(lineItems) && lineItems.length
    ? lineItems
    : [{ description: "", quantity: 1, price: 0 }];

  document.getElementById("invoiceLineItems").innerHTML = safeItems.map((item, index) => `
    <div class="line-item-row">
      <input data-line="description" data-index="${index}" placeholder="Description" value="${escapeHtml(item.description || "")}">
      <input data-line="quantity" data-index="${index}" type="number" min="0" step="1" placeholder="Qty" value="${Number(item.quantity || 1)}">
      <input data-line="price" data-index="${index}" type="number" min="0" step="0.01" placeholder="Price" value="${Number(item.price || 0)}">
    </div>
  `).join("");
}

function openEditInvoice(){
  if(!currentInvoice) return;

  document.getElementById("edit_invoice_status").value = currentInvoice.status || "draft";
  document.getElementById("edit_invoice_due_date").value = formatDate(currentInvoice.due_date) === "-" ? "" : formatDate(currentInvoice.due_date);
  document.getElementById("edit_invoice_notes").value = currentInvoice.notes || "";

  renderInvoiceEditorRows(currentInvoice.line_items);

  document.getElementById("invoiceEditModal").style.display = "flex";
}

function closeEditInvoice(){
  document.getElementById("invoiceEditModal").style.display = "none";
}

function openDeleteInvoice(){
  if(!currentInvoice || !canDeleteInvoices()) return;
  document.getElementById("deleteInvoiceModal").style.display = "flex";
}

function closeDeleteInvoice(){
  document.getElementById("deleteInvoiceModal").style.display = "none";
}

function collectInvoiceLineItems(){
  return Array.from(document.querySelectorAll("#invoiceLineItems .line-item-row")).map(row => ({
    description: row.querySelector('[data-line="description"]').value.trim(),
    quantity: Number(row.querySelector('[data-line="quantity"]').value || 0),
    price: Number(row.querySelector('[data-line="price"]').value || 0)
  })).filter(item => item.description || item.quantity || item.price);
}

function renderLoadError(message){
  document.getElementById("invoiceNumber").textContent = "Invoice unavailable";
  document.getElementById("companyBlock").innerHTML = "";
  document.getElementById("clientBlock").innerHTML = `<div class="empty">Unable to load client details.</div>`;
  document.getElementById("invoiceBlock").innerHTML = `<div class="empty">${escapeHtml(message)}</div>`;
  document.getElementById("lineItems").innerHTML = `<tr><td colspan="4"><div class="empty">No invoice line items available.</div></td></tr>`;
  document.getElementById("paymentsList").innerHTML = `<div class="empty">No payment history available.</div>`;
  document.getElementById("invoiceTotal").textContent = formatMoney(0);
  document.getElementById("paidAmount").textContent = formatMoney(0);
  document.getElementById("remainingBalance").textContent = formatMoney(0);
  document.getElementById("paidBadge").innerHTML = "";
  document.getElementById("markPaidButton").style.display = "inline-flex";
  document.getElementById("recordPaymentButton").style.display = "none";
  document.getElementById("deleteInvoiceButton").style.display = "none";

  const notesBox = document.getElementById("notesBox");
  notesBox.style.display = "none";
  notesBox.innerHTML = "";
}

async function load(){
  AppUI.setLoading(true, "Loading invoice...");
  invoiceId = new URLSearchParams(window.location.search).get("id");

  if(!invoiceId){
    AppUI.setLoading(false);
    AppUI.showToast("Missing invoice ID.", "error");
    renderLoadError("Missing invoice ID. Open this page from an invoice record.");
    return;
  }

  try {
    const res = await apiFetch(API + "/workflow/invoices/" + encodeURIComponent(invoiceId));
    const data = await safeJson(res);

    if(!res.ok){
      const msg = getErrorMessage(data, "Unable to load invoice.");
      AppUI.showToast(msg, "error");
      renderLoadError(msg);
      return;
    }

    currentInvoice = data;

    document.getElementById("invoiceNumber").textContent =
      currentInvoice.invoice_number || ("Invoice #" + currentInvoice.id);

    document.getElementById("companyBlock").innerHTML =
      `<strong>${escapeHtml(currentInvoice.company_name || "Company")}</strong><br>` +
      `${escapeHtml(currentInvoice.company_phone || "")}<br>` +
      `${escapeHtml(currentInvoice.company_email || "")}<br>` +
      `${escapeHtml(currentInvoice.company_address || "")}`;

    document.getElementById("clientBlock").innerHTML =
      `<strong>${escapeHtml(currentInvoice.client_name || "Client")}</strong><br>` +
      `${escapeHtml(currentInvoice.client_phone || "")}<br>` +
      `${escapeHtml(currentInvoice.client_address || "")}<br>` +
      `${escapeHtml(currentInvoice.client_zip || "")}`;

    document.getElementById("invoiceBlock").innerHTML =
      `Status: ${escapeHtml(currentInvoice.status || "draft")}<br>` +
      `Issued: ${formatDate(currentInvoice.issued_date)}<br>` +
      `Due: ${formatDate(currentInvoice.due_date)}<br>` +
      `Job: ${escapeHtml(currentInvoice.job_service || "-")} ${currentInvoice.job_date ? "(" + formatDate(currentInvoice.job_date) + ")" : ""}`;

    document.getElementById("paidBadge").innerHTML =
      currentInvoice.status === "paid" ? `<span class="badge paid-badge">PAID</span>` : "";

    document.getElementById("markPaidButton").style.display =
      currentInvoice.status === "paid" ? "none" : "inline-flex";
    document.getElementById("recordPaymentButton").style.display =
      canRecordPayments() ? "inline-flex" : "none";

    document.getElementById("deleteInvoiceButton").style.display =
      canDeleteInvoices() ? "inline-flex" : "none";

    const items = Array.isArray(currentInvoice.line_items) && currentInvoice.line_items.length
      ? currentInvoice.line_items
      : [{
          description: currentInvoice.job_service || "Service",
          quantity: 1,
          price: Number(currentInvoice.amount || 0),
          amount: Number(currentInvoice.amount || 0)
        }];

    document.getElementById("lineItems").innerHTML = items.map(item => {
      const quantity = Number(item.quantity || 1);
      const price = Number(item.price || 0);
      const lineAmount = getLineAmount(item);

      return `<tr>
        <td>${escapeHtml(item.description || "Service")}</td>
        <td>${Number.isFinite(quantity) ? quantity : 1}</td>
        <td>${formatMoney(Number.isFinite(price) ? price : 0)}</td>
        <td>${formatMoney(Number.isFinite(lineAmount) ? lineAmount : 0)}</td>
      </tr>`;
    }).join("");

    const payments = Array.isArray(currentInvoice.payments) ? currentInvoice.payments : [];

    document.getElementById("paymentsList").innerHTML = payments.length
      ? payments.map(payment => `
          <div style="padding:12px 0; border-bottom:1px solid #e4ece7;">
            <strong>${formatMoney(payment.amount || 0)}</strong>
            <div style="margin-top:4px; color:#35574a;">${escapeHtml(payment.method || "cash")} • ${formatDate(payment.date)}</div>
            ${payment.notes ? `<div style="margin-top:4px; color:#6a8278;">${escapeHtml(payment.notes)}</div>` : ""}
          </div>
        `).join("")
      : AppUI.emptyState(
          "No payments recorded yet.",
          "Record a payment or mark this invoice as paid to update the remaining balance.",
          canRecordPayments() ? [{ label: "Record Payment", onClick: "recordPayment()", className: "btn blue" }] : []
        );

    document.getElementById("invoiceTotal").textContent = formatMoney(currentInvoice.amount || 0);
    document.getElementById("paidAmount").textContent = formatMoney(currentInvoice.paid_amount || 0);
    document.getElementById("remainingBalance").textContent = formatMoney(currentInvoice.remaining_balance || 0);

    const notesBox = document.getElementById("notesBox");

    if(currentInvoice.notes){
      notesBox.style.display = "block";
      notesBox.innerHTML = `<div class="label">Notes</div><div class="notes">${escapeHtml(currentInvoice.notes)}</div>`;
    } else {
      notesBox.style.display = "none";
      notesBox.innerHTML = "";
    }
  } catch(err){
    AppUI.showToast("Unable to load invoice.", "error");
    renderLoadError("Unable to load invoice. Please refresh and try again.");
  } finally {
    AppUI.setLoading(false);
  }
}

async function saveInvoiceEdit(button){
  if(!currentInvoice) return;

  const payload = {
    status: document.getElementById("edit_invoice_status").value,
    due_date: document.getElementById("edit_invoice_due_date").value || null,
    notes: document.getElementById("edit_invoice_notes").value.trim(),
    line_items: collectInvoiceLineItems()
  };

  if(!payload.line_items.length){
    AppUI.showToast("Add at least one line item.", "error");
    return;
  }

  await AppUI.withButton(button, async () => {
    const res = await apiFetch(API + "/workflow/invoices/" + encodeURIComponent(invoiceId), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await safeJson(res);

    if(!res.ok){
      AppUI.showToast(getErrorMessage(data, "Unable to save invoice."), "error");
      return;
    }

    closeEditInvoice();
    AppUI.showToast("Invoice updated.", "success");
    await load();
  }, { loading: "Saving..." });
}

async function recordPayment(button){
  if(!currentInvoice) return;

  const suggested = Number(currentInvoice.remaining_balance || 0).toFixed(2);
  const amount = prompt("Payment amount", suggested);

  if(amount === null) return;

  const numericAmount = Number(amount);

  if(!Number.isFinite(numericAmount) || numericAmount <= 0){
    AppUI.showToast("Enter a valid payment amount greater than 0.", "error");
    return;
  }

  const method = (prompt("Payment method: cash, zelle, or card", "cash") || "cash").trim().toLowerCase();
  const notes = prompt("Payment notes (optional):") || "";

  await AppUI.withButton(button, async () => {
    const res = await apiFetch(API + "/workflow/invoices/" + encodeURIComponent(invoiceId) + "/payments", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ amount: numericAmount, method, notes })
    });

    const data = await safeJson(res);

    if(!res.ok){
      AppUI.showToast(getErrorMessage(data, "Unable to record payment."), "error");
      return;
    }

    AppUI.showToast("Payment recorded successfully.", "success");
    await load();
  }, { loading: "Saving..." });
}

async function markAsPaid(button){
  if(!currentInvoice) return;

  await AppUI.withButton(button, async () => {
    const res = await apiFetch(API + "/workflow/invoices/" + encodeURIComponent(invoiceId) + "/status", {

      headers: { "Content-Type": "application/json" },

async function cancelInvoice(button){
  if(!currentInvoice || currentInvoice.status === "cancelled") return;

  await AppUI.withButton(button, async () => {
    const res = await apiFetch(API + "/workflow/invoices/" + encodeURIComponent(invoiceId) + "/status", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status: "cancelled" })
    });

    const data = await safeJson(res);

    if(!res.ok){
      AppUI.showToast(getErrorMessage(data, "Unable to cancel invoice."), "error");
      return;
    }

    AppUI.showToast("Invoice cancelled.", "success");
    await load();
  }, { loading: "Saving..." });
}

async function confirmDeleteInvoice(button){
  if(!currentInvoice) return;

  await AppUI.withButton(button, async () => {
    const res = await apiFetch(API + "/workflow/invoices/" + encodeURIComponent(invoiceId), {
      method: "DELETE"
    });

    const data = await safeJson(res);

    if(!res.ok){
      AppUI.showToast(getErrorMessage(data, "Unable to delete invoice."), "error");
      return;
    }

    closeDeleteInvoice();
    AppUI.showToast(data.message || "Invoice updated safely.", "success");
    window.setTimeout(() => {
      window.location.href = "/invoices.html";
    }, 600);
  }, { loading: "Deleting..." });
}

window.addEventListener("click", event => {
  if(event.target === document.getElementById("invoiceEditModal")){
    closeEditInvoice();
  }
  if(event.target === document.getElementById("deleteInvoiceModal")){
    closeDeleteInvoice();
  }
});

document.addEventListener("keydown", event => {
  if(event.key === "Escape"){
    closeEditInvoice();
    closeDeleteInvoice();
  }
});

load();
</script>
