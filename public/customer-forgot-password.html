<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoneGreen Customer Password Help</title>
  <link rel="stylesheet" href="/app-shell.css">
  <style>
    * { box-sizing: border-box; font-family: Inter, Arial, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(46, 125, 50, 0.32), transparent 35%),
        linear-gradient(135deg, #071b12, #0f2e1c 48%, #123f28);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #102016;
    }
    .auth-shell {
      width: min(460px, 100%);
      background: #f8fbf8;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 28px;
      padding: 34px;
      box-shadow: 0 30px 90px rgba(0,0,0,0.35);
    }
    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      color: #143c27;
      font-size: 24px;
      margin-bottom: 24px;
    }
    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      background: linear-gradient(135deg, #38b66b, #d7f7df);
      color: #0f2e1c;
      display: grid;
      place-items: center;
      font-size: 22px;
      box-shadow: 0 10px 30px rgba(56,182,107,0.22);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      letter-spacing: 0;
      color: #0f2418;
    }
    p {
      margin: 0 0 24px;
      color: #6a756d;
      font-size: 14px;
      line-height: 1.55;
    }
    .field { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
      color: #1f3528;
    }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #dbe5dd;
      background: white;
      outline: none;
      font-size: 15px;
      transition: 0.18s ease;
      color: #173327;
    }
    input:focus {
      border-color: #2c8b55;
      box-shadow: 0 0 0 4px rgba(44,139,85,0.12);
    }
    .btn {
      width: 100%;
      padding: 14px 18px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #1f5c3a, #2d8b55);
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.18s ease;
      box-shadow: 0 12px 28px rgba(31,92,58,0.22);
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 16px 34px rgba(31,92,58,0.28); }
    .btn:disabled { cursor: not-allowed; opacity: 0.65; transform: none; }
    .link {
      display: inline-flex;
      margin-top: 18px;
      color: #1f6f42;
      font-weight: 800;
      text-decoration: none;
      font-size: 14px;
    }
    .link:hover { text-decoration: underline; }
    .status {
      min-height: 22px;
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.45;
      color: #5f6e66;
    }
    .status.success { color: #027a48; font-weight: 700; }
    .status.error { color: #b42318; font-weight: 700; }
    @media (max-width: 520px) {
      body { padding: 14px; align-items: stretch; }
      .auth-shell { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <main class="auth-shell">
    <div class="brand-logo">
      <div class="brand-mark">LG</div>
      <span>LoneGreen</span>
    </div>

    <form id="forgotPasswordForm">
      <h1>Reset your password</h1>
      <p>Enter the email connected to your customer account. If the account exists, a reset link can be sent by the API.</p>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>

      <button id="submitBtn" class="btn" type="submit">Send Reset Link</button>
      <a class="link" href="/customer-login-v2.html">Back to login</a>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const API_BASE = (window.AppAPI && window.AppAPI.base) || window.location.origin;
    const form = document.getElementById("forgotPasswordForm");
    const statusBox = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");

    function setStatus(message, type) {
      statusBox.textContent = message || "";
      statusBox.className = "status" + (type ? " " + type : "");
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      submitBtn.disabled = true;
      setStatus("Requesting a reset link...", "");

      try {
        const res = await fetch(API_BASE + "/auth/customer-forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: document.getElementById("email").value.trim() })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || data.message || "Unable to request a reset link.");

        setStatus(data.message || "If that email exists, reset instructions will be sent.", "success");
      } catch (err) {
        setStatus(err.message || "Unable to request a reset link.", "error");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
