<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FairLinx Customer Password Help</title>
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/app-shell.css">
  
</head>
<body class="phase5-public fx-layout-public">
  <main class="auth-shell fx-min-w-0">
    <div class="brand-logo">
      <div class="brand-mark">FL</div>
      <span>FairLinx</span>
    </div>

    <form id="forgotPasswordForm">
      <h1>Reset your password</h1>
      <p>Enter the email connected to your customer account. If the account exists, a reset link can be sent by the API.</p>

      <div class="field fx-field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="Enter your email address" required>
      </div>

      <button id="submitBtn" class="btn fx-btn" type="submit">Send Reset Link</button>
      <a class="link" href="/customer-login-v2.html">Back to login</a>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const API_BASE = (window.AppAPI && window.AppAPI.base) || window.location.origin;
    const form = document.getElementById("forgotPasswordForm");
    const statusBox = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");

    function setStatus(message, type) {
      statusBox.textContent = message || "";
      statusBox.className = "status" + (type ? " " + type : "");
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      submitBtn.disabled = true;
      setStatus("Requesting a reset link...", "");

      try {
        const res = await fetch(API_BASE + "/auth/customer-forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: document.getElementById("email").value.trim() })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || data.message || "Unable to request a reset link.");

        setStatus(data.message || "If that email exists, reset instructions will be sent.", "success");
      } catch (err) {
        setStatus(err.message || "Unable to request a reset link.", "error");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
