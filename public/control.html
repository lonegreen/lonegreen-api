<!DOCTYPE html>
<html>

<head>
  <title>Control Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/app-shell.css">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --shell-bg: var(--surface-page, #f5f5f5);
      --shell-panel: var(--surface-card, #ffffff);
      --shell-text: var(--text-primary, #111111);
      --shell-muted: var(--text-muted, #646b73);
      --shell-border: var(--border-default, #d9d9d9);
      --shell-border-soft: var(--border-subtle, #ececec);
      --shell-orange: var(--interactive-primary, #FF5A00);
      --shell-orange-hover: var(--interactive-primary-hover, #E64A00);
      --shell-orange-soft: rgba(255, 90, 0, 0.12);
      --shell-orange-glow: rgba(255, 90, 0, 0.26);
      --shell-black: #111111;
      --shell-ink: #171717;
      --shell-shadow: var(--shadow-md, 0 18px 44px rgba(17, 17, 17, 0.10));
      --shell-shadow-soft: 0 10px 26px rgba(17, 17, 17, 0.07);
      --shell-radius: var(--radius-lg, 18px);
      --shell-radius-xl: 22px;
      --shell-nav-bg:
        radial-gradient(circle at 10% 0%, rgba(255, 90, 0, 0.24), transparent 26%),
        radial-gradient(circle at 95% 85%, rgba(255, 90, 0, 0.26), transparent 34%),
        linear-gradient(180deg, #050505 0%, #111111 50%, #1d1d1d 100%);
      --shell-nav-item: rgba(255, 255, 255, 0.055);
      --shell-nav-item-hover: rgba(255, 255, 255, 0.105);
      --shell-nav-item-active: linear-gradient(135deg, #FF5A00 0%, #FF7A1A 100%);
      --shell-transition: var(--motion-base, 180ms) var(--ease-standard, cubic-bezier(0.2, 0, 0, 1));
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: var(--font-sans, Inter, Arial, sans-serif);
      background:
        radial-gradient(circle at top right, rgba(255, 90, 0, 0.08), transparent 34%),
        linear-gradient(180deg, #ffffff 0%, var(--shell-bg) 100%);
      color: var(--shell-text);
      overflow: hidden;
    }

    body {
      display: flex;
    }

    .sidebar {
      width: 292px;
      height: 100vh;
      padding: 22px 16px 18px;
      overflow-y: auto;
      flex-shrink: 0;
      background: var(--shell-nav-bg);
      color: white;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.06), 18px 0 46px rgba(17, 17, 17, 0.10);
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 90, 0, 0.65) rgba(255, 255, 255, 0.06);
    }

    .sidebar::-webkit-scrollbar {
      width: 8px;
    }

    .sidebar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: rgba(255, 90, 0, 0.70);
      border-radius: 999px;
    }

    .brand {
      margin-bottom: 18px;
      padding: 8px 8px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      position: relative;
    }

    .brand::before {
      content: "FL";
      width: 52px;
      height: 52px;
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--shell-orange), #FF7A1A);
      color: #fff;
      font-size: 22px;
      font-weight: 950;
      letter-spacing: -0.08em;
      box-shadow: 0 16px 34px rgba(255, 90, 0, 0.34);
    }

    .brand h2 {
      margin: 0 0 7px;
      font-size: 28px;
      color: white !important;
      letter-spacing: -0.055em;
      line-height: 1;
    }

    .brand h2::first-letter {
      color: var(--shell-orange);
    }

    .brand small {
      color: rgba(255, 255, 255, 0.70);
      display: block;
      line-height: 1.45;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .section-title {
      font-size: 10px;
      opacity: 0.76;
      margin: 18px 10px 9px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: 900;
      color: #ffb389;
    }

    .sidebar button {
      width: 100%;
      margin-bottom: 7px;
      padding: 12px 13px;
      border-radius: 14px;
      border: 1px solid transparent;
      background: var(--shell-nav-item);
      color: rgba(255, 255, 255, 0.90);
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      font-weight: 800;
      box-shadow: none !important;
      transition:
        background var(--shell-transition),
        color var(--shell-transition),
        border-color var(--shell-transition),
        transform var(--shell-transition),
        box-shadow var(--shell-transition);
      position: relative;
      overflow: hidden;
    }

    .sidebar button::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 3px;
      border-radius: 999px;
      background: transparent;
      transition: background var(--shell-transition);
    }

    .sidebar button:hover {
      background: var(--shell-nav-item-hover);
      transform: translateX(2px) !important;
      border-color: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }

    .sidebar button:focus-visible,
    .topbar button:focus-visible,
    .notif-link:focus-visible {
      outline: 3px solid rgba(255, 90, 0, 0.35);
      outline-offset: 2px;
    }

    .sidebar button.active {
      background: var(--shell-nav-item-active) !important;
      border-color: rgba(255, 255, 255, 0.22) !important;
      color: #ffffff !important;
      font-weight: 950;
      box-shadow: 0 16px 28px rgba(255, 90, 0, 0.30) !important;
    }

    .sidebar button.active::before {
      background: #ffffff;
    }

    .main {
      flex: 1;
      min-width: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at top right, rgba(255, 90, 0, 0.09), transparent 30%),
        var(--shell-bg);
    }

    .topbar {
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.86);
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      border-bottom: 1px solid rgba(217, 217, 217, 0.78);
      z-index: 10;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 22px rgba(17, 17, 17, 0.035);
    }

    .topbar h3 {
      margin: 0;
      font-size: 28px;
      color: var(--shell-text);
      letter-spacing: -0.045em;
      line-height: 1.05;
    }

    .topbar small {
      color: var(--shell-muted);
      display: block;
      margin-top: 5px;
      font-size: 13px;
      font-weight: 650;
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .notif-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--shell-border);
      background: var(--shell-panel);
      color: var(--shell-text);
      border-radius: 999px;
      padding: 9px 13px;
      min-height: 42px;
      font-size: 12px;
      font-weight: 900;
      text-decoration: none;
      box-shadow: var(--shell-shadow-soft);
      transition: transform var(--shell-transition), box-shadow var(--shell-transition), border-color var(--shell-transition);
    }

    .notif-link:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 90, 0, 0.35);
      box-shadow: 0 16px 30px rgba(17, 17, 17, 0.09);
    }

    .notif-count {
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      background: var(--shell-orange);
      color: #fff;
      font-size: 11px;
      font-weight: 950;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      box-shadow: 0 8px 16px rgba(255, 90, 0, 0.28);
    }

    .topbar button {
      padding: 11px 15px;
      min-height: 42px;
      border-radius: 14px;
      border: 1px solid transparent;
      background: var(--shell-orange);
      color: white;
      font-weight: 900;
      cursor: pointer;
      transition: transform var(--shell-transition), box-shadow var(--shell-transition), background var(--shell-transition), border-color var(--shell-transition);
    }

    .topbar button:hover {
      background: var(--shell-orange-hover);
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(230, 74, 0, 0.24);
    }

    .shell-quick-action {
      background: linear-gradient(135deg, var(--shell-orange), #FF7A1A) !important;
      color: #fff !important;
      box-shadow: 0 12px 24px rgba(255, 90, 0, 0.22) !important;
    }

    .user-menu {
      position: relative;
    }

    .user-trigger {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--shell-panel) !important;
      color: var(--shell-text) !important;
      border: 1px solid var(--shell-border) !important;
      box-shadow: var(--shell-shadow-soft) !important;
    }

    .user-trigger:hover {
      background: #fff7f2 !important;
      border-color: rgba(255, 90, 0, 0.30) !important;
    }

    .user-avatar {
      width: 31px;
      height: 31px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(255, 90, 0, 0.18), rgba(255, 122, 26, 0.12));
      color: var(--shell-orange);
      font-size: 12px;
      font-weight: 950;
      border: 1px solid rgba(255, 90, 0, 0.18);
    }

    .dropdown {
      position: absolute;
      right: 0;
      top: calc(100% + 10px);
      min-width: 235px;
      background: white;
      border: 1px solid var(--shell-border);
      border-radius: 16px;
      box-shadow: var(--shell-shadow);
      padding: 8px;
      display: none;
      z-index: 50;
    }

    .dropdown.open {
      display: block;
      animation: dropdownIn 140ms ease-out;
    }

    @keyframes dropdownIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .dropdown button {
      width: 100%;
      background: transparent !important;
      color: var(--brand-black, #111111) !important;
      box-shadow: none !important;
      text-align: left;
      border-radius: 12px;
      border: none !important;
      padding: 10px 12px;
    }

    .dropdown button:hover {
      background: #fff2e9 !important;
      transform: none;
      color: var(--shell-orange-hover) !important;
    }

    .dropdown-divider {
      height: 1px;
      background: var(--shell-border-soft);
      margin: 6px 4px;
    }

    .content {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: transparent;
      position: relative;
      padding: 18px;
    }

    .frame-shell {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--shell-panel);
      border: 1px solid rgba(217, 217, 217, 0.92);
      border-radius: 24px;
      box-shadow: var(--shell-shadow);
      position: relative;
    }

    #frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: var(--shell-bg);
      opacity: 1 !important;
      visibility: visible !important;
      filter: none !important;
      pointer-events: auto !important;
    }

    .frame-loading {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(245, 245, 245, 0.72);
      backdrop-filter: blur(5px);
      z-index: 5;
      pointer-events: none;
    }

    .frame-loading.visible {
      display: flex;
      pointer-events: auto;
    }

    .frame-loading-card {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      padding: 13px 17px;
      background: white;
      border: 1px solid var(--shell-border);
      border-radius: 999px;
      box-shadow: var(--shell-shadow);
      color: var(--shell-text);
      font-size: 13px;
      font-weight: 900;
    }

    .spinner {
      width: 17px;
      height: 17px;
      border: 2px solid #dfdfdf;
      border-top-color: var(--shell-orange);
      border-radius: 999px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .page-loader,
    .page-loader.visible,
    #pageLoader {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    @media (max-width: 1100px) {
      .sidebar {
        width: 270px;
      }

      .topbar {
        padding: 16px;
      }

      .topbar h3 {
        font-size: 24px;
      }

      .actions {
        gap: 8px;
      }
    }

    @media (max-width: 900px) {

      html,
      body {
        height: auto;
        min-height: 100%;
        overflow: auto;
      }

      body {
        flex-direction: column;
        overflow: auto;
      }

      .sidebar {
        width: 100%;
        height: auto;
        max-height: 42vh;
        padding: 16px;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.10);
        box-shadow: 0 18px 42px rgba(17, 17, 17, 0.18);
      }

      .brand {
        margin-bottom: 12px;
        padding-bottom: 12px;
        display: grid;
        grid-template-columns: auto 1fr;
        column-gap: 12px;
        align-items: center;
      }

      .brand::before {
        margin-bottom: 0;
      }

      .brand h2 {
        font-size: 25px;
      }

      .brand small {
        grid-column: 2;
      }

      .section-title {
        margin-top: 14px;
      }

      .main {
        height: auto;
        min-height: 100vh;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        padding: 14px;
      }

      .actions {
        width: 100%;
        justify-content: flex-start;
      }

      .notif-link {
        flex: 1 1 100%;
        justify-content: center;
      }

      .topbar button {
        flex: 1 1 48%;
      }

      .user-menu {
        flex: 1 1 100%;
        width: 100%;
      }

      .user-trigger {
        width: 100%;
        justify-content: center;
      }

      .dropdown {
        left: 0;
        right: auto;
        width: 100%;
      }

      .content {
        height: 78vh;
        min-height: 78vh;
        padding: 10px;
      }

      .frame-shell {
        border-radius: 18px;
      }
    }

    @media (max-width: 560px) {
      .sidebar {
        max-height: 46vh;
      }

      .sidebar button {
        padding: 11px 12px;
        font-size: 13px;
      }

      .topbar h3 {
        font-size: 22px;
      }

      .topbar button {
        flex: 1 1 100%;
        width: 100%;
      }

      .content {
        padding: 8px;
      }
    }
  </style>
</head>

<body class="control-shell">
  <script>
    (function () {
      const token = localStorage.getItem("token");
      let user = null;

      try {
        user = JSON.parse(localStorage.getItem("user") || "null");
      } catch {
        user = null;
      }

      if (!token || !user) {
        window.top.location.href = "/login.html";
        return;
      }

      const role = String(user.role || "").toLowerCase();

      if (role === "worker") {
        localStorage.setItem("currentPage", "worker.html");
      } else if (role === "platform_owner") {
        localStorage.setItem("currentPage", "platform.html#overview");
      } else if (["owner", "admin", "manager"].includes(role)) {
        const savedPage = String(localStorage.getItem("currentPage") || "");
        if (!savedPage || savedPage === "worker.html" || savedPage.startsWith("platform.html")) {
          localStorage.setItem("currentPage", "dashboard.html");
        }
      }
    })();
  </script>
  <div class="sidebar">
    <div class="brand">
      <h2>FairLinx</h2>
      <small id="sidebarCompany">Professional field service control</small>
    </div>

    <div class="section-title" data-company-nav>Core</div>
    <button data-page="dashboard.html">Dashboard</button>
    <button data-page="jobs.html">Jobs</button>
    <button data-page="calendar.html">Calendar</button>
    <button data-page="clients.html">Clients</button>
    <button data-page="estimates.html?view=estimates">Estimates</button>
    <button data-page="invoices.html">Invoices</button>
    <button data-page="subscriptions.html">Subscriptions</button>
    <button data-page="workers.html">Workers</button>
    <button data-page="analytics.html">Analytics</button>

    <div class="section-title" data-company-nav>Marketplace</div>
    <button data-page="marketplace-dashboard.html">Marketplace Dashboard</button>
    <button data-page="marketplace-opportunities.html">Opportunities</button>
    <button data-page="marketplace-offers.html">Offers</button>
    <button data-page="messages.html">Messages</button>
    <button data-page="company-public-profile.html">Public Profile</button>
    <button data-page="company-services.html">Services</button>
    <button data-page="company-service-areas.html">Service Areas</button>

    <div class="section-title" data-company-nav>Admin</div>
    <button data-page="users.html">Users</button>
    <button data-page="billing-plans.html">Billing</button>
    <button data-page="settings.html">Settings</button>
    <button data-page="support.html" data-support-nav>Support</button>

    <div class="section-title" data-worker-nav>Worker</div>
    <button data-page="worker.html" data-worker-nav>Worker App</button>

    <div class="section-title" data-platform-nav>Platform</div>
    <button data-page="platform.html#overview" data-platform-nav>Overview</button>
    <button data-page="platform.html#companies" data-platform-nav>Companies</button>
    <button data-page="platform.html#billing" data-platform-nav>Plans & Billing</button>
    <button data-page="platform.html#users" data-platform-nav>Platform Users</button>
    <button data-page="platform.html#health" data-platform-nav>System Health</button>
    <button data-page="platform.html#activity" data-platform-nav>Activity Logs</button>
    <button data-page="platform.html#settings" data-platform-nav>Settings</button>
    <button data-page="support.html" data-platform-nav data-support-nav>Support</button>
  </div>

  <div class="main">
    <div class="topbar">
      <div>
        <h3 id="welcome">Welcome</h3>
        <small id="subwelcome">Control Panel</small>
      </div>

      <div class="actions">
        <a href="#" class="notif-link" id="notifBellLink" title="Notifications">
          <span>🔔</span><span id="notifCount" class="notif-count">0</span>
        </a>
        <button class="fx-btn fx-btn--primary shell-quick-action" data-page="clients.html">+ New Client</button>
        <button class="fx-btn fx-btn--primary shell-quick-action" data-page="estimates.html?view=leads">+ New Lead</button>

        <div class="user-menu">
          <button type="button" class="fx-btn fx-btn--secondary user-trigger" id="userMenuButton">
            <span class="user-avatar" id="userAvatar">LG</span>
            <span id="userMenuLabel">Account</span>
            <span>▼</span>
          </button>

          <div id="userDropdown" class="dropdown">
            <button type="button" data-user-action="settings">Settings</button>
            <div class="dropdown-divider"></div>
            <button type="button" data-user-action="logout">Logout</button>
          </div>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="frame-shell">
        <div id="frameLoading" class="frame-loading">
          <div class="frame-loading-card">
            <span class="spinner"></span>
            <span>Loading page...</span>
          </div>
        </div>

        <iframe id="frame" src="/dashboard.html"></iframe>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin;
    let frameLoadingTimer = null;

    const allowedPages = [
      "dashboard.html",
      "marketplace-dashboard.html",
      "marketplace-opportunities.html",
      "marketplace-offers.html",
      "messages.html",
      "company-public-profile.html",
      "company-services.html",
      "company-service-areas.html",
      "clients.html",
      "client.html",
      "jobs.html",
      "estimates.html",
      "estimates.html?view=leads",
      "estimates.html?view=estimates",
      "subscriptions.html",
      "calendar.html",
      "zip-manager.html",
      "workers.html",
      "invoices.html",
      "invoice.html",
      "worker.html",
      "settings.html",
      "analytics.html",
      "users.html",
      "billing-plans.html",
      "platform.html",
      "platform.html#overview",
      "platform.html#companies",
      "platform.html#billing",
      "platform.html#users",
      "platform.html#health",
      "platform.html#activity",
      "platform.html#settings",
      "support.html"
    ];

    const WORKER_ALLOWED_PAGE = "worker.html";

    const workerBlockedPages = [
      "dashboard.html",
      "marketplace-dashboard.html",
      "marketplace-opportunities.html",
      "marketplace-offers.html",
      "messages.html",
      "company-public-profile.html",
      "company-services.html",
      "company-service-areas.html",
      "clients.html",
      "client.html",
      "estimates.html",
      "estimates.html?view=leads",
      "estimates.html?view=estimates",
      "jobs.html",
      "calendar.html",
      "subscriptions.html",
      "workers.html",
      "zip-manager.html",
      "invoices.html",
      "invoice.html",
      "settings.html",
      "users.html",
      "billing-plans.html",
      "analytics.html",
      "platform.html",
      "platform.html#overview",
      "platform.html#companies",
      "platform.html#billing",
      "platform.html#users",
      "platform.html#health",
      "platform.html#activity",
      "platform.html#settings",
      "support.html"
    ];

    function getUser() {
      try {
        return JSON.parse(localStorage.getItem("user") || "null");
      } catch {
        return null;
      }
    }

    function setUser(user) {
      localStorage.setItem("user", JSON.stringify(user || {}));
    }

    function getToken() {
      return localStorage.getItem("token");
    }

    function currentRole() {
      const user = getUser();
      return String((user && user.role) || "").toLowerCase();
    }

    function isWorkerUser() {
      return currentRole() === "worker";
    }

    function isPlatformOwnerUser() {
      return currentRole() === "platform_owner";
    }

    function isWorkerBlockedPage(page) {
      const cleanPage = String(page || "").replace(/^\/+/, "");
      const basePage = cleanPage.split(/[?#]/)[0];
      return workerBlockedPages.includes(cleanPage) || workerBlockedPages.includes(basePage);
    }

    function isAllowedPage(page) {
      const cleanPage = String(page || "").replace(/^\/+/, "");
      const basePage = cleanPage.split(/[?#]/)[0];
      return allowedPages.includes(cleanPage) || allowedPages.includes(basePage);
    }

    function safePage(page) {
      const cleanPage = String(page || "").replace(/^\/+/, "");

      if (isPlatformOwnerUser()) {
        if (cleanPage === "support.html") return "support.html";
        return cleanPage.startsWith("platform.html") ? cleanPage : "platform.html#overview";
      }

      if (isWorkerUser()) {
        return WORKER_ALLOWED_PAGE;
      }

      if (cleanPage === WORKER_ALLOWED_PAGE || cleanPage.startsWith("platform.html")) {
        return "dashboard.html";
      }

      return isAllowedPage(cleanPage) ? cleanPage : "dashboard.html";
    }

    function applyWorkerRoleProtection() {
      const platformOwner = isPlatformOwnerUser();
      const worker = isWorkerUser();

      document.querySelectorAll("[data-company-nav]").forEach((item) => {
        item.style.display = platformOwner || worker ? "none" : "";
      });

      document.querySelectorAll("[data-worker-nav]").forEach((item) => {
        item.style.display = worker ? "" : "none";
        if (item.tagName === "BUTTON") item.disabled = !worker;
      });

      document.querySelectorAll("[data-legal-nav]").forEach((item) => {
        item.style.display = "none";
        if (item.tagName === "BUTTON") item.disabled = true;
      });

      document.querySelectorAll("[data-platform-nav]").forEach((item) => {
        item.style.display = platformOwner ? "" : "none";
        if (item.tagName === "BUTTON") item.disabled = !platformOwner;
      });

      document.querySelectorAll(".actions > button[data-page]").forEach((button) => {
        button.style.display = platformOwner || worker ? "none" : "";
        button.disabled = platformOwner || worker;
      });

      document.querySelectorAll("[data-user-action='settings']").forEach((button) => {
        button.style.display = platformOwner || worker ? "none" : "";
        button.disabled = platformOwner || worker;
      });

      if (platformOwner) {
        document.querySelectorAll("button[data-page]").forEach((button) => {
          const page = String(button.getAttribute("data-page") || "");
          const isPlatformButton = button.hasAttribute("data-platform-nav") && (page.startsWith("platform.html") || page === "support.html");
          button.style.display = isPlatformButton ? "" : "none";
          button.disabled = !isPlatformButton;
        });
        document.querySelectorAll("[data-support-nav]").forEach((item) => {
          const isPlatformSupport = item.hasAttribute("data-platform-nav");
          item.style.display = isPlatformSupport ? "" : "none";
          if (item.tagName === "BUTTON") item.disabled = !isPlatformSupport;
        });
        const currentPlatformPage = localStorage.getItem("currentPage") || "";
        if (!currentPlatformPage.startsWith("platform.html") && currentPlatformPage !== "support.html") {
          localStorage.setItem("currentPage", "platform.html#overview");
        }
        return;
      }

      if (!worker) {
        document.querySelectorAll("button[data-page='worker.html']").forEach((button) => {
          button.style.display = "none";
          button.disabled = true;
        });
        return;
      }

      document.querySelectorAll("button[data-page]").forEach((button) => {
        const page = button.getAttribute("data-page");

        if (isWorkerBlockedPage(page)) {
          button.style.display = "none";
          button.disabled = true;
        }

        if (page === WORKER_ALLOWED_PAGE) {
          button.style.display = "";
          button.disabled = false;
        }
      });

      const savedPage = localStorage.getItem("currentPage");

      if (!savedPage || isWorkerBlockedPage(savedPage)) {
        localStorage.setItem("currentPage", WORKER_ALLOWED_PAGE);
      }
    }

    function clearLoginStorage() {
      localStorage.removeItem("token");
      localStorage.removeItem("customerToken");
      localStorage.removeItem("user");
      localStorage.removeItem("currentPage");
      localStorage.removeItem("redirectAfterLogin");
    }

    function redirectToLogin() {
      clearLoginStorage();
      window.location.href = "/login.html";
    }

    function logout() {
      clearLoginStorage();
      window.location.href = "/";
    }

    function requireSession() {
      const user = getUser();
      const token = getToken();

      if (!token || !user || (!user.company_id && currentRole() !== "platform_owner")) {
        const missingCompanyIdForNonPlatformOwner = Boolean(
          user && !user.company_id && currentRole() !== "platform_owner"
        );
        console.warn("AUTH_SESSION_INVALID", {
          hasToken: Boolean(token),
          hasUser: Boolean(user),
          role: user && user.role ? user.role : null,
          missingCompanyIdForNonPlatformOwner
        });
        redirectToLogin();
        return false;
      }

      return true;
    }

    function setWelcome() {
      const user = getUser();

      document.getElementById("welcome").textContent =
        user && user.username ? "Welcome, " + user.username : "Welcome";

      document.getElementById("userMenuLabel").textContent =
        user && user.username ? user.username : "Account";

      document.getElementById("userAvatar").textContent =
        user && user.username ? user.username.slice(0, 2).toUpperCase() : "LG";

      if (user && user.role) {
        document.getElementById("subwelcome").textContent =
          user.role.charAt(0).toUpperCase() + user.role.slice(1) + " account";
      } else if (user && user.company_id) {
        document.getElementById("subwelcome").textContent =
          "Company ID: " + user.company_id;
      } else {
        document.getElementById("subwelcome").textContent = "Control Panel";
      }
    }

    function setActiveButton(page) {
      const cleanPage = String(page || "").replace(/^\/+/, "");
      const basePage = cleanPage.split(/[?#]/)[0];

      document.querySelectorAll("button[data-page]").forEach((button) => {
        const buttonPage = String(button.getAttribute("data-page") || "");
        const buttonBase = buttonPage.split(/[?#]/)[0];
        const exactMatch = buttonPage === cleanPage;
        const baseMatch = buttonBase === basePage && !buttonPage.includes("?") && !buttonPage.includes("#");

        button.classList.toggle("active", exactMatch || baseMatch);
      });
    }

    function showFrameLoading() {
      const loader = document.getElementById("frameLoading");
      if (loader) loader.classList.add("visible");
      clearTimeout(frameLoadingTimer);
      frameLoadingTimer = setTimeout(hideFrameLoading, 2000);
    }

    function hideFrameLoading() {
      const loader = document.getElementById("frameLoading");
      if (loader) loader.classList.remove("visible");
      clearTimeout(frameLoadingTimer);
      frameLoadingTimer = null;
    }

    function loadPage(page) {
      const finalPage = safePage(page);
      const frame = document.getElementById("frame");
      const nextSrc = "/" + finalPage;

      localStorage.setItem("currentPage", finalPage);
      setActiveButton(finalPage);

      if (frame && frame.getAttribute("src") !== nextSrc) {
        showFrameLoading();
        frame.setAttribute("src", nextSrc);
      } else {
        hideFrameLoading();
      }
    }

    function initFrameMessages() {
      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin) return;

        const data = event.data || {};
        if (!data || data.type !== "openPage") return;

        let page = String(data.page || "").replace(/^\/+/, "");

        if (page === "clients.html" && data.clientId) {
          page = "client.html?id=" + encodeURIComponent(data.clientId);
        } else if (page === "invoices.html" && data.jobId) {
          page = "invoices.html?job_id=" + encodeURIComponent(data.jobId);
        }

        loadPage(page);
      });
    }

    async function authFetch(url) {
      const token = getToken();

      if (!token) {
        redirectToLogin();
        throw new Error("Unauthorized");
      }

      const res = await fetch(url, {
        headers: {
          Authorization: "Bearer " + getToken()
        }
      });

      if (res.status === 401) {
        redirectToLogin();
        throw new Error("Unauthorized");
      }

      return res;
    }

    async function refreshSessionSummary() {
      try {
        const [meRes, companyRes] = await Promise.allSettled([
          authFetch(API + "/me"),
          authFetch(API + "/company")
        ]);

        if (meRes.status === "fulfilled" && meRes.value.ok) {
          const me = await meRes.value.json();
          setUser({ ...getUser(), ...me });
          setWelcome();
          applyWorkerRoleProtection();

          if (isWorkerUser()) {
            loadPage(WORKER_ALLOWED_PAGE);
          }
        }

        if (companyRes.status === "fulfilled" && companyRes.value.ok) {
          const company = await companyRes.value.json();
          document.getElementById("sidebarCompany").textContent =
            company.name || "Professional field service control";
        }
      } catch (err) {
        console.log("SESSION SUMMARY ERROR:", err);
      }
    }

    async function refreshNotificationBell() {
      const role = currentRole();
      if (role === "worker" || role === "platform_owner") {
        document.getElementById("notifBellLink").style.display = "none";
        return;
      }
      try {
        const res = await authFetch(API + "/notifications/unread-count");
        if (!res.ok) {
          return;
        }
        const data = await res.json();
        const count = Number(data && data.unread_count) || 0;
        document.getElementById("notifCount").textContent = String(count);
      } catch (_) {}
    }

    function initNavigation() {
      document.querySelectorAll("button[data-page]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.preventDefault();
          loadPage(button.getAttribute("data-page"));
        });
      });

      document.querySelectorAll("button[data-legal-page]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.preventDefault();
          window.open(button.getAttribute("data-legal-page"), "_blank", "noopener");
        });
      });
      const notifBellLink = document.getElementById("notifBellLink");
      if (notifBellLink) {
        notifBellLink.addEventListener("click", (event) => {
          event.preventDefault();
          loadPage("dashboard.html");
        });
      }
    }

    function initUserMenu() {
      const button = document.getElementById("userMenuButton");
      const dropdown = document.getElementById("userDropdown");

      button.addEventListener("click", (event) => {
        event.stopPropagation();
        dropdown.classList.toggle("open");
      });

      document.querySelectorAll("[data-user-action]").forEach((item) => {
        item.addEventListener("click", () => {
          const action = item.getAttribute("data-user-action");
          dropdown.classList.remove("open");

          if (action === "settings") {
            loadPage("settings.html");
          }

          if (action === "logout") {
            logout();
          }
        });
      });

      document.addEventListener("click", (event) => {
        if (!document.querySelector(".user-menu").contains(event.target)) {
          dropdown.classList.remove("open");
        }
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (!requireSession()) return;

      initNavigation();
      initFrameMessages();
      initUserMenu();
      setWelcome();
      applyWorkerRoleProtection();

      const frame = document.getElementById("frame");

      if (frame) {
        frame.addEventListener("load", hideFrameLoading);
      }

      const defaultPage = isPlatformOwnerUser() ? "platform.html#overview" : (isWorkerUser() ? WORKER_ALLOWED_PAGE : "dashboard.html");
      const savedPage = safePage(localStorage.getItem("currentPage") || defaultPage);

      localStorage.setItem("currentPage", savedPage);
      showFrameLoading();
      document.getElementById("frame").setAttribute("src", "/" + savedPage);
      setActiveButton(savedPage);

      refreshSessionSummary();
      refreshNotificationBell();
      setInterval(refreshNotificationBell, 60000);
    });

    window.loadPage = loadPage;
    window.logout = logout;
  </script>
  <script src="/js/legal-consent.js"></script>
</body>
