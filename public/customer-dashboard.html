<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Portal</title>
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/app-shell.css">
  <style>
    :root {
      --fl-orange: #FF5A00;
      --fl-orange-hover: #E64A00;
      --fl-orange-soft: #FF8A33;
      --fl-black: #111111;
      --fl-gray: #2B2B2B;
      --fl-border: #D9D9D9;
      --fl-bg: #F5F5F5;
      --fl-white: #FFFFFF;
      --fl-success: #16A34A;
      --fl-warning: #F59E0B;
      --fl-error: #DC2626;
      --fl-shadow: 0 18px 46px rgba(17, 17, 17, 0.08);
      --fl-shadow-soft: 0 10px 26px rgba(17, 17, 17, 0.06);
      --fl-radius-xl: 24px;
      --fl-radius-lg: 18px;
      --fl-radius-md: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--fl-bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at 10% 0%, rgba(255, 90, 0, 0.11), transparent 34%),
        radial-gradient(circle at 92% 4%, rgba(255, 122, 26, 0.08), transparent 32%),
        linear-gradient(180deg, #ffffff 0%, #fafafa 260px, #f3f3f3 100%);
      color: var(--fl-black);
      padding: 24px;
    }

    a {
      color: inherit;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .page {
      max-width: 1240px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
      animation: pageIn 0.25s ease-out;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero {
      position: relative;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-end;
      flex-wrap: wrap;
      padding: 28px;
      border: 1px solid rgba(217, 217, 217, 0.9);
      border-radius: var(--fl-radius-xl);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.96), rgba(255,255,255,0.84)),
        radial-gradient(circle at 100% 0%, rgba(255, 90, 0, 0.14), transparent 34%);
      box-shadow: var(--fl-shadow-soft);
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 7px;
      background: linear-gradient(180deg, var(--fl-orange), var(--fl-orange-soft));
    }

    .hero::after {
      content: "FL";
      position: absolute;
      right: 28px;
      top: -24px;
      font-size: 110px;
      font-weight: 950;
      letter-spacing: -0.09em;
      color: rgba(255, 90, 0, 0.055);
      pointer-events: none;
    }

    .hero > div {
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--fl-orange);
      font-size: clamp(36px, 5vw, 56px);
      line-height: 0.95;
      letter-spacing: -0.06em;
      font-weight: 950;
    }

    p {
      margin: 0;
      color: #5f6368;
      line-height: 1.5;
    }

    #welcome {
      font-size: 16px;
      color: #60646c;
    }

    .customer-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .customer-nav a,
    .marketplace-hub a,
    .tab {
      border: 1px solid rgba(217, 217, 217, 0.95);
      background: #fff;
      color: var(--fl-gray);
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 900;
      text-decoration: none;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
    }

    .customer-nav a:hover,
    .marketplace-hub a:hover,
    .tab:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 90, 0, 0.55);
      color: var(--fl-orange);
      box-shadow: 0 10px 20px rgba(255, 90, 0, 0.08);
    }

    .marketplace-hub {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .marketplace-hub a {
      min-height: 88px;
      border-radius: 18px;
      padding: 18px 14px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(180deg, #fff, #fbfbfb);
      box-shadow: var(--fl-shadow-soft);
      color: var(--fl-black);
      position: relative;
      overflow: hidden;
    }

    .marketplace-hub a::before {
      content: "";
      position: absolute;
      inset: auto 18px 0 18px;
      height: 3px;
      border-radius: 999px 999px 0 0;
      background: linear-gradient(90deg, var(--fl-orange), var(--fl-orange-soft));
      opacity: 0.85;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px;
      border: 1px solid rgba(217, 217, 217, 0.75);
      background: rgba(255, 255, 255, 0.74);
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(17, 17, 17, 0.04);
    }

    .tab {
      cursor: pointer;
      min-height: 40px;
    }

    .tab.active {
      background: linear-gradient(135deg, var(--fl-orange), var(--fl-orange-hover));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 12px 22px rgba(255, 90, 0, 0.24);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .panel,
    .card {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(217, 217, 217, 0.92);
      border-radius: var(--fl-radius-lg);
      box-shadow: var(--fl-shadow);
      padding: 18px;
    }

    .panel {
      overflow: hidden;
    }

    #companyBox {
      line-height: 1.65;
      color: #5f6368;
      position: relative;
      padding-left: 22px;
    }

    #companyBox::before {
      content: "";
      position: absolute;
      left: 0;
      top: 18px;
      bottom: 18px;
      width: 4px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--fl-orange), var(--fl-orange-soft));
    }

    #companyBox strong {
      color: var(--fl-black);
      font-size: 17px;
      letter-spacing: -0.02em;
    }

    .card {
      display: grid;
      gap: 9px;
      min-width: 0;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .card:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 90, 0, 0.28);
      box-shadow: 0 20px 48px rgba(17, 17, 17, 0.10);
    }

    .card-title {
      font-size: 18px;
      font-weight: 950;
      color: var(--fl-black);
      letter-spacing: -0.025em;
      word-break: break-word;
    }

    .muted {
      color: #60646c;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.045em;
      background: rgba(255, 90, 0, 0.08);
      color: var(--fl-orange-hover);
      border: 1px solid rgba(255, 90, 0, 0.18);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .btn {
      border: 0;
      border-radius: 13px;
      padding: 10px 13px;
      font-weight: 950;
      cursor: pointer;
      background: linear-gradient(135deg, var(--fl-orange), var(--fl-orange-hover));
      color: white;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, border-color 0.18s ease;
      box-shadow: 0 12px 22px rgba(255, 90, 0, 0.20);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 28px rgba(255, 90, 0, 0.28);
    }

    .btn.gray {
      background: #fff;
      color: var(--fl-orange);
      border: 1px solid rgba(255, 90, 0, 0.38);
      box-shadow: none;
    }

    .btn.gray:hover {
      background: rgba(255, 90, 0, 0.055);
      border-color: var(--fl-orange);
    }

    .btn.danger {
      background: linear-gradient(135deg, #dc2626, #b42318);
      box-shadow: 0 12px 22px rgba(220, 38, 38, 0.18);
    }

    .btn.sm {
      padding: 8px 10px;
      font-size: 13px;
      min-height: 36px;
      border-radius: 11px;
    }

    .btn:focus-visible,
    .tab:focus-visible,
    .customer-nav a:focus-visible,
    .marketplace-hub a:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(255, 90, 0, 0.22);
      outline-offset: 2px;
    }

    .section {
      display: none;
    }

    .section.active {
      display: grid;
      gap: 12px;
    }

    .form-grid {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      font-weight: 900;
      color: var(--fl-black);
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--fl-border);
      border-radius: 13px;
      padding: 12px 13px;
      color: var(--fl-black);
      background: #fff;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    input:focus,
    textarea:focus {
      border-color: var(--fl-orange);
      box-shadow: 0 0 0 4px rgba(255, 90, 0, 0.12);
      background: #fffdfb;
    }

    textarea {
      min-height: 108px;
      resize: vertical;
    }

    .hidden {
      display: none !important;
    }

    .empty-panel {
      padding: 34px 24px;
      text-align: center;
      color: #60646c;
      font-size: 15px;
      line-height: 1.5;
      border-style: dashed;
      background:
        radial-gradient(circle at center top, rgba(255, 90, 0, 0.08), transparent 42%),
        #fff;
    }

    .empty-panel strong {
      display: block;
      color: var(--fl-black);
      margin-bottom: 8px;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .empty-panel strong::before {
      content: "•";
      display: block;
      color: var(--fl-orange);
      font-size: 38px;
      line-height: 0.7;
      margin-bottom: 8px;
    }

    .inv-table-wrap {
      overflow-x: auto;
      border-radius: 18px;
      border: 1px solid rgba(217, 217, 217, 0.95);
      background: white;
      box-shadow: var(--fl-shadow);
    }

    .inv-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 820px;
      font-size: 14px;
    }

    .inv-table th,
    .inv-table td {
      text-align: left;
      padding: 15px 16px;
      border-bottom: 1px solid #eeeeee;
      vertical-align: middle;
    }

    .inv-table th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #4b4f56;
      background: linear-gradient(180deg, #fbfbfb, #f6f6f6);
      font-weight: 950;
    }

    .inv-table tr:last-child td {
      border-bottom: 0;
    }

    .inv-table tbody tr {
      transition: background 0.16s ease;
    }

    .inv-table tbody tr:hover {
      background: rgba(255, 90, 0, 0.035);
    }

    .inv-actions-cell {
      white-space: nowrap;
    }

    .inv-num {
      font-weight: 950;
      color: var(--fl-black);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border: 1px solid transparent;
    }

    .badge-paid {
      background: #ecfdf3;
      color: #027a48;
      border-color: rgba(22, 163, 74, 0.18);
    }

    .badge-unpaid {
      background: #fff7ed;
      color: #c2410c;
      border-color: rgba(255, 90, 0, 0.18);
    }

    .badge-overdue {
      background: #fef2f2;
      color: #b42318;
      border-color: rgba(220, 38, 38, 0.18);
    }

    .badge-draft {
      background: #f4f4f5;
      color: #4b5563;
      border-color: rgba(75, 85, 99, 0.14);
    }

    .badge-cancelled {
      background: #f1f5f3;
      color: #6b7280;
      border-color: rgba(107, 114, 128, 0.16);
    }

    .badge-partially_paid {
      background: #fff7df;
      color: #9a5b05;
      border-color: rgba(245, 158, 11, 0.22);
    }

    .invoice-detail-wrap {
      display: grid;
      gap: 12px;
      margin-top: 4px;
    }

    .invoice-detail-toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
    }

    .invoice-detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .customer-invoice-sheet {
      padding: 26px 24px 30px;
      max-width: 940px;
      margin: 0 auto;
      width: 100%;
    }

    .cis-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 240px);
      gap: 22px;
      align-items: start;
      margin-bottom: 20px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--fl-border);
    }

    .cis-brand {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      min-width: 0;
    }

    .cis-logo {
      width: 92px;
      height: 66px;
      object-fit: contain;
      border: 1px solid var(--fl-border);
      border-radius: 10px;
      padding: 6px;
      background: #fff;
      flex-shrink: 0;
    }

    .cis-company {
      font-size: 24px;
      font-weight: 950;
      color: var(--fl-black);
      margin: 0 0 6px;
      line-height: 1.2;
      word-break: break-word;
      letter-spacing: -0.03em;
    }

    .cis-lines {
      color: #60646c;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }

    .cis-meta {
      text-align: right;
      justify-self: end;
      min-width: 200px;
    }

    .cis-meta-row {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .cis-meta-row span {
      color: #60646c;
      font-weight: 900;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    .cis-meta-row strong {
      color: var(--fl-black);
    }

    .cis-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .cis-box {
      border: 1px solid var(--fl-border);
      border-radius: 14px;
      padding: 15px 16px;
      background: #fbfbfb;
    }

    .cis-box .lbl {
      font-size: 11px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--fl-orange);
      margin-bottom: 8px;
    }

    .cis-table-wrap {
      overflow-x: auto;
      border: 1px solid #e4e4e7;
      border-radius: 14px;
      margin-bottom: 18px;
      background: white;
    }

    .cis-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 560px;
      font-size: 14px;
    }

    .cis-table th,
    .cis-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #f0f0f0;
      text-align: left;
    }

    .cis-table th {
      font-size: 11px;
      text-transform: uppercase;
      color: #60646c;
      background: #fafafa;
      letter-spacing: 0.06em;
    }

    .cis-table td.amount {
      text-align: right;
      white-space: nowrap;
    }

    .cis-totals {
      max-width: 360px;
      margin-left: auto;
      display: grid;
      gap: 8px;
      margin-bottom: 18px;
    }

    .cis-total-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: 14px;
    }

    .cis-total-row.grand {
      font-size: 19px;
      font-weight: 950;
      color: var(--fl-black);
      padding-top: 10px;
      border-top: 2px solid var(--fl-border);
      margin-top: 4px;
    }

    .cis-payhist {
      border: 1px solid var(--fl-border);
      border-radius: 14px;
      padding: 15px 16px;
      background: #fff;
      margin-bottom: 14px;
    }

    .cis-payhist h4 {
      margin: 0 0 10px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--fl-orange);
    }

    .cis-pay-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
    }

    .cis-pay-row:last-child {
      border-bottom: 0;
    }

    .cis-instructions {
      border: 1px dashed rgba(255, 90, 0, 0.35);
      border-radius: 14px;
      padding: 15px 16px;
      background: #fff8f3;
      margin-bottom: 12px;
      font-size: 14px;
      line-height: 1.6;
      color: #3f3f46;
      word-break: break-word;
    }

    .cis-footer {
      font-size: 13px;
      color: #60646c;
      line-height: 1.5;
      word-break: break-word;
      padding-top: 10px;
      border-top: 1px solid #eeeeee;
      margin-top: 8px;
    }

    @media (max-width: 960px) {
      body {
        padding: 16px;
      }

      .marketplace-hub {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .tabs {
        border-radius: 18px;
      }
    }

    @media (max-width: 720px) {
      .cis-head {
        grid-template-columns: 1fr;
      }

      .cis-meta {
        text-align: left;
        justify-self: start;
      }

      .cis-meta-row {
        justify-content: space-between;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }

      .hero {
        padding: 24px 18px;
        border-radius: 20px;
      }

      .hero::after {
        font-size: 74px;
        right: 16px;
        top: -12px;
      }

      .customer-nav,
      .tabs {
        gap: 7px;
      }

      .customer-nav a,
      .tab {
        flex: 1 1 auto;
        justify-content: center;
        text-align: center;
      }

      .marketplace-hub,
      .grid,
      .cis-grid {
        grid-template-columns: 1fr;
      }

      .marketplace-hub a {
        min-height: 68px;
      }

      .panel,
      .card {
        padding: 16px;
        border-radius: 16px;
      }

      .customer-invoice-sheet {
        padding: 18px;
      }

      .invoice-detail-toolbar,
      .invoice-detail-actions,
      .actions {
        width: 100%;
      }

      .invoice-detail-actions .btn,
      .actions .btn {
        flex: 1 1 auto;
      }
    }

    @media print {
      body {
        background: white !important;
        padding: 0 !important;
      }

      .no-print {
        display: none !important;
      }

      .invoice-detail-wrap {
        display: block !important;
      }

      .invoice-detail-toolbar {
        display: none !important;
      }

      .page {
        max-width: none;
        padding: 12px;
      }

      .customer-invoice-sheet {
        box-shadow: none !important;
        border: none !important;
        border-radius: 0 !important;
        padding: 16px !important;
      }

      .inv-table-wrap {
        border: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
<div class="page fx-layout-public">
  <div class="hero no-print fx-hero fx-section-head">
    <div>
      <h1>Customer Portal</h1>
      <p id="welcome">Loading...</p>
      <nav class="customer-nav" aria-label="Customer navigation">
        <a href="/customer-dashboard.html">Dashboard</a>
        <a href="/marketplace.html">Marketplace</a>
        <a href="/discover.html">Discover</a>
        <a href="/messages.html">Messages</a>
        <a href="/customer-profile.html">Profile</a>
        <a href="#" data-customer-action="logout">Logout</a>
      </nav>
    </div>
  </div>
  <div class="panel no-print fx-card" id="companyBox">Loading company contact...</div>
  <div class="marketplace-hub no-print" aria-label="Marketplace actions">
    <a href="/discover.html">Find Services</a>
    <a href="/marketplace.html?action=create">Request Service</a>
    <a href="/marketplace.html">My Requests</a>
    <a href="#" data-customer-tab-link="offers">Offers</a>
    <a href="/messages.html">Messages</a>
  </div>
  <div class="tabs no-print" id="customerPortalTabs" role="tablist" aria-label="Customer portal sections">
    <button type="button" class="tab fx-badge fx-badge--info active" data-customer-tab="overview">Overview</button>
    <button type="button" class="tab fx-badge fx-badge--neutral" data-customer-tab="estimates">Estimates</button>
    <button type="button" class="tab fx-badge fx-badge--neutral" data-customer-tab="invoices">Invoices</button>
    <button type="button" class="tab fx-badge fx-badge--neutral" data-customer-tab="jobs">Jobs</button>
    <button type="button" class="tab fx-badge fx-badge--neutral" data-customer-tab="offers">Offers</button>
    <button type="button" class="tab fx-badge fx-badge--neutral" data-customer-tab="subscriptions">Subscriptions</button>
    <button type="button" class="tab fx-badge fx-badge--neutral" data-customer-tab="serviceRequest">Service Request</button>
  </div>
  <div id="overview" class="section active no-print"></div>
  <div id="estimates" class="section no-print"></div>
  <div id="invoices" class="section no-print">
    <div id="invoiceListHost"></div>
    <div id="invoiceDetailSection" class="invoice-detail-wrap hidden">
      <div class="panel invoice-detail-toolbar no-print fx-toolbar">
        <button type="button" class="btn gray sm fx-btn fx-btn--secondary" data-customer-action="close-invoice-detail">← Back to invoices</button>
        <div class="invoice-detail-actions">
          <button type="button" class="btn gray sm fx-btn fx-btn--secondary" data-customer-action="print-invoice-detail">Print / Save as PDF</button>
          <button type="button" class="btn sm fx-btn fx-btn--primary" data-customer-action="download-current-invoice-pdf">Download PDF</button>
        </div>
      </div>
      <div id="invoiceDetailBody" class="customer-invoice-sheet panel fx-card"></div>
    </div>
  </div>
  <div id="jobs" class="section no-print"></div>
  <div id="offers" class="section no-print"></div>
  <div id="subscriptions" class="section no-print"></div>
  <div id="serviceRequest" class="section no-print"></div>
</div>
<script src="/js/ui.js"></script>
<script src="/js/format.js"></script>
<script>
const API = window.location.origin;
let state = null;
let currentInvoiceId = null;
let marketplaceRequests = [];
let customerNotifications = [];
let customerUnreadNotifications = 0;

function token(){ return localStorage.getItem("customerToken"); }
function headers(){ return { Authorization: "Bearer " + token() }; }
function esc(v){ return AppFormat.escapeHtml(v || ""); }
function money(v){ return AppFormat.formatMoney(v || 0); }
function date(v){ return v ? String(v).split("T")[0] : "-"; }

function clearCustomerSession(){
  localStorage.removeItem("token");
  localStorage.removeItem("customerToken");
  localStorage.removeItem("user");
  localStorage.removeItem("currentPage");
  localStorage.removeItem("customer");
}

function logout(){
  clearCustomerSession();
  window.location.href="/";
}

function redirectCustomerLogin(){
  clearCustomerSession();
  window.location.href="/customer-login-v2.html";
}

async function customerFetch(url, options){
  const res = await fetch(url, Object.assign({}, options || {}, { headers: Object.assign({}, (options && options.headers) || {}, headers()) }));
  if(res.status === 401 || res.status === 403){ redirectCustomerLogin(); throw new Error("Unauthorized"); }
  return res;
}

function showTab(id, button){
  document.querySelectorAll(".section").forEach(item => item.classList.toggle("active", item.id === id));
  document.querySelectorAll(".tab").forEach(function(item){
    item.classList.remove("active", "fx-badge--info");
    if(!item.classList.contains("fx-badge")) item.classList.add("fx-badge");
    if(!item.classList.contains("fx-badge--neutral")) item.classList.add("fx-badge--neutral");
  });
  if(button){
    button.classList.add("active");
    button.classList.remove("fx-badge--neutral");
    button.classList.add("fx-badge--info");
  }
}

function card(title, lines, status, actions){
  return '<div class="card fx-card"><div class="card-title">' + esc(title) + '</div>' +
    (status ? '<span class="status fx-badge fx-badge--neutral">' + esc(status) + '</span>' : '') +
    lines.map(line => '<div class="muted">' + line + '</div>').join('') +
    (actions ? '<div class="actions">' + actions + '</div>' : '') + '</div>';
}

function badgeClass(displayStatus){
  const s = String(displayStatus || "draft").toLowerCase().replace(/[^a-z_]/g, "") || "draft";
  return "badge badge-" + s;
}

function badgeLabel(displayStatus){
  const raw = String(displayStatus || "draft");
  return raw.replace(/_/g, " ");
}

function branding(inv){
  const ib = inv.invoice_branding || {};
  return {
    logo: ib.logo_url || inv.invoice_logo_url || "",
    name: ib.display_name || inv.branded_company_name || inv.company_name || "",
    phone: ib.phone || inv.branded_company_phone || inv.company_phone || "",
    email: ib.email || inv.branded_company_email || inv.company_email || "",
    website: ib.website || inv.branded_company_website || "",
    address: ib.address || inv.branded_company_address || inv.company_address || "",
    payment_instructions: ib.payment_instructions || inv.payment_instructions || "",
    zelle_name: ib.zelle_name || inv.zelle_name || "",
    zelle_contact: ib.zelle_contact || inv.zelle_contact || "",
    footer: ib.footer || inv.invoice_footer || ""
  };
}

function refundedSum(inv){
  if(inv.refunded_total != null && inv.refunded_total !== ""){
    return Number(inv.refunded_total);
  }
  if(Array.isArray(inv.refunds)){
    return inv.refunds.reduce(function(sum, r){ return sum + Number(r && r.amount != null ? r.amount : 0); }, 0);
  }
  return 0;
}

function netPaid(inv){
  if(inv.net_paid != null && inv.net_paid !== "") return Number(inv.net_paid);
  return Number(inv.paid_amount != null ? inv.paid_amount : 0);
}

function renderOverview(){
  const client = state.client || state.customer || {};
  const invs = state.invoices || [];
  const openCount = invs.filter(function(i){
    const ds = String(i.display_status || i.status || "").toLowerCase();
    return ds !== "paid" && ds !== "cancelled";
  }).length;
  document.getElementById("overview").innerHTML =
    '<div class="panel"><strong>Account</strong><br>' + esc(client.name || "") + '<br>' + esc(client.phone || "") + '<br>' + esc(client.address || "") + '<br>' + esc(client.zip || "") + '</div>' +
    '<div class="panel"><strong>Notifications</strong><br><span class="muted">Unread: ' + esc(String(customerUnreadNotifications)) + '</span><div id="customerNotificationsPanel" style="display:grid;gap:8px;margin-top:10px;"></div></div>' +
    '<div class="panel" id="customerGrowthPanel"><strong>Referrals &amp; saved addresses</strong><div id="customerGrowthExtras" class="muted" style="margin-top:10px;">Loading…</div>' +
    '<div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;">' +
    '<button type="button" class="btn gray sm" data-customer-action="refresh-referral-code">Show / refresh referral code</button>' +
    '</div></div>' +
    '<div class="panel" id="customerPreferredCompaniesPanel"><strong>Preferred providers</strong><p class="muted" style="margin:6px 0 10px;font-size:13px;">Based on completed work, paid invoices, repeats, subscriptions, and accepted marketplace offers.</p>' +
    '<div id="customerPreferredCompaniesBody" class="muted" style="margin-top:6px;">Loading…</div></div>' +
    '<div class="panel"><strong>Book again</strong><p class="muted" style="margin:6px 0 10px;">Tell your provider you want another visit (intent only — scheduling follows their workflow).</p>' +
    '<button type="button" class="btn sm" data-customer-action="customer-rebook-open">Request rebook</button></div>' +
    '<div class="grid">' +
    card("Upcoming Jobs", [String((state.upcoming_jobs || []).length)], "", "") +
    card("Open Invoices", [String(openCount)], "", "") +
    card("Active Subscriptions", [String((state.subscriptions || []).filter(function(s){ return s.status === "active"; }).length)], "", "") +
    '</div>';
  renderNotificationsPanel();
  hydrateCustomerGrowthExtras();
  hydrateCustomerPreferredCompanies();
}

async function hydrateCustomerPreferredCompanies(){
  const body = document.getElementById("customerPreferredCompaniesBody");
  if(!body) return;
  body.innerHTML = "Loading…";
  try {
    const res = await customerFetch(API + "/customer/trust-graph/preferences");
    const data = await res.json().catch(function(){ return {}; });
    if(!res.ok){
      body.textContent = "Preferred providers unavailable.";
      return;
    }
    const rows = (data.preferred_companies || []).slice(0, 8).map(function(pc){
      const name = pc.company_name || ("Company #" + pc.company_id);
      const score = pc.preference_score != null ? " · score " + pc.preference_score : "";
      return "<div>" + esc(name) + score + "</div>";
    });
    body.innerHTML = rows.length ? rows.join("") : '<span class="muted">Complete jobs or accept marketplace offers to surface preferred providers.</span>';
  } catch(e){
    body.textContent = "Preferred providers unavailable.";
  }
}

async function hydrateCustomerGrowthExtras(){
  const box = document.getElementById("customerGrowthExtras");
  if(!box) return;
  const client = state.client || state.customer || {};
  const cid = client.company_id != null ? Number(client.company_id) : null;
  const parts = [];
  try {
    const r = await customerFetch(API + "/customer/referrals");
    const d = await r.json().catch(function(){ return {}; });
    if(r.ok && d.summary){
      const rep = d.summary.referrals || {};
      const bs = rep.by_status || {};
      parts.push("<div><strong>Referral summary</strong></div>");
      parts.push('<div class="muted">Pending: ' + String(bs.pending || 0) + " · Qualified: " + String(bs.qualified || 0) + " · Rewarded: " + String(bs.rewarded || 0) + "</div>");
      if(d.summary.conversion_count != null){
        parts.push('<div class="muted">Conversions tracked: ' + String(d.summary.conversion_count) + "</div>");
      }
      parts.push('<div class="muted" style="margin-top:6px;">Use “Show / refresh referral code” to copy your shareable code.</div>');
    }
  } catch (_) {}
  try {
    if(cid){
      const r = await customerFetch(API + "/customer/saved-addresses?company_id=" + encodeURIComponent(cid));
      const rows = await r.json().catch(function(){ return []; });
      parts.push('<div style="margin-top:12px;"><strong>Saved addresses</strong></div>');
      if(r.ok && Array.isArray(rows) && rows.length){
        rows.slice(0, 8).forEach(function(a){
          parts.push('<div class="muted">' + esc(a.label || "Saved") + ": " + esc([a.address, a.city, a.state, a.zip].filter(Boolean).join(", ")) + (a.is_default ? " (default)" : "") + "</div>");
        });
      } else {
        parts.push('<div class="muted">No extra saved addresses on file.</div>');
      }
    } else {
      parts.push('<div style="margin-top:12px;" class="muted">When your account is linked to a provider, saved addresses appear here.</div>');
    }
  } catch (_) {}
  box.innerHTML = parts.length ? parts.join("") : '<div class="muted">Retention tools unavailable.</div>';
}

function renderNotificationsPanel(){
  const host = document.getElementById("customerNotificationsPanel");
  if(!host) return;
  if(!customerNotifications.length){
    host.innerHTML = '<div class="muted">No notifications yet.</div>';
    return;
  }
  host.innerHTML = customerNotifications.slice(0,5).map(function(item){
    const read = item && item.is_read === true;
    const title = esc(item && item.title ? item.title : "Notification");
    const body = esc(item && item.body ? item.body : "");
    const id = Number(item && item.id);
    return '<div class="card" style="padding:10px;">' +
      '<div class="card-title" style="font-size:14px;">' + title + (read ? '' : ' <span class="status">Unread</span>') + '</div>' +
      '<div class="muted">' + body + '</div>' +
      '<div class="actions">' + (read ? '' : '<button type="button" class="btn gray sm" data-customer-action="mark-notification-read" data-customer-notification-id="' + id + '">Mark read</button>') + '</div>' +
    '</div>';
  }).join("");
}

async function loadNotifications(){
  try {
    const res = await customerFetch(API + "/customer/notifications");
    const payload = await res.json();
    if(!res.ok){
      customerNotifications = [];
      customerUnreadNotifications = 0;
      return;
    }
    customerNotifications = Array.isArray(payload.notifications) ? payload.notifications : [];
    customerUnreadNotifications = Number(payload.unread_count || 0);
  } catch (_) {
    customerNotifications = [];
    customerUnreadNotifications = 0;
  }
}

async function markNotificationRead(id){
  const notificationId = Number(id);
  if(!notificationId) return;
  const res = await customerFetch(API + "/customer/notifications/" + encodeURIComponent(notificationId) + "/read", { method: "PATCH" });
  const data = await res.json();
  if(!res.ok){
    AppUI.showToast(data.error || "Unable to mark notification as read.", "error");
    return;
  }
  await load();
}

function renderEstimates(){
  const items = state.estimates || [];
  document.getElementById("estimates").innerHTML = items.length ? items.map(function(item){
    const decisionButtons = item.status === "converted" ? "" : '<button type="button" class="btn" data-customer-action="estimate-decision" data-customer-estimate-id="' + item.id + '" data-customer-decision="approve">Approve</button><button type="button" class="btn danger" data-customer-action="estimate-decision" data-customer-estimate-id="' + item.id + '" data-customer-decision="reject">Reject</button>';
    return card(
      item.service || "Estimate",
      ["Visit: " + date(item.visit_date), "Quoted: " + money(item.quoted_price), esc(item.notes || "")],
      item.status,
      decisionButtons + '<button type="button" class="btn gray" data-customer-action="download-pdf" data-customer-pdf-path="/customer/estimates/' + item.id + '/pdf" data-customer-pdf-file="estimate-' + item.id + '.pdf">Download PDF</button>'
    );
  }).join("") : '<div class="panel empty-panel fx-empty"><strong class="fx-empty__title">No estimates yet</strong><span class="fx-empty__text">Your estimates will appear here when available.</span></div>';
}

function renderInvoices(){
  const items = state.invoices || [];
  const host = document.getElementById("invoiceListHost");
  if(!host) return;
  if(!items.length){
    host.innerHTML = '<div class="panel empty-panel fx-empty"><strong class="fx-empty__title">No invoices yet</strong><span class="fx-empty__text">When your provider sends an invoice, it will show up here.</span></div>';
    return;
  }
  host.innerHTML =
    '<div class="inv-table-wrap">' +
    '<table class="inv-table" role="grid">' +
    '<thead><tr>' +
    '<th>Invoice</th><th>Status</th><th>Issued</th><th>Due</th><th>Total</th><th>Net paid</th><th>Refunded</th><th>Remaining</th><th class="inv-actions-cell">Actions</th>' +
    '</tr></thead><tbody>' +
    items.map(function(item){
      const ds = item.display_status || item.status || "draft";
      const refAmt = refundedSum(item);
      return '<tr>' +
        '<td><span class="inv-num">' + esc(item.invoice_number || ("#" + item.id)) + '</span></td>' +
        '<td><span class="' + badgeClass(ds) + '">' + esc(badgeLabel(ds)) + '</span></td>' +
        '<td>' + esc(date(item.issued_date)) + '</td>' +
        '<td>' + esc(date(item.due_date)) + '</td>' +
        '<td>' + esc(money(item.amount)) + '</td>' +
        '<td>' + esc(money(netPaid(item))) + '</td>' +
        '<td>' + esc(refAmt > 0 ? money(refAmt) : "—") + '</td>' +
        '<td>' + esc(money(item.remaining_balance)) + '</td>' +
        '<td class="inv-actions-cell">' +
          '<button type="button" class="btn sm" data-customer-action="view-invoice" data-customer-invoice-id="' + Number(item.id) + '">View</button> ' +
          '<button type="button" class="btn gray sm" data-customer-action="open-invoice-print" data-customer-invoice-id="' + Number(item.id) + '">Print</button> ' +
          '<button type="button" class="btn gray sm" data-customer-action="download-pdf" data-customer-pdf-path="/customer/invoices/' + Number(item.id) + '/pdf" data-customer-pdf-file="invoice-' + Number(item.id) + '.pdf">PDF</button>' +
        '</td>' +
        '</tr>';
    }).join("") +
    '</tbody></table></div>';
}

function renderInvoiceDetailBody(inv){
  const b = branding(inv);
  const items = Array.isArray(inv.line_items) && inv.line_items.length
    ? inv.line_items
    : [{ description: inv.job_service || "Service", quantity: 1, price: Number(inv.amount || 0), amount: Number(inv.amount || 0) }];
  const net = netPaid(inv);
  const refTot = refundedSum(inv);
  const displaySt = inv.display_status || inv.status || "";

  let logoHtml = "";
  if(b.logo){
    logoHtml = '<img class="cis-logo" src="' + esc(b.logo) + '" alt="">';
  }

  let payHist = "";
  const payments = Array.isArray(inv.payments) ? inv.payments : [];
  const refunds = Array.isArray(inv.refunds) ? inv.refunds : [];
  if(payments.length || refunds.length){
    payHist = '<div class="cis-payhist"><h4>Payment activity</h4>';
    payments.forEach(function(p){
      payHist += '<div class="cis-pay-row"><span>' + esc(date(p.date)) + " · " + esc(p.method || "Payment") + '</span><strong>' + esc(money(p.amount)) + '</strong></div>';
    });
    refunds.forEach(function(r){
      payHist += '<div class="cis-pay-row"><span>' + esc(date(r.created_at)) + " · Refunded</span><strong>−" + esc(money(r.amount)) + '</strong></div>';
    });
    payHist += '</div>';
  }

  let instruct = "";
  if(b.payment_instructions || b.zelle_name || b.zelle_contact){
    instruct += '<div class="cis-instructions">';
    instruct += "<strong>How to pay</strong><br>";
    if(b.payment_instructions){
      instruct += '<div style="margin-top:8px;">' + esc(b.payment_instructions).replace(/\n/g, "<br>") + '</div>';
    }
    if(b.zelle_name || b.zelle_contact){
      instruct += '<div style="margin-top:12px;"><strong>Zelle</strong><br>';
      if(b.zelle_name) instruct += esc(b.zelle_name) + "<br>";
      if(b.zelle_contact) instruct += esc(b.zelle_contact);
      instruct += '</div>';
    }
    instruct += '</div>';
  }

  let footerHtml = "";
  if(b.footer){
    footerHtml = '<div class="cis-footer">' + esc(b.footer).replace(/\n/g, "<br>") + '</div>';
  }

  document.getElementById("invoiceDetailBody").innerHTML =
    '<div class="cis-head">' +
      '<div class="cis-brand">' +
        logoHtml +
        '<div>' +
          '<div class="cis-company">' + esc(b.name || "Invoice") + '</div>' +
          '<div class="cis-lines">' +
            [b.phone, b.email, b.website, b.address].filter(Boolean).map(function(line){ return esc(line); }).join("<br>") +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="cis-meta">' +
        '<div><span class="' + badgeClass(displaySt) + '" style="margin-bottom:10px;display:inline-flex;">' + esc(badgeLabel(displaySt)) + '</span></div>' +
        '<div class="cis-meta-row"><span>Invoice #</span><strong>' + esc(inv.invoice_number || ("#" + inv.id)) + '</strong></div>' +
        '<div class="cis-meta-row"><span>Issued</span><strong>' + esc(date(inv.issued_date)) + '</strong></div>' +
        '<div class="cis-meta-row"><span>Due</span><strong>' + esc(date(inv.due_date)) + '</strong></div>' +
      '</div>' +
    '</div>' +
    '<div class="cis-grid">' +
      '<div class="cis-box"><div class="lbl">Bill to</div><div class="cis-lines">' +
        esc(inv.client_name || "") + "<br>" + esc(inv.client_phone || "") + "<br>" + esc(inv.client_address || "") + (inv.client_zip ? "<br>" + esc(inv.client_zip) : "") +
      '</div></div>' +
      '<div class="cis-box"><div class="lbl">Summary</div><div class="cis-lines">' +
        "Invoice total " + money(inv.amount) + "<br>" +
        "Net paid " + money(net) + "<br>" +
        (refTot > 0 ? "Refunded " + money(refTot) + "<br>" : "") +
        "Remaining " + money(inv.remaining_balance) +
      '</div></div>' +
    '</div>' +
    '<div class="cis-table-wrap"><table class="cis-table"><thead><tr><th>Description</th><th class="amount">Qty</th><th class="amount">Price</th><th class="amount">Amount</th></tr></thead><tbody>' +
    items.map(function(line){
      const qty = Number(line.quantity != null ? line.quantity : 1);
      const price = Number(line.price != null ? line.price : 0);
      const amt = Number(line.amount != null ? line.amount : (qty * price));
      return '<tr><td>' + esc(line.description || "Service") + '</td><td class="amount">' + esc(String(qty)) + '</td><td class="amount">' + esc(money(price)) + '</td><td class="amount">' + esc(money(amt)) + '</td></tr>';
    }).join("") +
    '</tbody></table></div>' +
    '<div class="cis-totals">' +
      '<div class="cis-total-row"><span>Subtotal</span><strong>' + money(inv.subtotal != null ? inv.subtotal : inv.amount) + '</strong></div>' +
      '<div class="cis-total-row grand"><span>Total</span><strong>' + money(inv.amount) + '</strong></div>' +
      '<div class="cis-total-row"><span>Net paid</span><strong>' + money(net) + '</strong></div>' +
      (refTot > 0 ? '<div class="cis-total-row"><span>Refunded</span><strong>' + money(refTot) + '</strong></div>' : '') +
      '<div class="cis-total-row"><span>Remaining</span><strong>' + money(inv.remaining_balance) + '</strong></div>' +
    '</div>' +
    payHist +
    instruct +
    footerHtml;
}

async function openInvoiceDetail(id, opts){
  opts = opts || {};
  var numericId = Number(id);
  if(!numericId){ AppUI.showToast("Invalid invoice.", "error"); return; }
  AppUI.setLoading(true, "Loading invoice...");
  try {
    const res = await customerFetch(API + "/customer/invoices/" + encodeURIComponent(numericId));
    const data = await res.json();
    if(!res.ok){
      AppUI.showToast(data.error || "This invoice is unavailable or could not be found.", "error");
      return;
    }
    currentInvoiceId = numericId;
    renderInvoiceDetailBody(data);
    document.getElementById("invoiceDetailSection").classList.remove("hidden");
    showTab("invoices", document.querySelector('[data-customer-tab="invoices"]'));
    if(!opts.skipScroll){
      document.getElementById("invoiceDetailSection").scrollIntoView({ behavior: "smooth", block: "start" });
    }
    if(opts.printAfter){
      requestAnimationFrame(function(){ window.print(); });
    }
  } catch(err){
    AppUI.showToast("Unable to load invoice. Please try again.", "error");
  } finally {
    AppUI.setLoading(false, "");
  }
}

function closeInvoiceDetail(){
  currentInvoiceId = null;
  document.getElementById("invoiceDetailSection").classList.add("hidden");
  document.getElementById("invoiceDetailBody").innerHTML = "";
}

function jobHistoryActions(item){
  const st = String(item.status || "").toLowerCase();
  const slug = item.company_public_slug ? String(item.company_public_slug).trim() : "";
  const jid = Number(item.id);
  if(st !== "completed" || !jid) return "";
  let html = '<button type="button" class="btn sm" data-customer-action="customer-rebook-job" data-job-id="' + jid + '">Rebook</button>';
  if(slug){
    html += ' <a class="btn gray sm" href="/company-profile.html?slug=' + encodeURIComponent(slug) + '">Leave review</a>';
  }
  html += ' <span class="muted" style="display:block;margin-top:6px;font-size:12px;">Reviews help pros grow — thank you for leaving feedback.</span>';
  return html;
}

function renderJobs(){
  const upcoming = state.upcoming_jobs || [];
  const history = state.job_history || [];
  document.getElementById("jobs").innerHTML =
    '<div class="panel"><strong>Upcoming Jobs</strong></div>' +
    (upcoming.length ? upcoming.map(function(item){ return card(item.service || "Job", ["Date: " + date(item.date), "Time: " + (item.start_time || "") + " - " + (item.end_time || ""), "Worker: " + esc(item.worker_name || "TBD")], item.status, ""); }).join("") : '<div class="panel empty-panel fx-empty"><strong class="fx-empty__title">No upcoming jobs</strong><span class="fx-empty__text">Scheduled visits will appear here.</span></div>') +
    '<div class="panel"><strong>Job History</strong></div>' +
    (history.length ? history.map(function(item){ return card(item.service || "Job", ["Date: " + date(item.date), "Time: " + (item.start_time || "") + " - " + (item.end_time || "")], item.status, jobHistoryActions(item)); }).join("") : '<div class="panel empty-panel fx-empty"><strong class="fx-empty__title">No job history yet</strong><span class="fx-empty__text">Past jobs will show here.</span></div>');
}

function renderOffers(){
  const items = marketplaceRequests || [];
  document.getElementById("offers").innerHTML =
    '<div class="panel"><strong>Marketplace Offers</strong><br>Use Marketplace to review and accept company offers.</div>' +
    '<div class="grid">' +
    card("Active Requests", [String(items.length)], "", '<a class="btn gray" href="/marketplace.html">View Offers</a>') +
    card("Messages", ["Message matched companies and track next steps."], "", '<a class="btn gray" href="/messages.html">Open Messages</a>') +
    card("Profile", ["Keep contact details current for offer updates."], "", '<a class="btn gray" href="/customer-profile.html">Open Profile</a>') +
    '</div>';
}

function renderSubscriptions(){
  const items = state.subscriptions || [];
  document.getElementById("subscriptions").innerHTML = items.length ? items.map(function(item){ return card(
    item.service || "Subscription",
    ["Frequency: " + esc(item.frequency || ""), "Next Visit: " + date(item.next_date), "Price: " + money(item.price), "Worker: " + esc(item.worker_name || "TBD")],
    item.status,
    ""
  ); }).join("") : '<div class="panel empty-panel fx-empty"><strong class="fx-empty__title">No subscriptions yet</strong><span class="fx-empty__text">Active plans will appear here.</span></div>';
}

function renderServiceRequest(){
  document.getElementById("serviceRequest").innerHTML =
    '<div class="panel fx-card"><form class="form-grid" id="customerServiceRequestForm">' +
    '<label class="fx-field">Service<input class="fx-input" id="requestService" required placeholder="What service do you need?"></label>' +
    '<label class="fx-field">Preferred Date<input class="fx-input" id="requestDate" type="date"></label>' +
    '<label class="fx-field">Notes<textarea class="fx-textarea" id="requestNotes" placeholder="Add helpful details"></textarea></label>' +
    '<div class="actions"><button class="btn fx-btn fx-btn--primary" type="submit">Send Request</button></div>' +
    '</form></div>';
  const form = document.getElementById("customerServiceRequestForm");
  if(form) form.addEventListener("submit", submitServiceRequest);
}

function renderCompany(){
  const c = state.company || {};
  const client = state.client || state.customer || {};
  document.getElementById("welcome").textContent = "Welcome, " + (client.name ? client.name : "customer") + ".";
  document.getElementById("companyBox").innerHTML = '<strong>' + esc(c.name || "Company") + '</strong><br>' + esc(c.phone || "") + '<br>' + esc(c.email || "") + '<br>' + esc(c.address || "") + '<br>' + esc(c.business_hours || "");
}

async function setEstimateStatus(id, action){
  const res = await customerFetch(API + "/customer/estimates/" + encodeURIComponent(id) + "/" + action, { method:"POST" });
  const data = await res.json();
  if(!res.ok){ AppUI.showToast(data.error || "Unable to update estimate.", "error"); return; }
  AppUI.showToast(action === "approve" ? "Estimate approved." : "Estimate rejected.", "success");
  await load();
}

async function downloadPdf(path, filename){
  const res = await customerFetch(API + path);
  if(!res.ok){
    let data = {};
    try { data = await res.json(); } catch(err) {}
    AppUI.showToast(data.error || "Unable to download PDF.", "error");
    return;
  }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

async function submitServiceRequest(event){
  event.preventDefault();
  const payload = {
    service: document.getElementById("requestService").value,
    visit_date: document.getElementById("requestDate").value,
    notes: document.getElementById("requestNotes").value
  };
  const res = await customerFetch(API + "/customer/service-requests", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if(!res.ok){ AppUI.showToast(data.error || "Unable to send request.", "error"); return; }
  AppUI.showToast("Service request sent.", "success");
  document.getElementById("requestService").value = "";
  document.getElementById("requestDate").value = "";
  document.getElementById("requestNotes").value = "";
  await load();
}

async function load(){
  if(!token()){ redirectCustomerLogin(); return; }
  AppUI.setLoading(true, "Loading portal...");
  try {
    const [dashboardRes] = await Promise.all([
      customerFetch(API + "/customer/dashboard"),
      loadNotifications()
    ]);
    const res = dashboardRes;
    state = await res.json();
    if(!res.ok){
      AppUI.showToast(state.error || "Unable to load portal.", "error");
      return;
    }
    const marketRes = await customerFetch(API + "/marketplace/requests/me");
    if(marketRes.ok){
      marketplaceRequests = await marketRes.json();
    } else {
      marketplaceRequests = [];
    }
    if(!Array.isArray(marketplaceRequests)) marketplaceRequests = [];
    closeInvoiceDetail();
    renderCompany(); renderOverview(); renderEstimates(); renderInvoices(); renderJobs(); renderOffers(); renderSubscriptions(); renderServiceRequest();
  } catch(err) {
    AppUI.showToast("Unable to load portal. Please refresh or sign in again.", "error");
  } finally {
    AppUI.setLoading(false, "");
  }
}

document.getElementById("customerPortalTabs").addEventListener("click", function(ev){
  const tab = ev.target.closest("[data-customer-tab]");
  if(!tab || !document.getElementById("customerPortalTabs").contains(tab)) return;
  const tabId = tab.getAttribute("data-customer-tab");
  if(tabId !== "invoices"){
    closeInvoiceDetail();
  }
  showTab(tabId, tab);
});

document.querySelectorAll("[data-customer-tab-link]").forEach(function(link){
  link.addEventListener("click", function(ev){
    ev.preventDefault();
    const tabId = link.getAttribute("data-customer-tab-link");
    const tab = document.querySelector('[data-customer-tab="' + tabId + '"]');
    if(tab) showTab(tabId, tab);
  });
});

document.querySelector(".page").addEventListener("click", function(ev){
  const btn = ev.target.closest("[data-customer-action]");
  if(!btn || !document.querySelector(".page").contains(btn)) return;
  const action = btn.getAttribute("data-customer-action");
  if(action === "logout"){
    logout();
    return;
  }
  if(action === "estimate-decision"){
    void setEstimateStatus(btn.getAttribute("data-customer-estimate-id"), btn.getAttribute("data-customer-decision"));
    return;
  }
  if(action === "download-pdf"){
    void downloadPdf(btn.getAttribute("data-customer-pdf-path"), btn.getAttribute("data-customer-pdf-file"));
    return;
  }
  if(action === "view-invoice"){
    void openInvoiceDetail(btn.getAttribute("data-customer-invoice-id"), {});
    return;
  }
  if(action === "open-invoice-print"){
    void openInvoiceDetail(btn.getAttribute("data-customer-invoice-id"), { printAfter: true, skipScroll: false });
    return;
  }
  if(action === "close-invoice-detail"){
    closeInvoiceDetail();
    return;
  }
  if(action === "print-invoice-detail"){
    if(!currentInvoiceId){
      AppUI.showToast("Open an invoice first.", "error");
      return;
    }
    window.print();
    return;
  }
  if(action === "download-current-invoice-pdf"){
    if(!currentInvoiceId){
      AppUI.showToast("Open an invoice first.", "error");
      return;
    }
    void downloadPdf("/customer/invoices/" + encodeURIComponent(currentInvoiceId) + "/pdf", "invoice-" + currentInvoiceId + ".pdf");
    return;
  }
  if(action === "mark-notification-read"){
    void markNotificationRead(btn.getAttribute("data-customer-notification-id"));
    return;
  }
  if(action === "refresh-referral-code"){
    void (async function(){
      const r = await customerFetch(API + "/customer/referrals/code", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}"
      });
      const d = await r.json().catch(function(){ return {}; });
      if(!r.ok){
        AppUI.showToast(d.error || "Unable to load referral code.", "error");
        return;
      }
      AppUI.showToast("Your referral code: " + String(d.code || ""), "success");
      await hydrateCustomerGrowthExtras();
    })();
    return;
  }
  if(action === "customer-rebook-open"){
    const notes = window.prompt("Optional note for your provider:", "") || "";
    const cl = state.client || state.customer || {};
    const companyId = cl.company_id != null ? Number(cl.company_id) : null;
    if(!companyId){
      AppUI.showToast("Company context missing for this account.", "error");
      return;
    }
    const jobsList = state.jobs || [];
    let sourceJobId = null;
    for(let i = 0; i < jobsList.length; i += 1){
      const st = String(jobsList[i].status || "").toLowerCase();
      if(st === "completed"){
        sourceJobId = jobsList[i].id;
        break;
      }
    }
    void (async function(){
      const r = await customerFetch(API + "/customer/rebook", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          company_id: companyId,
          notes: notes,
          requested_date: "",
          source_job_id: sourceJobId
        })
      });
      const d = await r.json().catch(function(){ return {}; });
      if(!r.ok){
        AppUI.showToast(d.error || "Unable to record rebook intent.", "error");
        return;
      }
      AppUI.showToast(d.message || "Rebook intent recorded.", "success");
      AppUI.showToast("Share FairLinx: open Dashboard referral tools to invite friends.", "success");
    })();
    return;
  }
  if(action === "customer-rebook-job"){
    const jid = Number(btn.getAttribute("data-job-id"));
    const cl = state.client || state.customer || {};
    const companyId = cl.company_id != null ? Number(cl.company_id) : null;
    if(!companyId || !jid){
      AppUI.showToast("Missing job or company context.", "error");
      return;
    }
    void (async function(){
      const r = await customerFetch(API + "/customer/rebook", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          company_id: companyId,
          notes: "",
          requested_date: "",
          source_job_id: jid
        })
      });
      const d = await r.json().catch(function(){ return {}; });
      if(!r.ok){
        AppUI.showToast(d.error || "Unable to record rebook intent.", "error");
        return;
      }
      AppUI.showToast(d.message || "Rebook intent recorded.", "success");
      AppUI.showToast("Invite neighbors: Dashboard → Growth extras → referral code.", "success");
    })();
    return;
  }
});

load();
</script>
