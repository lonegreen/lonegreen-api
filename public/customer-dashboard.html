<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Portal</title>
  <link rel="stylesheet" href="/app-shell.css">
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:linear-gradient(180deg,#edf5f0 0%,#f7f9f8 180px,#f4f6f8 100%); color:#173327; padding:20px; }
    .page { max-width:1180px; margin:0 auto; display:grid; gap:16px; }
    .hero { display:flex; justify-content:space-between; gap:14px; align-items:flex-end; flex-wrap:wrap; }
    h1 { margin:0 0 6px; color:#1f5c3a; font-size:32px; }
    p { margin:0; color:#648076; }
    .tabs { display:flex; flex-wrap:wrap; gap:8px; }
    .tab { border:1px solid #cfe0d5; background:white; color:#1f5c3a; border-radius:999px; padding:10px 14px; font-weight:800; cursor:pointer; }
    .tab.active { background:#1f5c3a; color:white; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .panel,.card { background:white; border:1px solid #dbe7df; border-radius:18px; box-shadow:0 18px 42px rgba(16,24,40,0.06); padding:16px; }
    .card { display:grid; gap:8px; }
    .card-title { font-size:18px; font-weight:800; color:#173327; }
    .muted { color:#648076; font-size:14px; }
    .status { display:inline-flex; width:fit-content; border-radius:999px; padding:6px 10px; font-size:12px; font-weight:800; text-transform:uppercase; background:#eef4f0; color:#1f5c3a; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
    .btn { border:0; border-radius:12px; padding:10px 12px; font-weight:800; cursor:pointer; background:#1f5c3a; color:white; }
    .btn.gray { background:#eef2f0; color:#1f5c3a; border:1px solid #dbe7df; }
    .btn.danger { background:#b42318; }
    .section { display:none; }
    .section.active { display:grid; gap:12px; }
    .invoice-print { display:none; }
    .form-grid { display:grid; gap:10px; }
    label { display:grid; gap:6px; font-weight:800; color:#173327; }
    input,textarea { width:100%; box-sizing:border-box; border:1px solid #cfe0d5; border-radius:12px; padding:11px 12px; font:inherit; }
    textarea { min-height:92px; resize:vertical; }
    table { width:100%; border-collapse:collapse; margin:10px 0; }
    th,td { text-align:left; border-bottom:1px solid #e4ece7; padding:10px; }
    @media print { body { background:white; } .no-print { display:none !important; } .invoice-print { display:block !important; } .page { max-width:none; } }
    @media (max-width:820px){ body{padding:12px;} .grid{grid-template-columns:1fr;} }
  </style>
</head>
<body>
<div class="page">
  <div class="hero no-print">
    <div>
      <h1>Customer Portal</h1>
      <p id="welcome">Loading...</p>
    </div>
    <button class="btn gray" onclick="logout()">Log Out</button>
  </div>
  <div class="panel no-print" id="companyBox">Loading company contact...</div>
  <div class="tabs no-print">
    <button class="tab active" onclick="showTab('overview', this)">Overview</button>
    <button class="tab" onclick="showTab('estimates', this)">Estimates</button>
    <button class="tab" onclick="showTab('invoices', this)">Invoices</button>
    <button class="tab" onclick="showTab('jobs', this)">Jobs</button>
    <button class="tab" onclick="showTab('subscriptions', this)">Subscriptions</button>
    <button class="tab" onclick="showTab('serviceRequest', this)">Service Request</button>
  </div>
  <div id="overview" class="section active no-print"></div>
  <div id="estimates" class="section no-print"></div>
  <div id="invoices" class="section no-print"></div>
  <div id="jobs" class="section no-print"></div>
  <div id="subscriptions" class="section no-print"></div>
  <div id="serviceRequest" class="section no-print"></div>
  <div id="invoicePrint" class="invoice-print"></div>
</div>
<script src="/js/ui.js"></script>
<script src="/js/format.js"></script>
<script>
const API = window.location.origin;
let state = null;
function token(){ return localStorage.getItem("customerToken"); }
function headers(){ return { Authorization: "Bearer " + token() }; }
function esc(v){ return AppFormat.escapeHtml(v || ""); }
function money(v){ return AppFormat.formatMoney(v || 0); }
function date(v){ return v ? String(v).split("T")[0] : "-"; }
function logout(){ localStorage.removeItem("customerToken"); localStorage.removeItem("customer"); window.location.href="/customer-login.html"; }
async function customerFetch(url, options){
  const res = await fetch(url, Object.assign({}, options || {}, { headers: Object.assign({}, (options && options.headers) || {}, headers()) }));
  if(res.status === 401 || res.status === 403){ logout(); throw new Error("Unauthorized"); }
  return res;
}
function showTab(id, button){
  document.querySelectorAll(".section").forEach(item => item.classList.toggle("active", item.id === id));
  document.querySelectorAll(".tab").forEach(item => item.classList.remove("active"));
  if(button) button.classList.add("active");
}
function card(title, lines, status, actions){
  return '<div class="card"><div class="card-title">' + esc(title) + '</div>' +
    (status ? '<span class="status">' + esc(status) + '</span>' : '') +
    lines.map(line => '<div class="muted">' + line + '</div>').join('') +
    (actions ? '<div class="actions">' + actions + '</div>' : '') + '</div>';
}
function renderOverview(){
  const client = state.client || state.customer || {};
  document.getElementById("overview").innerHTML =
    '<div class="panel"><strong>Account</strong><br>' + esc(client.name || "") + '<br>' + esc(client.phone || "") + '<br>' + esc(client.address || "") + '<br>' + esc(client.zip || "") + '</div>' +
    '<div class="grid">' +
    card("Upcoming Jobs", [String((state.upcoming_jobs || []).length)], "", "") +
    card("Open Invoices", [String((state.invoices || []).filter(i => !["paid","cancelled"].includes(i.status)).length)], "", "") +
    card("Active Subscriptions", [String((state.subscriptions || []).filter(s => s.status === "active").length)], "", "") +
    '</div>';
}
function renderEstimates(){
  const items = state.estimates || [];
  document.getElementById("estimates").innerHTML = items.length ? items.map(item => {
    const decisionButtons = item.status === "converted" ? "" : '<button class="btn" onclick="setEstimateStatus(' + item.id + ', \'approve\')">Approve</button><button class="btn danger" onclick="setEstimateStatus(' + item.id + ', \'reject\')">Reject</button>';
    return card(
      item.service || "Estimate",
      ["Visit: " + date(item.visit_date), "Quoted: " + money(item.quoted_price), esc(item.notes || "")],
      item.status,
      decisionButtons + '<button class="btn gray" onclick="downloadPdf(\'/customer/estimates/' + item.id + '/pdf\', \'estimate-' + item.id + '.pdf\')">PDF</button>'
    );
  }).join("") : '<div class="panel">No estimates yet.</div>';
}
function renderInvoices(){
  const items = state.invoices || [];
  document.getElementById("invoices").innerHTML = items.length ? items.map(item => card(
    item.invoice_number || ("Invoice #" + item.id),
    ["Issued: " + date(item.issued_date), "Due: " + date(item.due_date), "Total: " + money(item.amount), "Remaining: " + money(item.remaining_balance)],
    item.status,
    '<button class="btn" onclick="downloadPdf(\'/customer/invoices/' + item.id + '/pdf\', \'invoice-' + item.id + '.pdf\')">PDF</button><button class="btn gray" onclick="printInvoice(' + item.id + ')">Print View</button>'
  )).join("") : '<div class="panel">No invoices yet.</div>';
}
function renderJobs(){
  const upcoming = state.upcoming_jobs || [];
  const history = state.job_history || [];
  document.getElementById("jobs").innerHTML =
    '<div class="panel"><strong>Upcoming Jobs</strong></div>' +
    (upcoming.length ? upcoming.map(item => card(item.service || "Job", ["Date: " + date(item.date), "Time: " + (item.start_time || "") + " - " + (item.end_time || ""), "Worker: " + esc(item.worker_name || "TBD")], item.status, "")).join("") : '<div class="panel">No upcoming jobs.</div>') +
    '<div class="panel"><strong>Job History</strong></div>' +
    (history.length ? history.map(item => card(item.service || "Job", ["Date: " + date(item.date), "Time: " + (item.start_time || "") + " - " + (item.end_time || "")], item.status, "")).join("") : '<div class="panel">No job history yet.</div>');
}
function renderSubscriptions(){
  const items = state.subscriptions || [];
  document.getElementById("subscriptions").innerHTML = items.length ? items.map(item => card(
    item.service || "Subscription",
    ["Frequency: " + esc(item.frequency || ""), "Next Visit: " + date(item.next_date), "Price: " + money(item.price), "Worker: " + esc(item.worker_name || "TBD")],
    item.status,
    ""
  )).join("") : '<div class="panel">No subscriptions yet.</div>';
}
function renderServiceRequest(){
  document.getElementById("serviceRequest").innerHTML =
    '<div class="panel"><form class="form-grid" onsubmit="submitServiceRequest(event)">' +
    '<label>Service<input id="requestService" required placeholder="What service do you need?"></label>' +
    '<label>Preferred Date<input id="requestDate" type="date"></label>' +
    '<label>Notes<textarea id="requestNotes" placeholder="Add helpful details"></textarea></label>' +
    '<div class="actions"><button class="btn" type="submit">Send Request</button></div>' +
    '</form></div>';
}
function renderCompany(){
  const c = state.company || {};
  const client = state.client || state.customer || {};
  document.getElementById("welcome").textContent = "Welcome, " + (client.name ? client.name : "customer") + ".";
  document.getElementById("companyBox").innerHTML = '<strong>' + esc(c.name || "Company") + '</strong><br>' + esc(c.phone || "") + '<br>' + esc(c.email || "") + '<br>' + esc(c.address || "") + '<br>' + esc(c.business_hours || "");
}
async function setEstimateStatus(id, action){
  const res = await customerFetch(API + "/customer/estimates/" + encodeURIComponent(id) + "/" + action, { method:"POST" });
  const data = await res.json();
  if(!res.ok){ AppUI.showToast(data.error || "Unable to update estimate.", "error"); return; }
  AppUI.showToast(action === "approve" ? "Estimate approved." : "Estimate rejected.", "success");
  await load();
}
async function downloadPdf(path, filename){
  const res = await customerFetch(API + path);
  if(!res.ok){
    let data = {};
    try { data = await res.json(); } catch(err) {}
    AppUI.showToast(data.error || "Unable to download PDF.", "error");
    return;
  }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}
async function submitServiceRequest(event){
  event.preventDefault();
  const payload = {
    service: document.getElementById("requestService").value,
    visit_date: document.getElementById("requestDate").value,
    notes: document.getElementById("requestNotes").value
  };
  const res = await customerFetch(API + "/customer/service-requests", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if(!res.ok){ AppUI.showToast(data.error || "Unable to send request.", "error"); return; }
  AppUI.showToast("Service request sent.", "success");
  document.getElementById("requestService").value = "";
  document.getElementById("requestDate").value = "";
  document.getElementById("requestNotes").value = "";
  await load();
}
async function printInvoice(id){
  const res = await customerFetch(API + "/customer/invoices/" + encodeURIComponent(id));
  const invoice = await res.json();
  if(!res.ok){ AppUI.showToast(invoice.error || "Unable to load invoice.", "error"); return; }
  const items = Array.isArray(invoice.line_items) && invoice.line_items.length ? invoice.line_items : [{ description: invoice.job_service || "Service", quantity: 1, price: invoice.amount || 0, amount: invoice.amount || 0 }];
  document.getElementById("invoicePrint").innerHTML =
    '<h1>' + esc(invoice.invoice_number || ("Invoice #" + invoice.id)) + '</h1>' +
    '<p><strong>' + esc(invoice.company_name || "") + '</strong><br>' + esc(invoice.company_phone || "") + '<br>' + esc(invoice.company_email || "") + '</p>' +
    '<p><strong>Bill To:</strong><br>' + esc(invoice.client_name || "") + '<br>' + esc(invoice.client_phone || "") + '<br>' + esc(invoice.client_address || "") + '</p>' +
    '<p>Status: ' + esc(invoice.status || "") + ' | Due: ' + date(invoice.due_date) + '</p>' +
    '<table><thead><tr><th>Description</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>' +
    items.map(item => '<tr><td>' + esc(item.description || "Service") + '</td><td>' + Number(item.quantity || 1) + '</td><td>' + money(item.price || 0) + '</td><td>' + money(item.amount || 0) + '</td></tr>').join("") +
    '</tbody></table><h2>Total: ' + money(invoice.amount || 0) + '</h2><h2>Remaining: ' + money(invoice.remaining_balance || 0) + '</h2>';
  window.print();
}
async function load(){
  if(!token()){ window.location.href = "/customer-login.html"; return; }
  AppUI.setLoading(true, "Loading portal...");
  try {
    const res = await customerFetch(API + "/customer/dashboard");
    state = await res.json();
    if(!res.ok){ AppUI.showToast(state.error || "Unable to load portal.", "error"); return; }
    renderCompany(); renderOverview(); renderEstimates(); renderInvoices(); renderJobs(); renderSubscriptions(); renderServiceRequest();
  } catch(err) {
    AppUI.showToast("Unable to load portal.", "error");
  } finally {
    AppUI.setLoading(false);
  }
}
load();
</script>
</body>
</html>
