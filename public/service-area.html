<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Service Companies | FairLinx</title>
  <meta name="description" content="Find trusted local service companies by city and service area.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Local Service Companies | FairLinx">
  <meta property="og:description" content="Browse top local service providers and request service today.">
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/app-shell.css">
  <style>
    :root {
      --fl-orange: #FF5A00;
      --fl-orange-hover: #E64A00;
      --fl-orange-soft: #FF8A33;
      --fl-black: #111111;
      --fl-gray: #2B2B2B;
      --fl-border: #D9D9D9;
      --fl-bg: #F5F5F5;
      --fl-white: #FFFFFF;
      --fl-green: #16A34A;
      --fl-shadow: 0 20px 60px rgba(17, 17, 17, 0.10);
      --fl-shadow-soft: 0 12px 30px rgba(17, 17, 17, 0.07);
    }

    * {
      box-sizing: border-box;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--fl-black);
      background:
        radial-gradient(circle at 0% 0%, rgba(255, 90, 0, 0.12), transparent 30%),
        radial-gradient(circle at 100% 100%, rgba(255, 90, 0, 0.09), transparent 34%),
        linear-gradient(180deg, #ffffff 0%, #f5f5f5 100%);
      padding: 24px;
    }

    .page {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 14px;
    }

    .hero,
    .panel {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(217, 217, 217, 0.9);
      border-radius: 22px;
      box-shadow: var(--fl-shadow-soft);
    }

    .hero {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(340px, 0.95fr);
      gap: 28px;
      min-height: 285px;
      padding: 34px;
      align-items: center;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 82% 24%, rgba(255, 90, 0, 0.14), transparent 28%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(255, 250, 247, 0.88));
      pointer-events: none;
    }

    .hero > * {
      position: relative;
      z-index: 1;
    }

    .hero-art {
      min-height: 230px;
      border-radius: 22px;
      background:
        radial-gradient(circle at 72% 24%, rgba(255, 90, 0, 0.20), transparent 12%),
        linear-gradient(180deg, rgba(255, 90, 0, 0.04), rgba(255, 90, 0, 0.10));
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 90, 0, 0.12);
    }

    .hero-art::before {
      content: "";
      position: absolute;
      left: 46%;
      bottom: 24px;
      width: 210px;
      height: 118px;
      border-radius: 22px 22px 14px 14px;
      background: #fff;
      border: 1px solid rgba(17, 17, 17, 0.08);
      box-shadow: 0 18px 40px rgba(17, 17, 17, 0.10);
    }

    .hero-art::after {
      content: "";
      position: absolute;
      left: 43%;
      bottom: 132px;
      width: 250px;
      height: 68px;
      background: linear-gradient(135deg, #FF5A00, #FF7A1A);
      clip-path: polygon(8% 100%, 50% 0, 92% 100%);
      filter: drop-shadow(0 12px 18px rgba(255, 90, 0, 0.22));
    }

    .pin {
      position: absolute;
      right: 23%;
      top: 26px;
      width: 64px;
      height: 64px;
      border-radius: 50% 50% 50% 0;
      background: linear-gradient(135deg, #FF5A00, #FF7A1A);
      transform: rotate(-45deg);
      box-shadow: 0 18px 35px rgba(255, 90, 0, 0.25);
    }

    .pin::after {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      left: 20px;
      top: 20px;
      border-radius: 50%;
      background: #fff;
    }

    .tree,
    .tree.two,
    .tree.three {
      position: absolute;
      bottom: 32px;
      width: 50px;
      height: 92px;
      border-radius: 999px 999px 20px 20px;
      background: linear-gradient(180deg, #FF8A33, #FF5A00);
      box-shadow: 0 12px 24px rgba(255, 90, 0, 0.18);
    }

    .tree { left: 18%; }
    .tree.two { left: 30%; height: 72px; opacity: 0.88; }
    .tree.three { right: 7%; height: 84px; opacity: 0.92; }

    .city {
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: 26px;
      height: 150px;
      background:
        linear-gradient(90deg, transparent 0 10%, rgba(17, 17, 17, 0.06) 10% 18%, transparent 18% 22%, rgba(17, 17, 17, 0.05) 22% 31%, transparent 31% 100%),
        linear-gradient(180deg, transparent 0%, rgba(17, 17, 17, 0.05) 100%);
      opacity: 0.9;
      clip-path: polygon(0 100%, 0 45%, 8% 45%, 8% 25%, 16% 25%, 16% 60%, 26% 60%, 26% 35%, 36% 35%, 36% 100%, 100% 100%);
    }

    .hero-content {
      display: grid;
      gap: 16px;
    }

    .kicker {
      width: fit-content;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 90, 0, 0.22);
      background: rgba(255, 90, 0, 0.08);
      color: var(--fl-orange-hover);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .kicker::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--fl-orange);
      box-shadow: 0 0 0 5px rgba(255, 90, 0, 0.14);
    }

    .hero h1 {
      margin: 0;
      max-width: 620px;
      color: var(--fl-black);
      font-size: clamp(42px, 6vw, 74px);
      line-height: 0.95;
      letter-spacing: -0.06em;
      font-weight: 950;
    }

    .hero h1 .accent {
      color: var(--fl-orange);
    }

    .hero p,
    .muted {
      margin: 0;
      color: #4b5563;
      line-height: 1.55;
      font-size: 16px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 46px;
      border: none;
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 900;
      text-decoration: none;
      display: inline-flex;
      gap: 9px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:focus-visible,
    .seo-links a:focus-visible {
      outline: 3px solid rgba(255, 90, 0, 0.35);
      outline-offset: 3px;
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--fl-orange), #FF7A1A);
      color: #fff;
      box-shadow: 0 14px 28px rgba(255, 90, 0, 0.24);
    }

    .btn.primary:hover {
      box-shadow: 0 18px 36px rgba(255, 90, 0, 0.30);
    }

    .btn.secondary {
      background: #fff;
      color: var(--fl-orange);
      border: 1px solid rgba(255, 90, 0, 0.45);
    }

    .status {
      min-height: 48px;
      width: min(520px, 100%);
      display: flex;
      align-items: center;
      gap: 10px;
      color: #166534;
      font-size: 14px;
      font-weight: 800;
      border: 1px solid rgba(22, 163, 74, 0.18);
      border-radius: 14px;
      background: rgba(22, 163, 74, 0.07);
      padding: 12px 14px;
    }

    .status::before {
      content: "✓";
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: var(--fl-green);
      color: #fff;
      font-size: 13px;
      font-weight: 950;
    }

    .status:empty {
      display: none;
    }

    .status.error {
      color: #991b1b;
      border-color: rgba(220, 38, 38, 0.22);
      background: rgba(220, 38, 38, 0.07);
    }

    .status.error::before {
      content: "!";
      background: #DC2626;
    }

    .panel {
      padding: 22px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .panel h2 {
      margin: 0;
      color: var(--fl-black);
      font-size: 25px;
      line-height: 1.15;
      letter-spacing: -0.035em;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .panel h2::before {
      content: "";
      width: 10px;
      height: 28px;
      border-radius: 999px;
      background: linear-gradient(180deg, #FF5A00, #FF7A1A);
      box-shadow: 0 8px 18px rgba(255, 90, 0, 0.20);
    }

    .cards {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(315px, 1fr));
    }

    .card {
      border: 1px solid rgba(217, 217, 217, 0.9);
      border-radius: 18px;
      background: linear-gradient(180deg, #ffffff 0%, #fbfbfb 100%);
      padding: 14px;
      display: grid;
      gap: 12px;
      box-shadow: 0 8px 20px rgba(17, 17, 17, 0.055);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 90, 0, 0.28);
      box-shadow: 0 18px 38px rgba(17, 17, 17, 0.09);
    }

    .company-head {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo,
    .logo-fallback {
      width: 72px;
      height: 72px;
      border-radius: 17px;
      border: 1px solid rgba(217, 217, 217, 0.85);
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
    }

    .logo {
      object-fit: cover;
      background: #fff7f2;
    }

    .logo-fallback {
      display: grid;
      place-items: center;
      font-weight: 950;
      color: #fff;
      font-size: 20px;
      background: linear-gradient(135deg, #FF5A00, #FF7A1A);
    }

    .company-name {
      margin: 0;
      font-size: 17px;
      color: var(--fl-black);
      font-weight: 950;
      overflow-wrap: anywhere;
      letter-spacing: -0.02em;
    }

    .summary {
      margin: 0;
      font-size: 14px;
      color: #374151;
      line-height: 1.55;
      min-height: 42px;
    }

    .chips {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .chip {
      border-radius: 999px;
      border: 1px solid rgba(217, 217, 217, 0.9);
      padding: 6px 9px;
      font-size: 12px;
      background: #fff;
      color: var(--fl-gray);
      font-weight: 800;
    }

    .chip.good {
      background: rgba(22, 163, 74, 0.10);
      border-color: rgba(22, 163, 74, 0.18);
      color: #166534;
    }

    .meta {
      margin: 0;
      font-size: 12px;
      color: #4b5563;
      line-height: 1.45;
    }

    .meta strong {
      color: var(--fl-black);
    }

    .card .actions {
      padding-top: 4px;
    }

    .card .btn {
      min-height: 40px;
      padding: 10px 13px;
      font-size: 13px;
      border-radius: 12px;
    }

    .empty {
      grid-column: 1 / -1;
      border: 1px dashed rgba(255, 90, 0, 0.35);
      border-radius: 18px;
      background: rgba(255, 90, 0, 0.055);
      padding: 22px;
      color: #5f3321;
      text-align: center;
      line-height: 1.55;
    }

    .empty strong {
      display: block;
      margin-bottom: 5px;
      color: var(--fl-black);
      font-size: 18px;
    }

    .seo-links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
      gap: 10px;
    }

    .seo-links a {
      min-height: 43px;
      border: 1px solid rgba(255, 90, 0, 0.45);
      border-radius: 999px;
      padding: 10px 14px;
      text-decoration: none;
      color: var(--fl-orange);
      background: #fff;
      font-size: 13px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .seo-links a::before {
      content: "⌕";
      font-size: 19px;
      line-height: 1;
      color: var(--fl-orange);
    }

    .seo-links a:hover {
      transform: translateY(-1px);
      background: #fff7f2;
      box-shadow: 0 10px 22px rgba(255, 90, 0, 0.10);
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .hero-art {
        min-height: 210px;
      }
    }

    @media (max-width: 760px) {
      body {
        padding: 14px;
      }

      .hero {
        padding: 22px;
        border-radius: 20px;
      }

      .panel {
        padding: 16px;
        border-radius: 20px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .actions .btn {
        width: 100%;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: clamp(38px, 12vw, 54px);
      }

      .hero-art {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="hero-content">
        <div class="kicker">FairLinx Local Network</div>
        <h1 id="heroTitle">Local Services <span class="accent">Near You</span></h1>
        <p id="heroIntro">Find trusted, reviewed companies in your city and service area.</p>
        <div class="actions">
          <a id="requestCta" class="btn primary" href="/marketplace.html">Request Service</a>
          <a id="browseCta" class="btn secondary" href="/discover.html">Find Services</a>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </div>

      <div class="hero-art" aria-hidden="true">
        <div class="city"></div>
        <div class="pin"></div>
        <div class="tree"></div>
        <div class="tree two"></div>
        <div class="tree three"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Matching Companies</h2>
      </div>
      <div id="results" class="cards"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Popular Local Searches</h2>
      </div>
      <div id="seoLinks" class="seo-links"></div>
    </section>
  </main>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const q = {
        service: String(params.get("service") || "").trim(),
        city: String(params.get("city") || "").trim(),
        state: String(params.get("state") || "").trim().toUpperCase().slice(0, 2),
        zip: String(params.get("zip") || "").replace(/\D/g, "").slice(0, 5)
      };

      const els = {
        heroTitle: document.getElementById("heroTitle"),
        heroIntro: document.getElementById("heroIntro"),
        requestCta: document.getElementById("requestCta"),
        browseCta: document.getElementById("browseCta"),
        status: document.getElementById("status"),
        results: document.getElementById("results"),
        seoLinks: document.getElementById("seoLinks")
      };

      function esc(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function(ch) {
          return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
        });
      }

      function safeText(value, fallback) {
        if (value === null || value === undefined || value === "") return fallback || "";
        return String(value);
      }

      function setStatus(message, type) {
        els.status.textContent = message || "";
        els.status.className = "status" + (type ? " " + type : "");
      }

      function isSafeHttpUrl(value) {
        const raw = String(value || "").trim();
        if (!raw) return false;
        if (raw.startsWith("/")) return true;
        try {
          const parsed = new URL(raw, window.location.origin);
          return parsed.protocol === "http:" || parsed.protocol === "https:";
        } catch (_) {
          return false;
        }
      }

      function fromSlug(slug) {
        return String(slug || "").split("-").filter(Boolean).map(function(w) {
          return w.charAt(0).toUpperCase() + w.slice(1);
        }).join(" ");
      }

      function buildSearchLabel() {
        const serviceLabel = q.service ? fromSlug(q.service) : "Home Services";
        const locationLabel = q.city ? (q.city + (q.state ? ", " + q.state : "")) : (q.zip ? ("ZIP " + q.zip) : "Your Area");
        return { serviceLabel, locationLabel };
      }

      function setMetadata(title, description) {
        document.title = title;
        const metaDescription = document.querySelector('meta[name="description"]');
        if (metaDescription) metaDescription.setAttribute("content", description);
        const ogTitle = document.querySelector('meta[property="og:title"]');
        if (ogTitle) ogTitle.setAttribute("content", title);
        const ogDescription = document.querySelector('meta[property="og:description"]');
        if (ogDescription) ogDescription.setAttribute("content", description);
        const canonicalHref = window.location.origin + window.location.pathname + "?" + new URLSearchParams({
          service: q.service,
          city: q.city,
          state: q.state,
          zip: q.zip
        }).toString();
        let canonical = document.querySelector('link[rel="canonical"]');
        if (!canonical) {
          canonical = document.createElement("link");
          canonical.setAttribute("rel", "canonical");
          document.head.appendChild(canonical);
        }
        canonical.setAttribute("href", canonicalHref);
      }

      function renderSeoLinks() {
        const seeds = [
          { service: "lawn-care", city: "Richmond", state: "TX" },
          { service: "landscaping", city: "Sugar Land", state: "TX" },
          { service: "pressure-washing", city: "Katy", state: "TX" }
        ];
        const links = seeds.map(function(seed) {
          const url = "/service-area.html?" + new URLSearchParams(seed).toString();
          return '<a href="' + esc(url) + '">' + esc(fromSlug(seed.service)) + " in " + esc(seed.city + ", " + seed.state) + "</a>";
        }).join("");
        els.seoLinks.innerHTML = links;
      }

      function renderCompanies(list) {
        if (!Array.isArray(list) || !list.length) {
          els.results.innerHTML = '<div class="empty"><strong>No matching companies yet</strong>Try a nearby city, a broader service keyword, or browse all public companies.</div>';
          return;
        }
        els.results.innerHTML = list.map(function(c) {
          const name = safeText(c.name, "Company");
          const slug = safeText(c.slug, "");
          const summary = safeText(c.public_description, "Public service details are being updated.");
          const logo = isSafeHttpUrl(c.logo_url) ? String(c.logo_url).trim() : "";
          const initials = name.split(/\s+/).map(function(p){ return p.charAt(0); }).join("").slice(0, 2).toUpperCase() || "CO";
          const services = Array.isArray(c.services) ? c.services.slice(0, 3) : [];
          const areas = Array.isArray(c.service_areas) ? c.service_areas.slice(0, 2) : [];
          const trust = c.trust || {};
          const verified = c.is_verified === true || trust.verification_status === "approved";
          const rating = c.rating_summary || {};
          const avg = Number(rating.average_rating || 0);
          const count = Number(rating.review_count || 0);
          return '<article class="card">' +
            '<div class="company-head">' +
              (logo ? '<img class="logo" src="' + esc(logo) + '" alt="' + esc(name) + ' logo">' : '<div class="logo-fallback" aria-hidden="true">' + esc(initials) + "</div>") +
              '<div><h3 class="company-name">' + esc(name) + '</h3><p class="meta">' + esc(avg > 0 ? (avg.toFixed(1) + " rating • " + count + " reviews") : "No ratings yet") + "</p></div>" +
            "</div>" +
            '<p class="summary">' + esc(summary) + "</p>" +
            '<div class="chips">' +
              (verified ? '<span class="chip good">Verified</span>' : "") +
              ((trust.insurance_status === "verified" || trust.insurance_status === "approved") && trust.insurance_expired !== true ? '<span class="chip good">Insured</span>' : "") +
              ((trust.license_status === "verified" || trust.license_status === "approved") && trust.license_expired !== true ? '<span class="chip good">Licensed</span>' : "") +
            "</div>" +
            '<p class="meta"><strong>Services:</strong> ' + esc(services.length ? services.join(", ") : "Not listed") + "</p>" +
            '<p class="meta"><strong>Coverage:</strong> ' + esc(areas.length ? areas.join(" • ") : "Not listed") + "</p>" +
            '<div class="actions">' +
              '<a class="btn secondary" href="/company-profile.html?slug=' + esc(encodeURIComponent(slug)) + '">View Profile</a>' +
            "</div>" +
          "</article>";
        }).join("");
      }

      async function load() {
        renderSeoLinks();
        const labels = buildSearchLabel();
        const title = labels.serviceLabel + " in " + labels.locationLabel + " | FairLinx";
        const description = "Find trusted " + labels.serviceLabel.toLowerCase() + " providers in " + labels.locationLabel + ". Compare local companies, trust badges, and reviews.";
        els.heroTitle.innerHTML = esc(labels.serviceLabel) + ' in <span class="accent">' + esc(labels.locationLabel) + "</span>";
        els.heroIntro.textContent = "Compare local companies, trust details, service coverage, and customer ratings before requesting service.";
        setMetadata(title, description);

        const discoverUrl = "/discover.html?" + new URLSearchParams({
          search: q.service,
          location: q.city || q.zip
        }).toString();
        const marketplaceUrl = "/marketplace.html";
        els.requestCta.setAttribute("href", marketplaceUrl);
        els.browseCta.setAttribute("href", discoverUrl);

        if (!q.service && !q.city && !q.state && !q.zip) {
          setStatus("Add query params like ?service=lawn-care&city=Richmond&state=TX.", "error");
          renderCompanies([]);
          return;
        }

        setStatus("Loading local company matches...", "");
        try {
          const url = "/companies/public/search?" + new URLSearchParams({
            service: q.service,
            city: q.city,
            state: q.state,
            zip: q.zip
          }).toString();
          const res = await fetch(url);
          const data = await res.json().catch(function() { return {}; });
          if (!res.ok) throw new Error(data.error || "Unable to load local matches.");
          const companies = Array.isArray(data.companies) ? data.companies : [];
          renderCompanies(companies);
          setStatus(companies.length ? ("Showing " + companies.length + " matching companies.") : "No current matches for this location and service.", "");
        } catch (err) {
          renderCompanies([]);
          setStatus(err.message || "Unable to load local company matches.", "error");
        }
      }

      load();
    })();
  </script>
</body>
