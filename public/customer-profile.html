<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FairLinx Customer Profile</title>
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/app-shell.css">
  <style>
    * { box-sizing: border-box; font-family: Inter, Arial, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #f5f5f5 0%, #f7f9f8 190px, #f4f6f8 100%);
      color: var(--brand-black);
      padding: 22px;
    }
    .page {
      width: min(980px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }
    .hero {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-end;
      flex-wrap: wrap;
      padding: 8px 0;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      color: #2a2d33;
      margin-bottom: 14px;
    }
    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff8a33, #ffd7bf);
      color: var(--brand-black);
      display: grid;
      place-items: center;
      font-size: 20px;
      box-shadow: 0 10px 28px rgba(230,74,0,0.2);
    }
    h1 {
      margin: 0 0 6px;
      color: var(--brand-primary);
      font-size: 32px;
      letter-spacing: 0;
    }
    .hero p {
      margin: 0;
      color: #648076;
      line-height: 1.45;
    }
    .customer-nav { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .customer-nav a { border:1px solid var(--brand-border); background:white; color:var(--brand-primary); border-radius:999px; padding:8px 12px; font-size:13px; font-weight:800; text-decoration:none; }
    .profile-card {
      background: white;
      border: 1px solid var(--brand-border);
      border-radius: 18px;
      box-shadow: 0 18px 42px rgba(16,24,40,0.06);
      padding: 22px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      flex-wrap: wrap;
      margin-bottom: 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid #e8efe9;
    }
    .avatar {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: #fff3e8;
      color: var(--brand-primary);
      font-size: 20px;
      font-weight: 900;
      flex: 0 0 auto;
    }
    .identity {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .identity strong {
      display: block;
      font-size: 18px;
      color: var(--brand-black);
      margin-bottom: 4px;
    }
    .identity span {
      color: #5f646d;
      font-size: 14px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .field {
      display: grid;
      gap: 7px;
    }
    .field.full {
      grid-column: 1 / -1;
    }
    label {
      font-size: 13px;
      font-weight: 800;
      color: #3a3f48;
    }
    input, textarea {
      width: 100%;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1px solid #dbe5dd;
      background: white;
      outline: none;
      font-size: 15px;
      color: var(--brand-black);
      transition: 0.18s ease;
    }
    textarea {
      min-height: 96px;
      resize: vertical;
      line-height: 1.45;
    }
    input:focus, textarea:focus {
      border-color: rgba(255,90,0,0.5);
      box-shadow: 0 0 0 4px rgba(255,90,0,0.12);
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 13px 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-primary-hover));
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.18s ease;
      box-shadow: 0 12px 28px rgba(230,74,0,0.18);
    }
    .btn.secondary {
      background: var(--brand-bg);
      color: var(--brand-primary);
      border: 1px solid var(--brand-border);
      box-shadow: none;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { cursor: not-allowed; opacity: 0.65; transform: none; }
    .status {
      min-height: 22px;
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.45;
      color: #5f6e66;
    }
    .status.success { color: var(--brand-primary-hover); font-weight: 700; }
    .status.error { color: #b42318; font-weight: 700; }
    @media (max-width: 720px) {
      body { padding: 14px; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .profile-card { padding: 18px; }
      .actions { flex-direction: column-reverse; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page fx-layout-public">
    <section class="hero fx-hero fx-section-head">
      <div>
        <div class="brand">
          <div class="brand-mark">LG</div>
          <span>FairLinx Customer Portal</span>
        </div>
        <h1>Your Profile</h1>
        <p>Keep your contact details current for service updates, billing, and customer portal access.</p>
        <nav class="customer-nav">
          <a href="/customer-dashboard.html">Dashboard</a>
          <a href="/marketplace.html">Marketplace</a>
          <a href="/discover.html">Discover</a>
          <a href="/messages.html">Messages</a>
          <a href="/customer-profile.html">Profile</a>
          <a href="#" id="customerLogoutLink">Logout</a>
        </nav>
      </div>
      <button id="logoutTopBtn" class="btn secondary fx-btn fx-btn--secondary" type="button">Log Out</button>
    </section>

    <section class="profile-card fx-card">
      <div class="card-header">
        <div class="identity">
          <div id="avatar" class="avatar">CU</div>
          <div>
            <strong id="profileName">Customer Profile</strong>
            <span id="profileEmail">Loading profile...</span>
          </div>
        </div>
      </div>

      <form id="profileForm">
        <div class="form-grid">
            <label class="field fx-field">First Name <input id="firstName" class="fx-input" autocomplete="given-name" required></label>
            <label class="field fx-field">Last Name <input id="lastName" class="fx-input" autocomplete="family-name" required></label>
            <label class="field fx-field">Email <input id="email" class="fx-input" type="email" autocomplete="email" required></label>
            <label class="field fx-field">Phone <input id="phone" class="fx-input" type="tel" autocomplete="tel"></label>
            <label class="field full fx-field">Address <textarea id="address" class="fx-textarea" autocomplete="street-address"></textarea></label>
        </div>

        <div class="actions">
          <button id="logoutBtn" class="btn secondary fx-btn fx-btn--secondary" type="button">Log Out</button>
          <button id="saveBtn" class="btn fx-btn fx-btn--primary" type="submit">Save Profile</button>
        </div>
        <div id="status" class="status fx-alert" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const API_BASE = (window.AppAPI && window.AppAPI.base) || window.location.origin;
    const form = document.getElementById("profileForm");
    const statusBox = document.getElementById("status");
    const saveBtn = document.getElementById("saveBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const logoutTopBtn = document.getElementById("logoutTopBtn");
    const customerLogoutLink = document.getElementById("customerLogoutLink");

    function customerToken() {
      return localStorage.getItem("customerToken");
    }

    function setStatus(message, type) {
      statusBox.textContent = message || "";
      statusBox.className = "status" + (type ? " " + type : "");
    }

    function readStoredCustomer() {
      try {
        return JSON.parse(localStorage.getItem("customer") || "null") || {};
      } catch (err) {
        return {};
      }
    }

    function normalizeProfile(profile) {
      const fullName = String(profile.name || "").trim();
      const parts = fullName.split(/\s+/).filter(Boolean);
      return {
        first_name: profile.first_name || profile.firstName || parts[0] || "",
        last_name: profile.last_name || profile.lastName || parts.slice(1).join(" ") || "",
        email: profile.email || "",
        phone: profile.phone || "",
        address: profile.address || ""
      };
    }

    function fillProfile(profile) {
      const data = normalizeProfile(profile || {});
      document.getElementById("firstName").value = data.first_name;
      document.getElementById("lastName").value = data.last_name;
      document.getElementById("email").value = data.email;
      document.getElementById("phone").value = data.phone;
      document.getElementById("address").value = data.address;
      updateHeader();
    }

    function currentPayload() {
      return {
        first_name: document.getElementById("firstName").value.trim(),
        last_name: document.getElementById("lastName").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        address: document.getElementById("address").value.trim()
      };
    }

    function updateHeader() {
      const payload = currentPayload();
      const name = [payload.first_name, payload.last_name].filter(Boolean).join(" ") || "Customer Profile";
      const initials = [payload.first_name, payload.last_name].filter(Boolean).map(part => part[0]).join("").slice(0, 2).toUpperCase() || "CU";
      document.getElementById("profileName").textContent = name;
      document.getElementById("profileEmail").textContent = payload.email || "No email on file";
      document.getElementById("avatar").textContent = initials;
    }

    async function loadProfile() {
      const stored = readStoredCustomer();
      if (Object.keys(stored).length) fillProfile(stored);

      if (!customerToken()) {
        setStatus("No customer session found. Log in before saving profile changes.", "error");
        return;
      }

      setStatus("Loading your profile...", "");
      try {
        const res = await fetch(API_BASE + "/customer/profile", {
          method: "GET",
          headers: { Authorization: "Bearer " + customerToken() }
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || data.message || "Profile is not available yet.");

        const profile = data.profile || data.customer || data;
        fillProfile(profile);
        localStorage.setItem("customer", JSON.stringify(profile));
        setStatus("Profile loaded.", "success");
      } catch (err) {
        if (Object.keys(stored).length) {
          setStatus("Using locally saved profile details until the profile API is available.", "");
        } else {
          setStatus(err.message || "Profile is not available yet.", "error");
        }
      }
    }

    function logout() {
      localStorage.removeItem("customerToken");
      localStorage.removeItem("customer");
      window.location.href = "/customer-login-v2.html";
    }

    form.addEventListener("input", updateHeader);
    logoutBtn.addEventListener("click", logout);
    logoutTopBtn.addEventListener("click", logout);
    customerLogoutLink.addEventListener("click", function(event) {
      event.preventDefault();
      logout();
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (!customerToken()) {
        setStatus("No customer session found. Log in before saving profile changes.", "error");
        return;
      }

      const payload = currentPayload();
      saveBtn.disabled = true;
      setStatus("Saving profile...", "");

      try {
        const res = await fetch(API_BASE + "/customer/profile", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + customerToken()
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || data.message || "Unable to save profile.");

        const profile = data.profile || data.customer || payload;
        localStorage.setItem("customer", JSON.stringify(profile));
        fillProfile(profile);
        setStatus("Profile saved successfully.", "success");
      } catch (err) {
        setStatus(err.message || "Unable to save profile.", "error");
      } finally {
        saveBtn.disabled = false;
      }
    });

    loadProfile();
  </script>
</body>
</html>
