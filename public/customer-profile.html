<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FairLinx Customer Profile</title>
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/app-shell.css">
  <style>
    :root {
      --fl-orange: #FF5A00;
      --fl-orange-hover: #E64A00;
      --fl-orange-soft: #FF8A33;
      --fl-black: #111111;
      --fl-gray: #2B2B2B;
      --fl-border: #D9D9D9;
      --fl-bg: #F5F5F5;
      --fl-white: #FFFFFF;
      --fl-success: #16A34A;
      --fl-error: #DC2626;
      --fl-shadow: 0 22px 60px rgba(17, 17, 17, 0.08);
      --fl-shadow-soft: 0 12px 30px rgba(17, 17, 17, 0.06);
      --fl-radius-xl: 26px;
      --fl-radius-lg: 20px;
      --fl-radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      font-family: Inter, Arial, sans-serif;
    }

    html {
      min-height: 100%;
      background: var(--fl-bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 8% 0%, rgba(255, 90, 0, 0.10), transparent 34%),
        radial-gradient(circle at 95% 4%, rgba(255, 122, 26, 0.08), transparent 30%),
        linear-gradient(180deg, #ffffff 0%, #fafafa 260px, #f4f4f4 100%);
      color: var(--fl-black);
      padding: 24px;
    }

    .page {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 22px;
      animation: pageIn 0.25s ease-out;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 28px;
      align-items: start;
      padding: 8px 0 10px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 950;
      color: var(--fl-black);
      min-width: 230px;
      padding-right: 28px;
      border-right: 1px solid rgba(217, 217, 217, 0.9);
    }

    .brand-mark {
      width: 74px;
      height: 54px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--fl-orange), var(--fl-orange-hover));
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 30px;
      font-weight: 950;
      letter-spacing: -0.08em;
      box-shadow: 0 18px 36px rgba(255, 90, 0, 0.24);
      transform: skew(-8deg);
    }

    .brand span {
      font-size: 28px;
      letter-spacing: -0.06em;
      line-height: 1;
    }

    .brand span::first-letter {
      color: var(--fl-black);
    }

    .hero-main {
      min-width: 0;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--fl-orange);
      font-size: clamp(34px, 4.8vw, 48px);
      line-height: 0.98;
      letter-spacing: -0.06em;
      font-weight: 950;
    }

    .hero p {
      margin: 0;
      color: #5f6368;
      line-height: 1.5;
      font-size: 16px;
    }

    .customer-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .customer-nav a {
      border: 1px solid rgba(217, 217, 217, 0.95);
      background: white;
      color: var(--fl-gray);
      border-radius: 999px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 900;
      text-decoration: none;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.18s ease, border-color 0.18s ease, color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .customer-nav a[href="/customer-profile.html"] {
      color: var(--fl-orange);
      border-color: rgba(255, 90, 0, 0.45);
      background: rgba(255, 90, 0, 0.04);
    }

    .customer-nav a:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 90, 0, 0.55);
      color: var(--fl-orange);
      box-shadow: 0 12px 24px rgba(255, 90, 0, 0.08);
    }

    #logoutTopBtn {
      margin-top: 20px;
      white-space: nowrap;
    }

    .profile-card {
      position: relative;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(217, 217, 217, 0.95);
      border-radius: var(--fl-radius-xl);
      box-shadow: var(--fl-shadow);
      padding: 28px;
      overflow: hidden;
    }

    .profile-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 5px;
      background: linear-gradient(90deg, var(--fl-orange), var(--fl-orange-soft), transparent);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid #eeeeee;
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
    }

    .avatar {
      width: 76px;
      height: 76px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.75), transparent 34%),
        linear-gradient(135deg, #fff0e7, #ffd9c6);
      color: var(--fl-orange);
      font-size: 26px;
      font-weight: 950;
      flex: 0 0 auto;
      box-shadow: 0 16px 34px rgba(255, 90, 0, 0.16);
    }

    .identity strong {
      display: block;
      font-size: 24px;
      color: var(--fl-black);
      margin-bottom: 6px;
      letter-spacing: -0.035em;
      line-height: 1.15;
      word-break: break-word;
    }

    .identity span {
      color: #5f646d;
      font-size: 15px;
      word-break: break-word;
    }

    .card-header::after {
      content: "Keep your profile updated for smooth service updates and billing communication.";
      max-width: 340px;
      color: #5f6368;
      line-height: 1.45;
      font-size: 14px;
      padding-left: 42px;
      background:
        radial-gradient(circle at 15px 15px, rgba(255, 90, 0, 0.11) 0 15px, transparent 16px);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px 20px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      font-weight: 900;
      color: var(--fl-black);
    }

    input,
    textarea {
      width: 100%;
      padding: 15px 16px;
      border-radius: 14px;
      border: 1px solid #dcdfe4;
      background: white;
      outline: none;
      font-size: 15px;
      color: var(--fl-black);
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      min-height: 52px;
    }

    textarea {
      min-height: 118px;
      resize: vertical;
      line-height: 1.5;
    }

    input:focus,
    textarea:focus {
      border-color: rgba(255, 90, 0, 0.62);
      box-shadow: 0 0 0 4px rgba(255, 90, 0, 0.12);
      background: #fffdfb;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 18px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--fl-orange), var(--fl-orange-hover));
      color: white;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, border-color 0.18s ease;
      box-shadow: 0 14px 28px rgba(255, 90, 0, 0.22);
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 34px rgba(255, 90, 0, 0.28);
    }

    .btn.secondary {
      background: #fff;
      color: var(--fl-orange);
      border: 1px solid rgba(255, 90, 0, 0.42);
      box-shadow: none;
    }

    .btn.secondary:hover {
      background: rgba(255, 90, 0, 0.055);
      border-color: var(--fl-orange);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.65;
      transform: none;
      box-shadow: none;
    }

    .btn:focus-visible,
    .customer-nav a:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(255, 90, 0, 0.22);
      outline-offset: 2px;
    }

    .status {
      min-height: 22px;
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.45;
      color: #5f6368;
      border-radius: 14px;
      padding: 0;
    }

    .status:not(:empty) {
      padding: 12px 14px;
      background: #fafafa;
      border: 1px solid #eeeeee;
    }

    .status.success {
      color: #14532d;
      background: #f0fdf4;
      border-color: rgba(22, 163, 74, 0.22);
      font-weight: 800;
    }

    .status.error {
      color: #7f1d1d;
      background: #fef2f2;
      border-color: rgba(220, 38, 38, 0.22);
      font-weight: 800;
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .brand {
        border-right: none;
        padding-right: 0;
      }

      #logoutTopBtn {
        margin-top: 0;
        justify-self: start;
      }

      .card-header::after {
        max-width: none;
        width: 100%;
      }
    }

    @media (max-width: 720px) {
      body {
        padding: 14px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .profile-card {
        padding: 22px 18px;
        border-radius: 22px;
      }

      .card-header {
        align-items: flex-start;
      }

      .identity {
        align-items: flex-start;
      }

      .brand span {
        font-size: 24px;
      }

      .brand-mark {
        width: 62px;
        height: 48px;
        font-size: 25px;
      }

      h1 {
        font-size: 34px;
      }

      .customer-nav a {
        flex: 1 1 auto;
      }

      .actions {
        flex-direction: column-reverse;
      }

      .btn {
        width: 100%;
      }
    }

    @media (max-width: 460px) {
      .identity {
        flex-direction: column;
      }

      .avatar {
        width: 68px;
        height: 68px;
        border-radius: 20px;
      }

      .card-header::after {
        padding-left: 0;
        background: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="page fx-layout-public">
    <section class="hero fx-hero fx-section-head">
      <div class="brand">
        <div class="brand-mark">FL</div>
        <span>FairLinx</span>
      </div>

      <div class="hero-main">
        <h1>FairLinx Customer Profile</h1>
        <p>Manage your personal information and contact details.</p>
        <nav class="customer-nav" aria-label="Customer navigation">
          <a href="/customer-dashboard.html">Dashboard</a>
          <a href="/marketplace.html">Marketplace</a>
          <a href="/discover.html">Discover</a>
          <a href="/messages.html">Messages</a>
          <a href="/customer-profile.html">Profile</a>
          <a href="#" id="customerLogoutLink">Logout</a>
        </nav>
      </div>

      <button id="logoutTopBtn" class="btn secondary fx-btn fx-btn--secondary" type="button">Log Out</button>
    </section>

    <section class="profile-card fx-card">
      <div class="card-header">
        <div class="identity">
          <div id="avatar" class="avatar">CU</div>
          <div>
            <strong id="profileName">Customer Profile</strong>
            <span id="profileEmail">Loading profile...</span>
          </div>
        </div>
      </div>

      <form id="profileForm">
        <div class="form-grid">
          <label class="field fx-field">First Name <input id="firstName" class="fx-input" autocomplete="given-name" required></label>
          <label class="field fx-field">Last Name <input id="lastName" class="fx-input" autocomplete="family-name" required></label>
          <label class="field fx-field">Email <input id="email" class="fx-input" type="email" autocomplete="email" required></label>
          <label class="field fx-field">Phone <input id="phone" class="fx-input" type="tel" autocomplete="tel"></label>
          <label class="field full fx-field">Address <textarea id="address" class="fx-textarea" autocomplete="street-address"></textarea></label>
        </div>

        <div class="actions">
          <button id="logoutBtn" class="btn secondary fx-btn fx-btn--secondary" type="button">Log Out</button>
          <button id="saveBtn" class="btn fx-btn fx-btn--primary" type="submit">Save Profile</button>
        </div>
        <div id="status" class="status fx-alert" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const API_BASE = (window.AppAPI && window.AppAPI.base) || window.location.origin;
    const form = document.getElementById("profileForm");
    const statusBox = document.getElementById("status");
    const saveBtn = document.getElementById("saveBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const logoutTopBtn = document.getElementById("logoutTopBtn");
    const customerLogoutLink = document.getElementById("customerLogoutLink");

    function customerToken() {
      return localStorage.getItem("customerToken");
    }

    function setStatus(message, type) {
      statusBox.textContent = message || "";
      statusBox.className = "status" + (type ? " " + type : "");
    }

    function readStoredCustomer() {
      try {
        return JSON.parse(localStorage.getItem("customer") || "null") || {};
      } catch (err) {
        return {};
      }
    }

    function normalizeProfile(profile) {
      const fullName = String(profile.name || "").trim();
      const parts = fullName.split(/\s+/).filter(Boolean);
      return {
        first_name: profile.first_name || profile.firstName || parts[0] || "",
        last_name: profile.last_name || profile.lastName || parts.slice(1).join(" ") || "",
        email: profile.email || "",
        phone: profile.phone || "",
        address: profile.address || ""
      };
    }

    function fillProfile(profile) {
      const data = normalizeProfile(profile || {});
      document.getElementById("firstName").value = data.first_name;
      document.getElementById("lastName").value = data.last_name;
      document.getElementById("email").value = data.email;
      document.getElementById("phone").value = data.phone;
      document.getElementById("address").value = data.address;
      updateHeader();
    }

    function currentPayload() {
      return {
        first_name: document.getElementById("firstName").value.trim(),
        last_name: document.getElementById("lastName").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        address: document.getElementById("address").value.trim()
      };
    }

    function updateHeader() {
      const payload = currentPayload();
      const name = [payload.first_name, payload.last_name].filter(Boolean).join(" ") || "Customer Profile";
      const initials = [payload.first_name, payload.last_name].filter(Boolean).map(part => part[0]).join("").slice(0, 2).toUpperCase() || "CU";
      document.getElementById("profileName").textContent = name;
      document.getElementById("profileEmail").textContent = payload.email || "No email on file";
      document.getElementById("avatar").textContent = initials;
    }

    async function loadProfile() {
      const stored = readStoredCustomer();
      if (Object.keys(stored).length) fillProfile(stored);

      if (!customerToken()) {
        setStatus("No customer session found. Log in before saving profile changes.", "error");
        return;
      }

      setStatus("Loading your profile...", "");
      try {
        const res = await fetch(API_BASE + "/customer/profile", {
          method: "GET",
          headers: { Authorization: "Bearer " + customerToken() }
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || data.message || "Profile is not available yet.");

        const profile = data.profile || data.customer || data;
        fillProfile(profile);
        localStorage.setItem("customer", JSON.stringify(profile));
        setStatus("Profile loaded.", "success");
      } catch (err) {
        if (Object.keys(stored).length) {
          setStatus("Using locally saved profile details until the profile API is available.", "");
        } else {
          setStatus(err.message || "Profile is not available yet.", "error");
        }
      }
    }

    function logout() {
      localStorage.removeItem("customerToken");
      localStorage.removeItem("customer");
      window.location.href = "/customer-login-v2.html";
    }

    form.addEventListener("input", updateHeader);
    logoutBtn.addEventListener("click", logout);
    logoutTopBtn.addEventListener("click", logout);
    customerLogoutLink.addEventListener("click", function(event) {
      event.preventDefault();
      logout();
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (!customerToken()) {
        setStatus("No customer session found. Log in before saving profile changes.", "error");
        return;
      }

      const payload = currentPayload();
      saveBtn.disabled = true;
      setStatus("Saving profile...", "");

      try {
        const res = await fetch(API_BASE + "/customer/profile", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + customerToken()
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || data.message || "Unable to save profile.");

        const profile = data.profile || data.customer || payload;
        localStorage.setItem("customer", JSON.stringify(profile));
        fillProfile(profile);
        setStatus("Profile saved successfully.", "success");
      } catch (err) {
        setStatus(err.message || "Unable to save profile.", "error");
      } finally {
        saveBtn.disabled = false;
      }
    });

    loadProfile();
  </script>
</body>
</html>
