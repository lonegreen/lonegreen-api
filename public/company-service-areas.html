<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Service Areas</title>
  <link rel="stylesheet" href="/css/brand.css">

  <link rel="stylesheet" href="/app-shell.css">
  <style>
    * { box-sizing: border-box; font-family: Inter, Arial, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #edf5f0 0%, #f7f9f8 180px, #f4f6f8 100%);
      color: var(--brand-black);
      padding: 20px;
    }
    .page {
      width: min(1140px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 14px;
    }
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0 0 6px;
      color: var(--brand-primary);
      font-size: 32px;
    }
    .muted {
      margin: 0;
      color: #648076;
      line-height: 1.45;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.18s ease;
    }
    .btn.primary {
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-primary-hover));
      color: #fff;
      box-shadow: 0 12px 28px rgba(31,92,58,0.20);
    }
    .btn.secondary {
      background: var(--brand-bg);
      color: var(--brand-primary);
      border: 1px solid var(--brand-border);
    }
    .btn.danger {
      background: #b42318;
      color: #fff;
    }
    .btn.small {
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 12px;
      box-shadow: none;
    }
    .btn:disabled { opacity: 0.65; cursor: not-allowed; }
    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .status {
      min-height: 20px;
      color: #5f6e66;
      font-size: 14px;
    }
    .status.error { color: #b42318; font-weight: 700; }
    .status.success { color: #027a48; font-weight: 700; }
    .panel {
      background: #fff;
      border: 1px solid var(--brand-border);
      border-radius: 16px;
      box-shadow: 0 14px 30px rgba(16,24,40,0.06);
      padding: 16px;
      display: grid;
      gap: 12px;
    }
    .panel h2 {
      margin: 0;
      color: var(--brand-primary);
      font-size: 20px;
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--brand-border);
      border-radius: 12px;
      background: #fff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }
    th, td {
      text-align: left;
      vertical-align: top;
      padding: 10px;
      border-bottom: 1px solid #e7efea;
    }
    th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #648076;
      background: #f7faf8;
      font-weight: 900;
    }
    tr:last-child td { border-bottom: none; }
    input {
      width: 100%;
      border: 1px solid var(--brand-border);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 14px;
      color: var(--brand-black);
      outline: none;
      background: #fff;
    }
    input:focus {
      border-color: #2c8b55;
      box-shadow: 0 0 0 4px rgba(44,139,85,0.12);
    }
    .empty {
      border: 1px dashed var(--brand-border);
      border-radius: 12px;
      background: #f8fcf9;
      padding: 18px;
      text-align: center;
      color: #648076;
      line-height: 1.5;
    }
    @media (max-width: 860px) {
      body { padding: 14px; }
      h1 { font-size: 28px; }
      .actions { width: 100%; }
      .btn { width: 100%; }
      .btn.small { width: auto; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div>
        <h1>Service Coverage Areas</h1>
        <p class="muted">Manage ZIP and radius-based coverage areas for your company.</p>
      </div>
      <div class="actions">
        <button id="addAreaBtn" class="btn secondary" type="button">Add Area</button>
        <button id="saveAreasBtn" class="btn primary" type="button">Save Areas</button>
      </div>
    </section>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <section class="panel">
      <h2>Company Service Areas</h2>
      <div id="emptyState" class="empty" style="display:none;">No service areas yet. Add your first area.</div>
      <div class="table-wrap" id="tableWrap">
        <table>
          <thead>
            <tr>
              <th>ZIP Code</th>
              <th>City</th>
              <th>State</th>
              <th>Radius (Miles)</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="areasBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const API_BASE = (window.AppAPI && window.AppAPI.base) || window.location.origin;
    const token = localStorage.getItem("token");
    let currentUser = null;
    try { currentUser = JSON.parse(localStorage.getItem("user") || "null"); } catch (_) { currentUser = null; }

    const state = {
      rows: []
    };

    const els = {
      status: document.getElementById("status"),
      body: document.getElementById("areasBody"),
      empty: document.getElementById("emptyState"),
      tableWrap: document.getElementById("tableWrap"),
      addBtn: document.getElementById("addAreaBtn"),
      saveBtn: document.getElementById("saveAreasBtn")
    };

    function companyId() {
      const id = currentUser && Number(currentUser.company_id);
      return Number.isInteger(id) && id > 0 ? id : 0;
    }

    function setStatus(message, type) {
      els.status.textContent = message || "";
      els.status.className = "status" + (type ? " " + type : "");
    }

    function authHeaders(extra) {
      const headers = Object.assign({}, extra || {});
      if (token) headers.Authorization = "Bearer " + token;
      return headers;
    }

    function createEmptyRow() {
      return {
        zip_code: "",
        city: "",
        state: "",
        radius_miles: 0
      };
    }

    function render() {
      if (!state.rows.length) {
        els.empty.style.display = "block";
        els.tableWrap.style.display = "none";
        els.body.innerHTML = "";
        return;
      }

      els.empty.style.display = "none";
      els.tableWrap.style.display = "block";
      els.body.innerHTML = state.rows.map((row, index) => {
        return (
          '<tr>' +
            '<td><input type="text" data-field="zip_code" data-index="' + index + '" value="' + String(row.zip_code || "").replace(/"/g, "&quot;") + '" placeholder="12345" maxlength="10"></td>' +
            '<td><input type="text" data-field="city" data-index="' + index + '" value="' + String(row.city || "").replace(/"/g, "&quot;") + '" placeholder="City"></td>' +
            '<td><input type="text" data-field="state" data-index="' + index + '" value="' + String(row.state || "").replace(/"/g, "&quot;") + '" placeholder="ST" maxlength="2"></td>' +
            '<td><input type="number" data-field="radius_miles" data-index="' + index + '" value="' + Number(row.radius_miles || 0) + '" min="0" step="1"></td>' +
            '<td><button class="btn danger small" type="button" data-action="remove-row" data-index="' + index + '">Remove</button></td>' +
          '</tr>'
        );
      }).join("");
    }

    function normalizeZip(zip) {
      return String(zip || "").replace(/\D/g, "").slice(0, 5);
    }

    function validateRows(rows) {
      for (let i = 0; i < rows.length; i += 1) {
        const row = rows[i];
        if (!row.zip_code) {
          return "ZIP code is required for every area.";
        }
        const radius = Number(row.radius_miles);
        if (!Number.isFinite(radius) || radius < 0) {
          return "Radius must be 0 or greater.";
        }
      }
      return "";
    }

    function buildPayload() {
      const cleaned = state.rows.map((row) => ({
        zip_code: normalizeZip(row.zip_code),
        city: String(row.city || "").trim(),
        state: String(row.state || "").trim().toUpperCase(),
        radius_miles: Math.max(0, Math.round(Number(row.radius_miles || 0))),
        active: true
      }));

      return {
        service_areas: cleaned
      };
    }

    async function loadAreas() {
      if (!token || !companyId()) {
        setStatus("Missing account session. Sign in first.", "error");
        return;
      }

      setStatus("Loading service areas...", "");
      try {
        const res = await fetch(API_BASE + "/companies/" + encodeURIComponent(companyId()) + "/service-areas");
        const data = await res.json().catch(() => []);
        if (!res.ok) {
          throw new Error((data && data.error) || "Unable to load service areas.");
        }
        state.rows = (Array.isArray(data) ? data : []).map((item) => ({
          zip_code: item.zip_code || "",
          city: item.city || "",
          state: item.state || "",
          radius_miles: Number(item.radius_miles || 0)
        }));
        render();
        setStatus("Service areas loaded.", "");
      } catch (err) {
        state.rows = [];
        render();
        setStatus(err.message || "Unable to load service areas.", "error");
      }
    }

    async function saveAreas() {
      if (!token || !companyId()) {
        setStatus("Missing account session. Sign in first.", "error");
        return;
      }

      const payload = buildPayload();
      const validationError = validateRows(payload.service_areas);
      if (validationError) {
        setStatus(validationError, "error");
        return;
      }

      els.saveBtn.disabled = true;
      setStatus("Saving service areas...", "");
      try {
        const res = await fetch(API_BASE + "/companies/service-areas", {
          method: "PUT",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "Unable to save service areas.");
        setStatus("Service areas saved successfully.", "success");
        await loadAreas();
      } catch (err) {
        setStatus(err.message || "Unable to save service areas.", "error");
      } finally {
        els.saveBtn.disabled = false;
      }
    }

    els.addBtn.addEventListener("click", function() {
      state.rows.push(createEmptyRow());
      render();
    });

    els.saveBtn.addEventListener("click", saveAreas);

    els.body.addEventListener("input", function(event) {
      const target = event.target;
      if (!target) return;
      const index = Number(target.getAttribute("data-index"));
      const field = target.getAttribute("data-field");
      if (!Number.isInteger(index) || !field || !state.rows[index]) return;
      state.rows[index][field] = target.value;
    });

    els.body.addEventListener("click", function(event) {
      const btn = event.target.closest("[data-action='remove-row']");
      if (!btn) return;
      const index = Number(btn.getAttribute("data-index"));
      if (!Number.isInteger(index) || !state.rows[index]) return;
      state.rows.splice(index, 1);
      render();
    });

    loadAreas();
  </script>
</body>
</html>
