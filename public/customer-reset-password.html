<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FairLinx Customer Password Reset</title>
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/app-shell.css">
  
</head>
<body class="phase5-public fx-layout-public">
  <main class="auth-shell fx-min-w-0">
    <div class="brand-logo">
      <div class="brand-mark">FL</div>
      <span>FairLinx</span>
    </div>

    <form id="resetPasswordForm">
      <h1>Reset your password</h1>
      <p>Enter a new password for your customer account. This link expires after the reset window closes.</p>

      <div class="field fx-field">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Enter a new password" minlength="8" required>
      </div>

      <div class="field fx-field">
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm your new password" minlength="8" required>
      </div>

      <button id="submitBtn" class="btn fx-btn" type="submit">Reset Password</button>
      <a class="link" href="/customer-login-v2.html">Back to login</a>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const API_BASE = (window.AppAPI && window.AppAPI.base) || window.location.origin;
    const form = document.getElementById("resetPasswordForm");
    const statusBox = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const query = new URLSearchParams(window.location.search);
    const resetToken = String(query.get("token") || "").trim();

    function setStatus(message, type) {
      statusBox.textContent = message || "";
      statusBox.className = "status" + (type ? " " + type : "");
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (!resetToken) {
        setStatus("This reset link is missing a token. Request a new password reset email.", "error");
        return;
      }

      if (password.length < 8) {
        setStatus("Password must be at least 8 characters.", "error");
        return;
      }

      if (password !== confirmPassword) {
        setStatus("Passwords do not match.", "error");
        return;
      }

      submitBtn.disabled = true;
      setStatus("Resetting your password...", "");

      try {
        const res = await fetch(API_BASE + "/auth/customer-reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            token: resetToken,
            password,
            confirm_password: confirmPassword
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || data.message || "Unable to reset password.");

        setStatus(data.message || "Password reset. You can now sign in.", "success");
        passwordInput.value = "";
        confirmPasswordInput.value = "";
      } catch (err) {
        setStatus(err.message || "Unable to reset password.", "error");
      } finally {
        submitBtn.disabled = false;
      }
    });

    if (!resetToken) {
      setStatus("This reset link is missing a token. Request a new password reset email.", "error");
      submitBtn.disabled = true;
    } else {
      passwordInput.focus();
    }
  </script>
</body>
</html>
