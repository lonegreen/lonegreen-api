<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FairLinx Customer Password Help</title>
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/app-shell.css">

  <style>
    :root {
      --fl-orange: #FF5A00;
      --fl-orange-hover: #E64A00;
      --fl-orange-light: #FF8A33;
      --fl-black: #111111;
      --fl-gray: #2B2B2B;
      --fl-muted: #747474;
      --fl-border: #D9D9D9;
      --fl-bg: #F5F5F5;
      --fl-white: #FFFFFF;
      --fl-success: #16A34A;
      --fl-error: #DC2626;
    }

    * {
      box-sizing: border-box;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 92% 18%, rgba(255, 90, 0, 0.42), transparent 24%),
        radial-gradient(circle at 0% 88%, rgba(255, 90, 0, 0.22), transparent 28%),
        radial-gradient(circle at 12% 18%, rgba(255, 90, 0, 0.10) 0 2px, transparent 2px),
        linear-gradient(135deg, #050505 0%, #111111 48%, #1c1c1c 100%);
      background-size: auto, auto, 28px 28px, auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 34px 18px;
      color: var(--fl-black);
    }

    .auth-shell {
      width: min(760px, 100%);
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 30px;
      padding: 48px 56px;
      box-shadow: 0 34px 110px rgba(0, 0, 0, 0.42);
      position: relative;
      overflow: hidden;
    }

    .auth-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 85% 0%, rgba(255, 90, 0, 0.08), transparent 34%),
        linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.98));
      pointer-events: none;
    }

    .auth-shell > * {
      position: relative;
      z-index: 1;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-weight: 950;
      color: var(--fl-black);
      font-size: 34px;
      margin-bottom: 42px;
      letter-spacing: -0.05em;
    }

    .brand-logo span::first-letter {
      color: var(--fl-orange);
    }

    .brand-mark {
      width: 78px;
      height: 58px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--fl-orange), var(--fl-orange-light));
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 950;
      letter-spacing: -0.12em;
      box-shadow: 0 18px 40px rgba(255, 90, 0, 0.28);
      transform: skew(-8deg);
    }

    form {
      width: 100%;
    }

    form::before {
      content: "Customer Account Recovery";
      display: inline-flex;
      align-items: center;
      margin-bottom: 28px;
      padding: 12px 18px;
      border-radius: 16px;
      background: rgba(255, 90, 0, 0.08);
      border: 1px solid rgba(255, 90, 0, 0.12);
      color: var(--fl-orange-hover);
      font-size: 16px;
      font-weight: 850;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(38px, 6vw, 56px);
      line-height: 0.96;
      letter-spacing: -0.065em;
      color: var(--fl-black);
    }

    p {
      margin: 0 0 32px;
      color: #565656;
      font-size: 20px;
      line-height: 1.45;
      max-width: 620px;
    }

    .field {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 12px;
      color: var(--fl-black);
    }

    input {
      width: 100%;
      min-height: 72px;
      padding: 18px 20px;
      border-radius: 16px;
      border: 1px solid #cfd3d8;
      background: white;
      outline: none;
      font-size: 20px;
      transition: 0.18s ease;
      color: var(--fl-black);
      box-shadow: inset 0 1px 0 rgba(17, 17, 17, 0.03);
    }

    input::placeholder {
      color: #9ca3af;
    }

    input:focus {
      border-color: var(--fl-orange);
      box-shadow: 0 0 0 5px rgba(255, 90, 0, 0.13);
    }

    .btn {
      width: 100%;
      min-height: 74px;
      padding: 18px 22px;
      border: none;
      border-radius: 17px;
      background: linear-gradient(135deg, var(--fl-orange), var(--fl-orange-hover));
      color: white;
      font-size: 22px;
      font-weight: 950;
      cursor: pointer;
      transition: 0.18s ease;
      box-shadow: 0 20px 42px rgba(255, 90, 0, 0.28);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .btn::before {
      content: "➤";
      font-size: 20px;
      transform: rotate(-18deg);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 24px 50px rgba(255, 90, 0, 0.34);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.72;
      transform: none;
    }

    .btn:disabled::before {
      content: "";
      width: 18px;
      height: 18px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.38);
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      transform: none;
    }

    .link {
      display: flex;
      justify-content: center;
      margin: 30px 0 0;
      color: var(--fl-orange-hover);
      font-weight: 900;
      text-decoration: none;
      font-size: 18px;
    }

    .link::before {
      content: "←";
      margin-right: 8px;
    }

    .link:hover {
      text-decoration: underline;
    }

    .status {
      min-height: 0;
      margin-top: 30px;
      font-size: 17px;
      line-height: 1.55;
      color: #5f6e66;
      border-radius: 18px;
    }

    .status:not(:empty) {
      padding: 20px 22px;
      border: 1px solid rgba(255, 90, 0, 0.18);
      background: rgba(255, 90, 0, 0.06);
      color: var(--fl-black);
      font-weight: 750;
    }

    .status.success {
      color: var(--fl-success);
      background: rgba(22, 163, 74, 0.08);
      border-color: rgba(22, 163, 74, 0.20);
      font-weight: 850;
    }

    .status.error {
      color: var(--fl-error);
      background: rgba(220, 38, 38, 0.08);
      border-color: rgba(220, 38, 38, 0.20);
      font-weight: 850;
    }

    form::after {
      content: "Your security is our priority. We never share your information.";
      display: block;
      margin-top: 34px;
      padding-top: 24px;
      border-top: 1px solid #e5e5e5;
      color: #8a8f98;
      font-size: 15px;
      text-align: center;
      line-height: 1.5;
    }

    body::after {
      content: "© 2025 FairLinx. All rights reserved.";
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.74);
      font-size: 14px;
      white-space: nowrap;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 620px) {
      body {
        padding: 18px 14px 54px;
        align-items: flex-start;
      }

      .auth-shell {
        padding: 34px 22px;
        border-radius: 24px;
      }

      .brand-logo {
        font-size: 28px;
        margin-bottom: 32px;
      }

      .brand-mark {
        width: 62px;
        height: 48px;
        font-size: 22px;
      }

      form::before {
        font-size: 13px;
        padding: 10px 13px;
        margin-bottom: 22px;
      }

      h1 {
        font-size: 38px;
      }

      p {
        font-size: 16px;
        margin-bottom: 26px;
      }

      label {
        font-size: 15px;
      }

      input {
        min-height: 58px;
        font-size: 16px;
      }

      .btn {
        min-height: 60px;
        font-size: 17px;
      }

      .link {
        font-size: 15px;
      }

      .status {
        font-size: 14px;
      }

      body::after {
        font-size: 12px;
        bottom: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="auth-shell">
    <div class="brand-logo">
      <div class="brand-mark">FL</div>
      <span>FairLinx</span>
    </div>

    <form id="forgotPasswordForm">
      <h1>Reset your password</h1>
      <p>Enter the email connected to your customer account. If the account exists, a reset link can be sent by the API.</p>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="Enter your email address" required>
      </div>

      <button id="submitBtn" class="btn" type="submit">Send Reset Link</button>
      <a class="link" href="/customer-login-v2.html">Back to login</a>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const API_BASE = (window.AppAPI && window.AppAPI.base) || window.location.origin;
    const form = document.getElementById("forgotPasswordForm");
    const statusBox = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");

    function setStatus(message, type) {
      statusBox.textContent = message || "";
      statusBox.className = "status" + (type ? " " + type : "");
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      submitBtn.disabled = true;
      setStatus("Requesting a reset link...", "");

      try {
        const res = await fetch(API_BASE + "/auth/customer-forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: document.getElementById("email").value.trim() })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || data.message || "Unable to request a reset link.");

        setStatus(data.message || "If that email exists, reset instructions will be sent.", "success");
      } catch (err) {
        setStatus(err.message || "Unable to request a reset link.", "error");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
