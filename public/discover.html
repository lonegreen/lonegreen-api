<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Discover Companies</title>
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/app-shell.css">
  <link rel="stylesheet" href="/ui-cleanup.css">  
</head>
<body class="phase2-internal discover-ds-page">
  <header class="fx-min-w-0">
    <nav class="customer-nav fx-cluster" id="sessionNav" aria-label="Customer navigation"></nav>
  </header>
  <main class="page fx-layout-public marketplace-ds discover-marketplace-page fx-page fx-page--dense fx-min-w-0">
    <header class="hero fx-hero fx-section-head discover-page-hero">
      <div class="fx-stack fx-min-w-0">
        <h1 class="fx-h3">Discover Companies</h1>
        <p class="fx-caption">Search and filter public company listings.</p>
      </div>
    </header>
    <section class="panel fx-card fx-min-w-0" aria-labelledby="category-heading">
      <h2 id="category-heading" class="fx-h3">Categories</h2>
      <div id="categoryNav" class="category-nav fx-min-w-0"></div>
    </section>
    <section class="panel sticky-filters fx-toolbar fx-card fx-min-w-0" aria-labelledby="filters-heading">
      <h2 id="filters-heading" class="fx-h3">Filters</h2>
      <div class="filters-grid fx-form-grid">
        <div class="field fx-field"><label for="searchInput">Search</label><input id="searchInput" class="fx-input" type="text" placeholder="Company, service, or keyword"></div>
        <div class="field fx-field"><label for="categoryFilter">Category</label><select id="categoryFilter" class="fx-select"><option value="">All categories</option></select></div>
        <div class="field fx-field"><label for="locationFilter">City or Zip</label><input id="locationFilter" class="fx-input" type="text" placeholder="e.g. Austin or 78701"></div>
        <div class="field fx-field"><label for="sortFilter">Sort</label><select id="sortFilter" class="fx-select"><option value="closest_match">Closest Match</option><option value="best_rated">Best Rated</option><option value="most_reviewed">Most Reviewed</option><option value="fastest_response">Fastest Response</option></select></div>
        <button id="clearFiltersBtn" type="button" class="btn secondary fx-btn fx-btn--secondary">Clear Filters</button>
        <button id="refreshBtn" type="button" class="btn secondary fx-btn fx-btn--secondary">Refresh</button>
      </div>
      <div id="statusLine" class="status-line fx-alert" role="status" aria-live="polite"></div>
    </section>
    <section class="panel fx-card fx-min-w-0" aria-labelledby="results-heading">
      <h2 id="results-heading" class="fx-h3">Public Companies <span id="resultsCount" class="pill fx-badge fx-badge--info">0 Results</span></h2>
      <div id="cards" class="cards fx-min-w-0"></div>
    </section>
  </main>
  <script>
    (function() {
      const FAVORITES_KEY = "discover:favorites";
      const FOLLOWS_KEY = "discover:follows";
      const TOP_CATEGORIES = ["Cleaning","Plumbing","HVAC","Electrical","Landscaping","Moving","Repairs","Pressure Washing"];
      const state = {
        companies: [],
        filtered: [],
        favorites: new Set(),
        follows: new Set(),
        filters: { search: "", category: "", location: "", sort: "closest_match", topCategory: "" }
      };
      const els = {
        refreshBtn: document.getElementById("refreshBtn"),
        searchInput: document.getElementById("searchInput"),
        categoryFilter: document.getElementById("categoryFilter"),
        locationFilter: document.getElementById("locationFilter"),
        sortFilter: document.getElementById("sortFilter"),
        categoryNav: document.getElementById("categoryNav"),
        clearFiltersBtn: document.getElementById("clearFiltersBtn"),
        statusLine: document.getElementById("statusLine"),
        resultsCount: document.getElementById("resultsCount"),
        cards: document.getElementById("cards"),
        sessionNav: document.getElementById("sessionNav")
      };

      function esc(v){ return String(v==null?"":v).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}
      function txt(v,f){ return (v===null||v===undefined||v==="")?(f||""):String(v); }

      function apiTrustBadgesHtml(c){
        var raw = c && c.trust_badges;
        var list = [];
        if(Array.isArray(raw)) list = raw;
        else if(raw && typeof raw === "string" && raw.trim()){
          try { list = JSON.parse(raw); } catch(_) { list = []; }
        }
        if(!Array.isArray(list) || !list.length) return "";
        return list.slice(0, 6).map(function(b){
          return b && b.label ? '<span class="trust-pill info fx-badge fx-badge--neutral">'+esc(b.label)+"</span>" : "";
        }).join("");
      }

      function isSafeHttpUrl(value){
        const raw = String(value || "").trim();
        if(!raw) return false;
        if(raw.startsWith("/")) return true;
        if(raw.startsWith("./") || raw.startsWith("../")) return true;
        try {
          const parsed = new URL(raw, window.location.origin);
          return parsed.protocol === "http:" || parsed.protocol === "https:";
        } catch(_) {
          return false;
        }
      }

      function setStatus(m,t){ els.statusLine.textContent=m||""; els.statusLine.className="status-line fx-alert"+(t?" "+t:""); }
      function toArray(p){ if(Array.isArray(p))return p; if(!p||typeof p!=="object")return []; if(Array.isArray(p.items))return p.items; if(Array.isArray(p.data))return p.data; if(Array.isArray(p.companies))return p.companies; return []; }
      function parseSet(k){ try{ const p=JSON.parse(localStorage.getItem(k)||"[]"); return new Set(Array.isArray(p)?p.map(String):[]);}catch(_){return new Set();}}
      function persistSet(k,s){ localStorage.setItem(k,JSON.stringify(Array.from(s))); }
      function companyId(c){ return String(c.id||c.public_slug||c.name||""); }
      function hasCustomerSession(){ return Boolean(localStorage.getItem("customerToken")); }
      function getAnyAuthToken(){ return String(localStorage.getItem("customerToken") || localStorage.getItem("token") || "").trim(); }

      async function submitCompanyReport(companyId){
        const token = getAnyAuthToken();
        if(!token){
          alert("Please log in as a customer or company user to submit a report.");
          return;
        }
        const reason = String(window.prompt("Report reason (required):", "misleading profile") || "").trim();
        if(reason.length < 3){
          alert("A short reason is required.");
          return;
        }
        const details = String(window.prompt("Additional details (optional):", "") || "").trim();
        const res = await fetch("/companies/" + encodeURIComponent(String(companyId || "")) + "/report", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({ reason: reason, details: details })
        });
        const payload = await res.json().catch(function(){ return {}; });
        if(!res.ok) throw new Error(payload.error || "Unable to submit report.");
        alert("Report submitted. Thank you for helping keep FairLinx safe.");
      }

      function renderSessionNav(){
        if(hasCustomerSession()){
          els.sessionNav.innerHTML = [
            '<a href="/customer-dashboard.html">Dashboard</a>',
            '<a href="/marketplace.html">Marketplace</a>',
            '<a href="/discover.html">Discover</a>',
            '<a href="/messages.html">Messages</a>',
            '<a href="/customer-profile.html">Profile</a>',
            '<a href="#" data-customer-logout="true">Logout</a>'
          ].join("");
          return;
        }
        els.sessionNav.innerHTML = [
          '<a href="/index.html">Home</a>',
          '<a href="/discover.html">Find Services</a>',
          '<a href="/customer-login-v2.html">Customer Login</a>',
          '<a href="/customer-signup.html">Request Service</a>'
        ].join("");
      }

      function getRating(c){ const a=Number(c.rating_avg||c.average_rating||c.rating||0); const n=Number(c.rating_count||c.reviews_count||c.review_count||0); if(a>0&&n>0)return a.toFixed(1)+" ("+n+" reviews)"; if(n>0)return n+" reviews"; return "No ratings yet"; }

      function getRatingDetail(c){
        const a=Number(c.rating_avg||c.average_rating||c.rating||0);
        const n=Number(c.rating_count||c.reviews_count||c.review_count||0);
        if(a>0&&n>0) return { average:a.toFixed(1), count:n };
        return { average:"-", count:n>0?n:0 };
      }

      function getServices(c){ const s=Array.isArray(c.services)?c.services:[]; if(s.length)return s; return (Array.isArray(c.marketplace_services)?c.marketplace_services:[]).map(function(x){return txt(x.display_name||(x.category&&x.category.name)||x.custom_name,"");}).filter(Boolean); }
      function getAreas(c){ const a=Array.isArray(c.service_areas)?c.service_areas:[]; if(a.length)return a; return (Array.isArray(c.marketplace_service_areas)?c.marketplace_service_areas:[]).map(function(x){return [x.city,x.state,x.zip_code].filter(Boolean).join(", ").replace(/, ([A-Z]{2}),/,", $1 ");}).filter(Boolean); }
      function getAvail(c){ const b=Array.isArray(c.business_hours)?c.business_hours:[]; if(b.length)return b.slice(0,2); const map=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]; return (Array.isArray(c.availability)?c.availability:[]).slice(0,2).map(function(s){const d=map[Number(s.day_of_week)]||"Day"; return s.is_closed?d+": Closed":d+": "+txt(s.start_time,"--:--")+"-"+txt(s.end_time,"--:--");}); }
      function getCompletedJobs(c){ return Number(c.completed_jobs||c.completedJobs||c.jobs_completed||0); }

      function getReputationScore(c){
        var score = Number(c && c.reputation_score != null ? c.reputation_score : 0);
        if(!Number.isFinite(score) || score <= 0) return "Neutral";
        return score.toFixed(2);
      }

      function getResponsePreview(c){
        const trust=c&&c.trust?c.trust:{};
        const mins=Number(c.response_time_minutes||trust.response_time_minutes||0);
        if(mins>0) return "~"+mins+" min";
        const hours=Number(c.response_time_hours||trust.response_time_hours||0);
        if(hours>0) return "~"+hours+" hr";
        return "Not published";
      }

      function responseSortValue(c){
        const trust=c&&c.trust?c.trust:{};
        const mins=Number(c.response_time_minutes||trust.response_time_minutes||0);
        if(mins>0) return mins;
        const hours=Number(c.response_time_hours||trust.response_time_hours||0);
        if(hours>0) return hours*60;
        return Number.MAX_SAFE_INTEGER;
      }

      function renderTopCategories(){
        const chips = ['<button type="button" class="category-chip'+(state.filters.topCategory?'':' active')+'" data-top-category="">All</button>'].concat(
          TOP_CATEGORIES.map(function(name){
            const active = state.filters.topCategory===name ? " active" : "";
            return '<button type="button" class="category-chip'+active+'" data-top-category="'+esc(name)+'">'+esc(name)+'</button>';
          })
        );
        els.categoryNav.innerHTML = chips.join("");
      }

      function populateCategory(){ const set=new Set(); state.companies.forEach(function(c){ getServices(c).forEach(function(s){ if(s)set.add(String(s)); }); }); const opts=Array.from(set).sort(); els.categoryFilter.innerHTML='<option value="">All categories</option>'+opts.map(function(o){const sel=state.filters.category===o?" selected":""; return '<option value="'+esc(o)+'"'+sel+">"+esc(o)+"</option>";}).join(""); }

      function applyFilters(){
        const s=state.filters.search.trim().toLowerCase(), cat=state.filters.category.trim().toLowerCase(), loc=state.filters.location.trim().toLowerCase();
        state.filtered=state.companies.filter(function(c){
          const services=getServices(c), areas=getAreas(c);
          const topCat = state.filters.topCategory.trim().toLowerCase();
          const hay=[c.name,c.public_description,c.contact&&c.contact.address,services.join(" "),areas.join(" ")].join(" ").toLowerCase();
          const catPass=!cat||services.some(function(x){return String(x).toLowerCase()===cat;});
          const topCatPass=!topCat||services.some(function(x){return String(x).toLowerCase().indexOf(topCat)!==-1;});
          const locPass=!loc||areas.join(" ").toLowerCase().indexOf(loc)!==-1;
          const searchPass=!s||hay.indexOf(s)!==-1;
          return catPass&&topCatPass&&locPass&&searchPass;
        });
        const sortBy = state.filters.sort;
        state.filtered.sort(function(a,b){
          const ar=Number(a.rating_avg||a.average_rating||a.rating||0);
          const br=Number(b.rating_avg||b.average_rating||b.rating||0);
          const ac=Number(a.rating_count||a.reviews_count||a.review_count||0);
          const bc=Number(b.rating_count||b.reviews_count||b.review_count||0);
          if(sortBy==="best_rated"){ if(br!==ar) return br-ar; return bc-ac; }
          if(sortBy==="most_reviewed"){ if(bc!==ac) return bc-ac; return br-ar; }
          if(sortBy==="fastest_response"){ return responseSortValue(a)-responseSortValue(b); }
          const aScore = (ar*10) + ac + (a.is_verified?2:0);
          const bScore = (br*10) + bc + (b.is_verified?2:0);
          return bScore-aScore;
        });
      }

      function render(){
        els.resultsCount.textContent=state.filtered.length+(state.filtered.length===1?" Result":" Results");
        if(!state.filtered.length){
          els.cards.innerHTML='<div class="empty fx-empty" style="grid-column:1 / -1;"><strong class="fx-empty__title">No companies found</strong><span class="fx-empty__text">Try a broader search, another category, or request service directly.</span>'+
            '<div class="empty-actions">'+
            '<button type="button" id="emptyClearFilters" class="fx-btn fx-btn--secondary">Broaden Search</button>'+
            '<button type="button" id="emptyBrowseCategories" class="fx-btn fx-btn--secondary">Browse Categories</button>'+
            '<a href="/marketplace.html" class="fx-btn fx-btn--primary">Request Service Instead</a>'+
            "</div></div>";
          return;
        }
        els.cards.innerHTML=state.filtered.map(function(c){
          const id=companyId(c), initials=txt(c.name,"C").slice(0,2).toUpperCase(), fav=state.favorites.has(id), fol=state.follows.has(id);
          const services=getServices(c).slice(0,4), areas=getAreas(c).slice(0,3), avail=getAvail(c).slice(0,2);
          const responsePreview=getResponsePreview(c);
          const rating=getRatingDetail(c);
          const completedJobs = getCompletedJobs(c);
          const areaPreview = areas.length ? areas[0] : "No area listed";
          const href=c.public_slug?"/company-profile.html?slug="+encodeURIComponent(c.public_slug):"#";
          const logoUrl = isSafeHttpUrl(c.logo_url) ? String(c.logo_url).trim() : "";
          const trust = c && c.trust ? c.trust : {};
          const isVerified = trust.verification_status === "verified";
          const isLicensed = trust.license_status === "verified";
          const isInsured = trust.insurance_status === "verified";
          const requestUrl = c.public_slug?"/marketplace.html?company="+encodeURIComponent(c.public_slug):"/marketplace.html";
          return '<article class="card fx-card">'+
            '<div class="card-top"><div class="company-head">'+
              (logoUrl?'<img class="logo" src="'+esc(logoUrl)+'" alt="'+esc(txt(c.name,"Company"))+' logo">':'<div class="logo-fallback" aria-hidden="true">'+esc(initials)+"</div>")+
              '<div><h3 class="company-name">'+esc(txt(c.name,"Company"))+'</h3><p class="rating">Rating: '+esc(getRating(c))+'</p>'+
              '<div class="trust-row">'+
              (isVerified?'<span class="trust-pill verified fx-badge fx-badge--success">Verified</span>':'<span class="trust-pill warn fx-badge fx-badge--warning">Verification Pending</span>')+
              (isLicensed?'<span class="trust-pill info fx-badge fx-badge--info">Licensed</span>':'')+
              (isInsured?'<span class="trust-pill info fx-badge fx-badge--info">Insured</span>':'')+
              '<span class="trust-pill info fx-badge fx-badge--info">Reviews: '+esc(String(rating.count))+'</span>'+
              '<span class="trust-pill fx-badge fx-badge--neutral">Response: '+esc(responsePreview)+'</span>'+
              apiTrustBadgesHtml(c)+
              "</div></div></div>"+
              (isVerified?'<span class="badge verified fx-badge fx-badge--success">Verified</span>':'')+
            '</div><p class="summary">'+esc(txt(c.public_description,"No public company description available."))+'</p>'+
            '<div class="trust-grid">'+
              '<article class="trust-item fx-stat"><span class="fx-stat__label">Rating</span><strong class="fx-stat__value">'+esc(rating.average)+"/5</strong></article>"+
              '<article class="trust-item fx-stat"><span class="fx-stat__label">Reviews</span><strong class="fx-stat__value">'+esc(String(rating.count))+'</strong></article>'+
              '<article class="trust-item fx-stat"><span class="fx-stat__label">Response</span><strong class="fx-stat__value">'+esc(responsePreview)+'</strong></article>'+
              '<article class="trust-item fx-stat"><span class="fx-stat__label">Completed Jobs</span><strong class="fx-stat__value">'+esc(completedJobs>0?String(completedJobs):"Not published")+'</strong></article>'+
              '<article class="trust-item fx-stat"><span class="fx-stat__label">Reputation</span><strong class="fx-stat__value">'+esc(getReputationScore(c))+'</strong></article>'+
            "</div>"+
            '<div class="meta-group"><p class="meta-label">Primary Services</p><div class="chip-row">'+(services.length?services.map(function(v){return '<span class="chip">'+esc(v)+"</span>";}).join(""):'<span class="chip muted">No services listed</span>')+'</div></div>'+
            '<div class="meta-group"><p class="meta-label">Service Areas</p><div class="chip-row">'+(areas.length?areas.map(function(v){return '<span class="chip">'+esc(v)+"</span>";}).join(""):'<span class="chip muted">No service areas listed</span>')+'</div></div>'+
            '<div class="meta-group"><p class="meta-label">Area Preview</p><div class="chip-row"><span class="chip">'+esc(areaPreview)+'</span></div></div>'+
            '<div class="meta-group"><p class="meta-label">Availability Preview</p><div class="chip-row">'+(avail.length?avail.map(function(v){return '<span class="chip">'+esc(v)+"</span>";}).join(""):'<span class="chip muted">No availability published</span>')+'</div></div>'+
            '<div class="actions"><button class="btn secondary fx-btn fx-btn--secondary" type="button" data-favorite-id="'+esc(id)+'">'+(fav?"Saved":"Save/Favorite")+'</button><a class="profile-link fx-btn fx-btn--primary" href="'+esc(requestUrl)+'">Book now</a><a class="profile-link fx-btn fx-btn--secondary" href="'+esc(requestUrl)+'">Request quote</a></div>'+
            '<button class="btn secondary fx-btn fx-btn--secondary" type="button" data-report-company-id="'+esc(String(c.id||""))+'">Report Company</button>'+
            '<a class="profile-link fx-btn fx-btn--secondary" href="'+esc(href)+'"'+(c.public_slug?"":' aria-disabled="true"')+'>View Profile</a>'+
          "</article>";
        }).join("");
      }

      async function loadCompanies(){
        setStatus("Loading companies...","");
        els.refreshBtn.disabled=true;
        try{
          const res=await fetch("/companies/public");
          const payload=await res.json().catch(function(){return [];});
          if(!res.ok) throw new Error(payload.error||"Unable to load companies.");
          state.companies=toArray(payload);
          populateCategory(); renderTopCategories(); applyFilters(); render();
          setStatus("Companies loaded.","ok");
        }catch(err){
          state.companies=[]; state.filtered=[]; render();
          setStatus(err.message||"Unable to load companies.","error");
        }finally{ els.refreshBtn.disabled=false; }
      }

      function bind(){
        els.refreshBtn.addEventListener("click",loadCompanies);
        els.searchInput.addEventListener("input",function(){ state.filters.search=els.searchInput.value; applyFilters(); render(); });
        els.categoryFilter.addEventListener("change",function(){ state.filters.category=els.categoryFilter.value; applyFilters(); render(); });
        els.locationFilter.addEventListener("input",function(){ state.filters.location=els.locationFilter.value; applyFilters(); render(); });
        els.sortFilter.addEventListener("change", function(){ state.filters.sort=els.sortFilter.value; applyFilters(); render(); });
        els.categoryNav.addEventListener("click", function(e){
          const chip=e.target.closest("[data-top-category]");
          if(!chip) return;
          state.filters.topCategory=chip.getAttribute("data-top-category")||"";
          renderTopCategories();
          applyFilters();
          render();
        });
        els.clearFiltersBtn.addEventListener("click",function(){
          state.filters.search=""; state.filters.category=""; state.filters.location=""; state.filters.topCategory=""; state.filters.sort="closest_match";
          els.searchInput.value=""; els.categoryFilter.value=""; els.locationFilter.value=""; els.sortFilter.value="closest_match";
          renderTopCategories();
          applyFilters(); render();
        });
        els.cards.addEventListener("click",function(e){
          const favBtn=e.target.closest("[data-favorite-id]"), folBtn=e.target.closest("[data-follow-id]");
          if(favBtn){ const id=favBtn.getAttribute("data-favorite-id"); if(state.favorites.has(id))state.favorites.delete(id); else state.favorites.add(id); persistSet(FAVORITES_KEY,state.favorites); render(); }
          if(folBtn){ const id=folBtn.getAttribute("data-follow-id"); if(state.follows.has(id))state.follows.delete(id); else state.follows.add(id); persistSet(FOLLOWS_KEY,state.follows); render(); }
          const reportBtn=e.target.closest("[data-report-company-id]");
          if(reportBtn){
            const companyId = reportBtn.getAttribute("data-report-company-id");
            submitCompanyReport(companyId).catch(function(err){ alert(err && err.message ? err.message : "Unable to submit report."); });
          }
          if(e.target.closest("#emptyClearFilters")){
            state.filters.search=""; state.filters.category=""; state.filters.location=""; state.filters.topCategory=""; state.filters.sort="closest_match";
            els.searchInput.value=""; els.categoryFilter.value=""; els.locationFilter.value=""; els.sortFilter.value="closest_match";
            renderTopCategories();
            applyFilters();
            render();
          }
          if(e.target.closest("#emptyBrowseCategories")){
            state.filters.topCategory="";
            renderTopCategories();
            applyFilters();
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
          }
        });
        els.sessionNav.addEventListener("click", function(event){
          if(!event.target.closest("[data-customer-logout]")) return;
          event.preventDefault();
          localStorage.removeItem("customerToken");
          localStorage.removeItem("customer");
          renderSessionNav();
          window.location.href = "/customer-login-v2.html";
        });
      }

      function init(){
        state.favorites=parseSet(FAVORITES_KEY);
        state.follows=parseSet(FOLLOWS_KEY);
        renderSessionNav();
        renderTopCategories();
        bind();
        render();
        loadCompanies();
      }

      init();
    })();
  </script>
</body>
</html>
