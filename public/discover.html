<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FairLinx | Discover Companies</title>
  <link rel="stylesheet" href="/app-shell.css">
  <link rel="stylesheet" href="/ui-cleanup.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, Arial, sans-serif; color: #173327; background: radial-gradient(circle at top left, rgba(31,92,58,.08), transparent 28%), linear-gradient(180deg,#edf5f0 0%,#f6f8f7 210px,#f4f6f8 100%); padding: 22px; }
    .page { width: min(1240px,100%); margin: 0 auto; display: grid; gap: 16px; }
    .hero { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; }
    .hero h1 { margin:0 0 6px; color:#1f5c3a; font-size:32px; letter-spacing:-.02em; }
    .hero p { margin:0; color:#60786e; line-height:1.5; }
    .hero-actions { display:flex; gap:10px; flex-wrap:wrap; }
    .btn { border:none; border-radius:12px; padding:10px 14px; font:inherit; font-weight:800; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease; }
    .btn:hover:not(:disabled){ transform:translateY(-1px); }
    .btn.secondary { background:#edf6f0; color:#1f5c3a; border:1px solid #d0dfd5; }
    .btn:disabled { opacity:.62; cursor:not-allowed; transform:none; box-shadow:none; }
    .panel { background:rgba(255,255,255,.96); border:1px solid #dbe7df; border-radius:16px; box-shadow:0 18px 38px rgba(16,24,40,.06); padding:16px; display:grid; gap:12px; }
    .filters-grid { display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:10px; align-items:end; }
    .field { display:grid; gap:6px; min-width:0; }
    .field label { font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:#4f6a5f; }
    input, select { width:100%; border:1px solid #d6e3db; border-radius:11px; background:#fff; color:#173327; padding:10px 12px; font:inherit; outline:none; }
    input:focus, select:focus { border-color:#a8cab8; box-shadow:0 0 0 2px rgba(31,92,58,.12); }
    .status-line { min-height:18px; color:#60786e; font-size:13px; font-weight:700; }
    .status-line.error { color:#b42318; } .status-line.ok { color:#166534; }
    .results-head { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
    .results-head h2 { margin:0; color:#1f5c3a; font-size:22px; }
    .pill { display:inline-flex; align-items:center; justify-content:center; border-radius:999px; padding:6px 10px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; background:#eef7f2; color:#1f5c3a; }
    .cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .card { border:1px solid #dce9e2; border-radius:14px; background:#fff; padding:12px; display:grid; gap:10px; }
    .card-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .company-head { display:flex; align-items:center; gap:10px; min-width:0; }
    .logo, .logo-fallback { width:48px; height:48px; border-radius:12px; border:1px solid #dce9e2; flex-shrink:0; }
    .logo { background:#f5faf7; object-fit:cover; }
    .logo-fallback { background:#eef7f2; color:#1f5c3a; display:grid; place-items:center; font-weight:900; }
    .company-name { margin:0; color:#173327; font-size:16px; font-weight:900; overflow-wrap:anywhere; }
    .rating { margin:2px 0 0; color:#637b71; font-size:12px; }
    .badge { border-radius:999px; padding:4px 9px; font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.03em; background:#eef7f2; color:#1f5c3a; white-space:nowrap; }
    .summary { margin:0; color:#5c756b; font-size:13px; line-height:1.5; min-height:40px; }
    .meta-group { display:grid; gap:7px; }
    .meta-label { font-size:11px; color:#678075; text-transform:uppercase; letter-spacing:.04em; font-weight:800; margin:0; }
    .chip-row { display:flex; flex-wrap:wrap; gap:6px; }
    .chip { border:1px solid #dce9e2; border-radius:999px; padding:4px 8px; font-size:11px; color:#2f4f43; background:#f8fbf9; font-weight:700; }
    .chip.muted { border-style:dashed; color:#6d857b; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .actions .btn { width:100%; padding:9px 10px; font-size:13px; }
    .profile-link { display:inline-flex; width:100%; justify-content:center; align-items:center; border-radius:11px; border:1px solid #d0dfd5; background:#edf6f0; color:#1f5c3a; text-decoration:none; padding:10px 12px; font-size:13px; font-weight:800; }
    .profile-link:hover { transform:translateY(-1px); border-color:#1f5c3a; }
    .empty { border:1px dashed #d5e3db; border-radius:12px; background:#f8fbf9; padding:16px; color:#657d73; font-size:13px; line-height:1.5; text-align:center; }
    .empty strong { display:block; margin-bottom:5px; color:#173327; }
    @media (max-width:1140px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr));} .filters-grid{grid-template-columns:1fr 1fr;} }
    @media (max-width:760px){ body{padding:14px;} .hero h1{font-size:28px;} .hero-actions{width:100%;display:grid;grid-template-columns:1fr;} .hero-actions .btn,.cards,.filters-grid,.actions{grid-template-columns:1fr;width:100%;} }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div>
        <h1>Discover Companies</h1>
        <p>Find verified providers by service, city, and coverage area.</p>
      </div>
      <div class="hero-actions">
        <button id="refreshBtn" type="button" class="btn secondary">Refresh</button>
      </div>
    </header>
    <section class="panel">
      <div class="filters-grid">
        <div class="field">
          <label for="searchInput">Search</label>
          <input id="searchInput" type="text" placeholder="Company, service, or keyword">
        </div>
        <div class="field">
          <label for="categoryFilter">Category</label>
          <select id="categoryFilter"><option value="">All categories</option></select>
        </div>
        <div class="field">
          <label for="locationFilter">City or Zip</label>
          <input id="locationFilter" type="text" placeholder="e.g. Austin or 78701">
        </div>
        <button id="clearFiltersBtn" type="button" class="btn secondary">Clear Filters</button>
      </div>
      <div id="statusLine" class="status-line" role="status" aria-live="polite"></div>
    </section>
    <section class="panel">
      <div class="results-head">
        <h2>Public Companies</h2>
        <span id="resultsCount" class="pill">0 Results</span>
      </div>
      <div id="cards" class="cards"></div>
    </section>
  </main>

  <script>
    (function() {
      const FAVORITES_KEY = "discover:favorites";
      const FOLLOWS_KEY = "discover:follows";
      const state = { companies: [], filtered: [], favorites: new Set(), follows: new Set(), filters: { search: "", category: "", location: "" } };
      const els = {
        refreshBtn: document.getElementById("refreshBtn"),
        searchInput: document.getElementById("searchInput"),
        categoryFilter: document.getElementById("categoryFilter"),
        locationFilter: document.getElementById("locationFilter"),
        clearFiltersBtn: document.getElementById("clearFiltersBtn"),
        statusLine: document.getElementById("statusLine"),
        resultsCount: document.getElementById("resultsCount"),
        cards: document.getElementById("cards")
      };
      function esc(v){ return String(v==null?"":v).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}
      function txt(v,f){ return (v===null||v===undefined||v==="")?(f||""):String(v); }
      function setStatus(m,t){ els.statusLine.textContent=m||""; els.statusLine.className="status-line"+(t?" "+t:""); }
      function toArray(p){ if(Array.isArray(p))return p; if(!p||typeof p!=="object")return []; if(Array.isArray(p.items))return p.items; if(Array.isArray(p.data))return p.data; if(Array.isArray(p.companies))return p.companies; return []; }
      function parseSet(k){ try{ const p=JSON.parse(localStorage.getItem(k)||"[]"); return new Set(Array.isArray(p)?p.map(String):[]);}catch(_){return new Set();}}
      function persistSet(k,s){ localStorage.setItem(k,JSON.stringify(Array.from(s))); }
      function companyId(c){ return String(c.id||c.public_slug||c.name||""); }
      function getRating(c){ const a=Number(c.rating_avg||c.average_rating||c.rating||0); const n=Number(c.rating_count||c.reviews_count||c.review_count||0); if(a>0&&n>0)return a.toFixed(1)+" ("+n+" reviews)"; if(n>0)return n+" reviews"; return "No ratings yet"; }
      function getServices(c){ const s=Array.isArray(c.services)?c.services:[]; if(s.length)return s; return (Array.isArray(c.marketplace_services)?c.marketplace_services:[]).map(function(x){return txt(x.display_name||(x.category&&x.category.name)||x.custom_name,"");}).filter(Boolean); }
      function getAreas(c){ const a=Array.isArray(c.service_areas)?c.service_areas:[]; if(a.length)return a; return (Array.isArray(c.marketplace_service_areas)?c.marketplace_service_areas:[]).map(function(x){return [x.city,x.state,x.zip_code].filter(Boolean).join(", ").replace(/, ([A-Z]{2}),/,", $1 ");}).filter(Boolean); }
      function getAvail(c){ const b=Array.isArray(c.business_hours)?c.business_hours:[]; if(b.length)return b.slice(0,2); const map=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]; return (Array.isArray(c.availability)?c.availability:[]).slice(0,2).map(function(s){const d=map[Number(s.day_of_week)]||"Day"; return s.is_closed?d+": Closed":d+": "+txt(s.start_time,"--:--")+"-"+txt(s.end_time,"--:--");}); }
      function populateCategory(){ const set=new Set(); state.companies.forEach(function(c){ getServices(c).forEach(function(s){ if(s)set.add(String(s)); }); }); const opts=Array.from(set).sort(); els.categoryFilter.innerHTML='<option value="">All categories</option>'+opts.map(function(o){const sel=state.filters.category===o?" selected":""; return '<option value="'+esc(o)+'"'+sel+">"+esc(o)+"</option>";}).join(""); }
      function applyFilters(){
        const s=state.filters.search.trim().toLowerCase(), cat=state.filters.category.trim().toLowerCase(), loc=state.filters.location.trim().toLowerCase();
        state.filtered=state.companies.filter(function(c){
          const services=getServices(c), areas=getAreas(c);
          const hay=[c.name,c.public_description,c.contact&&c.contact.address,services.join(" "),areas.join(" ")].join(" ").toLowerCase();
          const catPass=!cat||services.some(function(x){return String(x).toLowerCase()===cat;});
          const locPass=!loc||areas.join(" ").toLowerCase().indexOf(loc)!==-1;
          const searchPass=!s||hay.indexOf(s)!==-1;
          return catPass&&locPass&&searchPass;
        });
      }
      function render(){
        els.resultsCount.textContent=state.filtered.length+(state.filtered.length===1?" Result":" Results");
        if(!state.filtered.length){ els.cards.innerHTML='<div class="empty" style="grid-column:1 / -1;"><strong>No companies found</strong>Try a broader search, different category, or another city/zip.</div>'; return; }
        els.cards.innerHTML=state.filtered.map(function(c){
          const id=companyId(c), initials=txt(c.name,"C").slice(0,2).toUpperCase(), fav=state.favorites.has(id), fol=state.follows.has(id);
          const services=getServices(c).slice(0,4), areas=getAreas(c).slice(0,3), avail=getAvail(c).slice(0,2);
          const href=c.public_slug?"/company-public-profile.html?slug="+encodeURIComponent(c.public_slug):"#";
          return '<article class="card">'+
            '<div class="card-top"><div class="company-head">'+
              (c.logo_url?'<img class="logo" src="'+esc(c.logo_url)+'" alt="'+esc(txt(c.name,"Company"))+' logo">':'<div class="logo-fallback" aria-hidden="true">'+esc(initials)+"</div>")+
              '<div><h3 class="company-name">'+esc(txt(c.name,"Company"))+'</h3><p class="rating">Rating: '+esc(getRating(c))+'</p></div></div>'+(c.is_verified?'<span class="badge">Verified</span>':"")+
            '</div><p class="summary">'+esc(txt(c.public_description,"No public company description available."))+'</p>'+
            '<div class="meta-group"><p class="meta-label">Services</p><div class="chip-row">'+(services.length?services.map(function(v){return '<span class="chip">'+esc(v)+"</span>";}).join(""):'<span class="chip muted">No services listed</span>')+'</div></div>'+
            '<div class="meta-group"><p class="meta-label">Service Areas</p><div class="chip-row">'+(areas.length?areas.map(function(v){return '<span class="chip">'+esc(v)+"</span>";}).join(""):'<span class="chip muted">No service areas listed</span>')+'</div></div>'+
            '<div class="meta-group"><p class="meta-label">Availability Preview</p><div class="chip-row">'+(avail.length?avail.map(function(v){return '<span class="chip">'+esc(v)+"</span>";}).join(""):'<span class="chip muted">No availability published</span>')+'</div></div>'+
            '<div class="actions"><button class="btn secondary" type="button" data-favorite-id="'+esc(id)+'">'+(fav?"Favorited":"Favorite")+'</button><button class="btn secondary" type="button" data-follow-id="'+esc(id)+'">'+(fol?"Following":"Follow")+'</button></div>'+
            '<a class="profile-link" href="'+esc(href)+'"'+(c.public_slug?"":' aria-disabled="true"')+'>View Company Profile</a>'+
          "</article>";
        }).join("");
      }
      async function loadCompanies(){
        setStatus("Loading companies...","");
        els.refreshBtn.disabled=true;
        try{
          const res=await fetch("/companies/public");
          const payload=await res.json().catch(function(){return [];});
          if(!res.ok) throw new Error(payload.error||"Unable to load companies.");
          state.companies=toArray(payload);
          populateCategory(); applyFilters(); render();
          setStatus("Companies loaded.","ok");
        }catch(err){
          state.companies=[]; state.filtered=[]; render();
          setStatus(err.message||"Unable to load companies.","error");
        }finally{ els.refreshBtn.disabled=false; }
      }
      function bind(){
        els.refreshBtn.addEventListener("click",loadCompanies);
        els.searchInput.addEventListener("input",function(){ state.filters.search=els.searchInput.value; applyFilters(); render(); });
        els.categoryFilter.addEventListener("change",function(){ state.filters.category=els.categoryFilter.value; applyFilters(); render(); });
        els.locationFilter.addEventListener("input",function(){ state.filters.location=els.locationFilter.value; applyFilters(); render(); });
        els.clearFiltersBtn.addEventListener("click",function(){
          state.filters.search=""; state.filters.category=""; state.filters.location="";
          els.searchInput.value=""; els.categoryFilter.value=""; els.locationFilter.value="";
          applyFilters(); render();
        });
        els.cards.addEventListener("click",function(e){
          const favBtn=e.target.closest("[data-favorite-id]"), folBtn=e.target.closest("[data-follow-id]");
          if(favBtn){ const id=favBtn.getAttribute("data-favorite-id"); if(state.favorites.has(id))state.favorites.delete(id); else state.favorites.add(id); persistSet(FAVORITES_KEY,state.favorites); render(); }
          if(folBtn){ const id=folBtn.getAttribute("data-follow-id"); if(state.follows.has(id))state.follows.delete(id); else state.follows.add(id); persistSet(FOLLOWS_KEY,state.follows); render(); }
        });
      }
      function init(){
        state.favorites=parseSet(FAVORITES_KEY);
        state.follows=parseSet(FOLLOWS_KEY);
        bind();
        render();
        loadCompanies();
      }
      init();
    })();
  </script>
</body>
</html>
